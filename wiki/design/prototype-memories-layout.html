const rowB = (m, i, q) => `<div class="xjm-brow${i === st.sel ? ' xjm-sel' : ''}" data-i="${i}" role="button" tabindex="-1"><div class="xjm-brow-top">${tag(m)}<span class="name">${hl(m.name, q)}</span></div><div class="desc">${descHtml(m, q)}</div></div>`;

function emptyHtml(q, others) {
  const msg = q ? `没有匹配「${esc(q)}」的经验。` : (st.type !== 'all' ? `这里没有 ${st.type} 类型的经验。` : '还没有经验沉淀。');
  const more = st.project && others > 0 ? `<p>另有 ${others} 条在其它项目。<button class="wikilink" data-act="all-proj">搜全部项目</button></p>` : '';
  return `<div class="empty"><p>${msg}</p>${more}</div>`;
}

function groupsHtml(list, q, row, withPanel) {
  const groups = new Map();
  list.forEach((m, i) => { (groups.get(m.project) || groups.set(m.project, []).get(m.project)).push([m, i]); });
  return [...groups.entries()].map(([p, rows]) => withPanel
    ? `<div class="mem-group"><h2>${esc(p)} <span class="path">${esc(pathOf(p))}</span></h2><div class="panel">${rows.map(([m, i]) => row(m, i, q)).join('')}</div></div>`
    : `<div class="xjm-bgroup">${esc(p)}<span class="xjm-n">${rows.length}</span></div>${rows.map(([m, i]) => row(m, i, q)).join('')}`).join('');
}

function render() {
  const q = st.q.trim();
  const all = pool();
  const counts = projectsOf(all);
  const rank = new Map(ALL_PROJ.map(([p], i) => [p, i]));
  // 新方案里「全部项目」的分组顺序与项目栏一致(按条数降序);现状保持线上的字母序
  const list = st.variant === 'now' ? all : all.filter(m => !st.project || m.project === st.project).sort((x, y) => rank.get(x.project) - rank.get(y.project));
  st.list = list;
  if (st.sel >= list.length) st.sel = list.length - 1;
  if (st.variant === 'b' && st.sel < 0 && list.length) st.sel = 0;
  const others = all.length - list.length;

  $('#xjm-sub').textContent = `${DATA.length} 条,来自 ${ALL_PROJ.length} 个项目`;
  $$('[data-xjm-variant]').forEach(el => (el.hidden = el.dataset.xjmVariant !== st.variant));
  const root = $(`[data-xjm-variant="${st.variant}"]`);
  $('[data-xjm-types]', root).innerHTML = typeTabs();
  const inp = $('[data-xjm-q]', root);
  if (inp.value !== st.q) inp.value = st.q;
  const cnt = $('[data-xjm-count]', root);
  if (cnt) cnt.innerHTML = (q || st.type !== 'all' || st.project ? `${list.length} 条` : '') + (q && st.project && others > 0 ? `<button data-act="all-proj">另有 ${others} 条在其它项目</button>` : '');

  if (st.variant === 'now') {
    $('[data-xjm-list="now"]').innerHTML = list.length ? groupsHtml(list, '', rowA, true) : emptyHtml(q, 0);
  }

  if (st.variant === 'a') {
    const item = (p, n, label) => `<button data-p="${esc(p ?? '')}" class="${(st.project ?? '') === (p ?? '') ? 'active' : ''}${n === 0 ? ' xjm-zero' : ''}" title="${esc(p ? pathOf(p) : '全部项目')}"><span class="xjm-pname">${esc(label)}</span><span class="xjm-n">${n}</span></button>`;
    $('[data-xjm-rail]').innerHTML = item(null, all.length, '全部项目') + '<span class="xjm-rail-sep"></span>' + ALL_PROJ.map(([p]) => item(p, counts.get(p) || 0, p)).join('');
    $('[data-xjm-list="a"]').innerHTML = list.length ? groupsHtml(list, q, rowA, true) : emptyHtml(q, others);
  }

  if (st.variant === 'b') {
    const chip = (p, n, label) => `<button class="xjm-chip${(st.project ?? '') === (p ?? '') ? ' active' : ''}${n === 0 ? ' xjm-zero' : ''}" data-p="${esc(p ?? '')}" title="${esc(p ? pathOf(p) : '全部项目')}">${esc(label)}<span class="xjm-n">${n}</span></button>`;
    const top = ALL_PROJ.slice(0, CHIP_TOP), rest = ALL_PROJ.slice(CHIP_TOP);
    const inRest = st.project && rest.some(([p]) => p === st.project);
    const menuOpen = !$('.xjm-menu')?.hidden && !!$('.xjm-menu');
    $('[data-xjm-chips]').innerHTML = chip(null, all.length, '全部') + top.map(([p]) => chip(p, counts.get(p) || 0, p)).join('')
      + (inRest ? chip(st.project, counts.get(st.project) || 0, st.project) : '')
      + (rest.length ? `<span class="xjm-more"><button class="xjm-chip" data-act="more" aria-haspopup="menu" aria-expanded="${menuOpen}">其余 ${rest.length} 个项目 ▾</button><div class="xjm-menu" role="menu" ${menuOpen ? '' : 'hidden'}>${rest.map(([p]) => `<button role="menuitem" data-p="${esc(p)}" class="${st.project === p ? 'active' : ''}"><span class="xjm-pname">${esc(p)}</span><span class="xjm-n">${counts.get(p) || 0}</span></button>`).join('')}</div></span>` : '');
    $('[data-xjm-list="b"]').innerHTML = list.length ? (st.project ? list.map((m, i) => rowB(m, i, q)).join('') : groupsHtml(list, q, rowB, false)) : emptyHtml(q, others);
    renderPane();
  }
  fill();
}

function linksHtml(m) {
  return m.links.length ? `<span style="font-size:0.75rem;color:var(--muted)">关联:</span>` + m.links.map(l => `<button class="wikilink" data-link="${esc(l)}">[[${esc(l)}]]</button>`).join('') : '';
}
function renderPane() {
  const pane = $('[data-xjm-pane]'), m = st.list[st.sel], q = st.q.trim();
  if (!m) { pane.innerHTML = `<div class="xjm-pane-empty">${st.list.length ? '选一条经验查看正文。' : '没有可显示的经验。'}</div>`; return; }
  pane.innerHTML = `<div class="xjm-pane-head"><h2>${hl(m.name, q)}</h2><div class="meta">${tag(m)}<span>${esc(m.project)}</span><span class="mono" style="font-size:0.6875rem">${esc(m.file)}</span><span class="xjm-pos">${st.sel + 1} / ${st.list.length}</span></div></div>`
    + `<div class="xjm-pane-body"><div class="mem-body" style="white-space:pre-wrap">${m.description ? `<p style="color:var(--muted);margin-bottom:14px">${hl(m.description, q)}</p>` : ''}${hl(m.body, q)}</div></div>`
    + (m.links.length ? `<div class="xjm-pane-foot">${linksHtml(m)}</div>` : '');
  const first = $('.xjm-pane-body .xjm-hit', pane);
  if (first) { const b = $('.xjm-pane-body', pane); b.scrollTop = Math.max(0, first.offsetTop - b.offsetTop - 80); }
}

/* ---------- 抽屉(方案 A / 现状;DOM 照抄 shared.tsx Drawer) ---------- */
function openDrawer(m) {
  const q = st.variant === 'now' ? '' : st.q.trim();
  $('#xjm-dr').innerHTML = `<div class="drawer-head"><div style="min-width:0;flex:1"><h2>${esc(m.name)}</h2><div class="meta">${tag(m)}<span>${esc(m.project)}</span><span class="mono" style="font-size:0.6875rem">${esc(m.file)}</span></div></div><button class="x-btn" data-act="close" aria-label="关闭">✕</button></div>`
    + `<div class="drawer-body"><div class="mem-body" style="white-space:pre-wrap">${m.description ? `<p style="color:var(--muted);margin-bottom:14px">${hl(m.description, q)}</p>` : ''}${hl(m.body, q)}</div></div>`
    + (m.links.length ? `<div class="drawer-foot">${linksHtml(m)}</div>` : '');
  $('#xjm-dr').classList.add('show'); $('#xjm-bd').classList.add('show');
  const first = $('#xjm-dr .xjm-hit');
  if (first) { const b = $('#xjm-dr .drawer-body'); b.scrollTop = Math.max(0, first.offsetTop - 80); }
}
const drawerOpen = () => $('#xjm-dr').classList.contains('show');
function closeDrawer() { $('#xjm-dr').classList.remove('show'); $('#xjm-bd').classList.remove('show'); }
function openByName(name) {
  const t = DATA.find(m => m.name === name);
  if (!t) return;
  if (st.variant === 'b') { st.q = ''; st.type = 'all'; st.project = t.project; render(); st.sel = st.list.indexOf(t); render(); scrollSel(); }
  else openDrawer(t);
}

function scrollSel() { $(`[data-xjm-variant="${st.variant}"] [data-i="${st.sel}"]`)?.scrollIntoView({ block: 'nearest' }); }
function move(d) {
  if (!st.list.length) return;
  st.sel = Math.min(st.list.length - 1, Math.max(0, st.sel + d));
  $$(`[data-xjm-variant="${st.variant}"] [data-i]`).forEach(el => el.classList.toggle('xjm-sel', +el.dataset.i === st.sel));
  if (st.variant === 'b') renderPane();
  scrollSel();
}

/** 让列表区占满视口剩余高度(线上用 flex 列实现,这里用脚本量) */
function fill() {
  const el = $(`[data-xjm-variant="${st.variant}"] .xjm-fill`);
  if (el) el.style.setProperty('--xjm-h', Math.max(320, innerHeight - el.getBoundingClientRect().top - scrollY - 48) + 'px');
}
addEventListener('resize', fill);

/* ---------- 事件 ---------- */
document.addEventListener('input', e => { if (e.target.matches('[data-xjm-q]')) { st.q = e.target.value; st.sel = -1; render(); } });
document.addEventListener('click', e => {
  const t = e.target.closest('button, [data-i]');
  const menu = $('.xjm-menu');
  if (menu && !menu.hidden && !e.target.closest('.xjm-more')) menu.hidden = true;
  if (!t) return;
  if (t.dataset.t) { st.type = t.dataset.t; st.sel = -1; render(); }
  else if (t.dataset.act === 'more') { menu.hidden = !menu.hidden; t.setAttribute('aria-expanded', String(!menu.hidden)); }
  else if (t.dataset.act === 'all-proj') { st.project = null; st.sel = -1; render(); }
  else if (t.dataset.act === 'close') closeDrawer();
  else if (t.dataset.link) openByName(t.dataset.link);
  else if (t.dataset.p !== undefined && t.closest('[data-xjm-rail], [data-xjm-chips]')) { if (menu) menu.hidden = true; st.project = t.dataset.p || null; st.sel = -1; render(); $(`[data-xjm-variant="${st.variant}"] .xjm-scroll`).scrollTop = 0; }
  else if (t.dataset.i !== undefined) { st.sel = +t.dataset.i; if (st.variant === 'b') move(0); else { move(0); openDrawer(st.list[st.sel]); } }
});
$('#xjm-bd').onclick = closeDrawer;

document.addEventListener('keydown', e => {
  const inp = $(`[data-xjm-variant="${st.variant}"] [data-xjm-q]`);
  const typing = document.activeElement === inp;
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'f') {
    if (st.variant === 'now') return; // 现状:不接管,落到浏览器原生查找
    e.preventDefault(); closeDrawer(); inp.focus(); inp.select(); return;
  }
  if (e.key === 'Escape') {
    const menu = $('.xjm-menu');
    if (menu && !menu.hidden) { menu.hidden = true; return; }
    if (drawerOpen()) { closeDrawer(); return; }
    if (st.q) { st.q = ''; st.sel = -1; render(); return; }
    if (typing) inp.blur();
    return;
  }
  if (st.variant === 'now' || drawerOpen() || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === 'ArrowDown') { e.preventDefault(); move(1); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); move(-1); }
  else if (e.key === 'Enter' && st.variant === 'a' && st.sel >= 0) { e.preventDefault(); openDrawer(st.list[st.sel]); }
});

/* ---------- 原型开关 ---------- */
const sw = (sel, fn) => { const b = $(sel); b.onclick = () => { fn(); b.parentElement.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b)); }; };
const setVariant = v => { closeDrawer(); st.variant = v; st.sel = -1; render(); };
sw('#xjm-v-now', () => setVariant('now')); sw('#xjm-v-a', () => setVariant('a')); sw('#xjm-v-b', () => setVariant('b'));
const trySearch = v => { st.q = v; st.sel = -1; render(); };
$('#xjm-try-1').onclick = () => trySearch('角标'); $('#xjm-try-2').onclick = () => trySearch('WKWebView'); $('#xjm-try-3').onclick = () => trySearch('zzz');
const wallSvg = 'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000"><defs><radialGradient id="a" cx="30%" cy="20%" r="80%"><stop offset="0" stop-color="#2d4a3e"/><stop offset=".5" stop-color="#1b2a33"/><stop offset="1" stop-color="#0d1014"/></radialGradient></defs><rect width="1600" height="1000" fill="url(#a)"/><circle cx="1200" cy="260" r="220" fill="#3a5a4a" opacity=".35"/><circle cx="300" cy="760" r="300" fill="#2b3f5c" opacity=".3"/></svg>');
$('#wall').style.backgroundImage = `url("${wallSvg}")`;
const setWall = m => { document.body.classList.toggle('wall-on', m !== 'off'); document.body.classList.toggle('wall-glass', m === 'glass'); };
sw('#xjm-w0', () => setWall('off')); sw('#xjm-w1', () => setWall('on')); sw('#xjm-w2', () => setWall('glass'));
$('#xjm-data-note').textContent = FULL && FULL.length ? `数据:本机全量 ${DATA.length} 条(来自 /api/memories 导出)` : `数据:公开版 ${DATA.length} 条(璇玑真实经验 + 其它项目示意条目)`;

const v = new URLSearchParams(location.search).get('v');
if (v && ['now', 'a', 'b'].includes(v)) { st.variant = v; $$('#xjm-v-now, #xjm-v-a, #xjm-v-b').forEach(b => b.classList.toggle('on', b.id === 'xjm-v-' + v)); }
render();
$('.proto-hint b').onclick = () => $('.proto-hint').classList.toggle('xjm-min');

</script>
</body>
</html>
