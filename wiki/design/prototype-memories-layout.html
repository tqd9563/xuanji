<!--
  经验页布局原型(2026-11-27,待审批)。两套方案对比 + 现状对照,右下浮层切换。
  以线上 code/frontend/src/styles/index.css(v1.10.0)整份内联为底,侧栏 DOM 照抄获批原型 prototype-prompts.html,
  列表行 / 抽屉 / 筛选 tab 的 class 与 DOM 照抄 Memories.tsx、shared.tsx Drawer;
  新增样式全部前缀 xjm-,集中在 </style> 前一段(已 grep 线上表,无撞名)。
  方案 A「项目栏」:左侧项目栏 + 右侧列表,详情仍走抽屉。
  方案 B「阅读窗格」:顶部项目筛选条 + 列表 / 正文双栏,不开抽屉,搜索命中直接在正文里高亮。
  两案共有:⌘F 聚焦搜索框;搜索范围跟随所选项目;命中处高亮;↑↓ 选条。
  数据:公开仓库版只内嵌璇玑自身的经验 + 其它项目的示意条目;同目录存在 prototype-memories-layout.data.local.js(已 gitignore)时加载全量真实数据。
-->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>璇玑 · 原型 · 经验页布局</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap">
<style>
@import "tailwindcss";

/* ============================================================
   以下 token 与组件样式提取自获批原型 wiki/design/prototype.html,
   与根目录 DESIGN.md 同源;改动 token 必须先改 DESIGN.md。
   ============================================================ */

/* ============================================================
   璇玑 · 设计 token
   场景:终端旁常驻的个人观象台监控屏,深夜盯着 AI 代理机群运转。
   策略:Restrained — 近黑中性底(微量玉色调),玉色只给主操作与运行态。
   ============================================================ */
:root {
  /* 面 */
  --bg:        oklch(0.145 0.006 120);
  /* 面板基色的不透明原值。玻璃档会把 --surface 重定义成半透明,凡是「必须挡住壁纸」
     的底色(弹出菜单、模态、状态标记)都要混进这个值,而不是混进 --surface。 */
  --surface-opaque: oklch(0.185 0.008 120);
  --surface:   var(--surface-opaque);
  --surface-2: oklch(0.165 0.007 120);
  --hover:     oklch(0.215 0.009 120);
  --line:      oklch(0.27 0.010 120);
  --line-soft: oklch(0.225 0.009 120);
  /* 代码底色:输入框内代码区间的填充,比 composer 所在的 surface 亮一档半;
     与消息区 .md code「代码块比周围底浅一档」同一语汇 */
  --code-tint: oklch(0.265 0.011 120);

  /* 墨 */
  --ink:   oklch(0.93 0.008 110);
  --muted: oklch(0.71 0.015 110);
  --faint: oklch(0.60 0.012 110);

  /* 品牌 · 玉 */
  --jade:      oklch(0.80 0.13 115);
  --jade-dim:  oklch(0.68 0.10 115);
  --on-jade:   oklch(0.18 0.02 120);

  /* 状态(保留色,不作装饰) */
  --amber: oklch(0.78 0.14 80);
  --blue:  oklch(0.72 0.11 245);
  --violet: oklch(0.73 0.11 300);
  --red:   oklch(0.68 0.19 25);
  --green: oklch(0.74 0.12 155);
  /* 图表系列色:大面积填充专用,统一明度、降饱和,避免高亮块刺眼 */
  --chart-1: oklch(0.68 0.075 115);
  --chart-2: oklch(0.65 0.065 300);
  --chart-3: oklch(0.65 0.065 245);

  /* ToolCard 工具类别色:等明度分类公式 oklch(0.78 0.12 H),锁明度只转色相 */
  --tool-skill: oklch(0.78 0.12 345);  /* Skill / SlashCommand */
  --tool-exec:  oklch(0.78 0.13 180);  /* Bash / BashOutput / KillShell */
  --tool-write: oklch(0.78 0.12 55);   /* Edit / Write / NotebookEdit */

  /* 平台品牌色:只用于 PR/MR 卡片标识代码托管平台,不参与状态语义。
     取官方色相、按深色底提亮到可读明度(GitLab #FC6D26 / GitHub #8250DF) */
  --pr-gitlab: oklch(0.75 0.165 45);
  --pr-github: oklch(0.74 0.145 296);
  /* 读取/检索复用 --blue,编排/规划复用 --violet(与派发状态行的模型紫同族) */

  --tint-jade:  color-mix(in oklab, var(--jade) 13%, transparent);
  --tint-amber: color-mix(in oklab, var(--amber) 14%, transparent);
  --tint-blue:  color-mix(in oklab, var(--blue) 14%, transparent);
  --tint-green: color-mix(in oklab, var(--green) 14%, transparent);
  --tint-red:   color-mix(in oklab, var(--red) 15%, transparent);
  --tint-muted: color-mix(in oklab, var(--muted) 12%, transparent);
  --tint-violet: color-mix(in oklab, var(--violet) 14%, transparent);

  /* Claude 回答高亮(设置 › 外观 › 回答高亮;DESIGN.md §2「Markdown 回答高亮」)。
     只在 .md 正文里用:结构=紫(模型给出的骨架),h3 转 +45° 邻色,强调=琥珀 */
  --md-heading:   oklch(0.73 0.11 300);
  --md-heading-3: oklch(0.76 0.11 345);
  --md-strong:    oklch(0.78 0.14 80);
  --md-quote:     oklch(0.64 0.085 300);

  /* 字 */
  --sans: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;

  /* 层 */
  --z-dropdown: 10;
  --z-sticky: 20;
  --z-backdrop: 30;
  --z-drawer: 40;
  --z-toast: 50;

  --r-s: 6px;
  --r-m: 10px;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
}

* { margin: 0; padding: 0; box-sizing: border-box; }
/* 整站是暗色主题,向浏览器声明,让原生控件(日期选择器等)按暗色方案绘制。 */
html { font-size: 16px; color-scheme: dark; }
/* 全站统一 6px 细滚动条,不再逐个容器定义。
   Chromium/WebKit 走 ::-webkit-scrollbar:它会把 macOS 的原生 overlay 滚动条(悬停时展开成一条
   粗轨道,在暗色底上是灰白的)换成自绘的细条。**不能同时写 scrollbar-width / scrollbar-color**——
   Chrome 121+ 规定只要设了标准属性就整体忽略 ::-webkit-scrollbar,滚动条会退回原生 overlay,
   那正是 PR#74 把标准属性推到全局后症状反而铺满全站的原因。标准属性只给不认 ::-webkit-scrollbar
   的浏览器(Firefox)用。 */
*::-webkit-scrollbar { width: 6px; height: 6px; }
*::-webkit-scrollbar-track { background: transparent; }
*::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }
@supports not selector(::-webkit-scrollbar) {
  * { scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
}
body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--ink);
  font-size: 0.875rem;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  /* 页面级禁止横向滚动:长单行内容(路径/命令摘要)只允许在组件内部截断/滚动,
     不得把文档撑宽——移动端触屏横滑曾把整页滑出视口(2026-07-16) */
  overflow-x: clip;
}
h1, h2, h3 { text-wrap: balance; font-weight: 600; }
button { font: inherit; color: inherit; background: none; border: none; cursor: pointer; }
input, select, textarea { font: inherit; color: var(--ink); }
:focus-visible { outline: 2px solid var(--jade); outline-offset: 2px; border-radius: 2px; }
::placeholder { color: var(--muted); opacity: 1; }

/* ============ 布局骨架 ============ */
/* 侧栏宽度用 rem 而非固定 px:正文字号设成「大」时整站 rem 一起放大,
   容器不跟着放大就会把侧栏底部的设置入口挤到竖排换行(2026-09-03 用户实测)。
   14.125rem 在标准字号(16px)下正好是原来的 226px,默认观感一字不差。 */
.app { display: grid; grid-template-columns: 14.125rem 1fr; min-height: 100vh; }

.sidebar {
  background: var(--surface-2);
  border-right: 1px solid var(--line-soft);
  display: flex; flex-direction: column;
  position: sticky; top: 0; height: 100vh;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 20px 20px 18px; }
.brand-mark { width: 48px; height: 48px; flex: none; color: var(--jade); }
.brand-text { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.brand .zh { font-size: 1.25rem; font-weight: 700; letter-spacing: 0.06em; color: var(--jade); white-space: nowrap; line-height: 1; }
.brand-meta { font-family: var(--mono); font-size: 0.6875rem; white-space: nowrap; }
.brand-meta .version { color: var(--faint); }

.nav { display: flex; flex-direction: column; gap: 2px; padding: 0 10px; }
.nav button {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 12px; border-radius: var(--r-s);
  color: var(--muted); text-align: left; font-size: 0.875rem;
  transition: background 150ms var(--ease), color 150ms var(--ease);
}
.nav button:hover { background: var(--hover); color: var(--ink); }
.nav button.active { background: var(--tint-jade); color: var(--jade); font-weight: 600; }
.nav svg { width: 16px; height: 16px; flex: none; }
.nav .count {
  margin-left: auto; font-family: var(--mono); font-size: 0.6875rem;
  color: var(--muted); background: var(--tint-muted); border-radius: 99px; padding: 0 7px;
}
.nav button.active .count { color: var(--jade); background: transparent; }

.side-foot { margin-top: auto; padding: 14px 20px 18px; border-top: 1px solid var(--line-soft); font-size: 0.75rem; color: var(--muted); }
.side-foot .row { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
.side-foot .ok { width: 7px; height: 7px; border-radius: 50%; background: var(--jade); flex: none; }
.side-foot .proto { color: var(--faint); }

.main { min-width: 0; padding: 24px clamp(32px, 3.5vw, 80px) 48px; }
.view { display: none; }
.view.active { display: block; animation: view-in 200ms var(--ease); }
@keyframes view-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

/* 移动端外壳(顶部标识条 + 底部 tab 栏):桌面隐藏,≤430px 现身,详见「移动端」媒体查询块 */
.mobile-topbar, .tabbar { display: none; }
/* 会话看板/密集表格的移动端结构级替身:桌面隐藏(对应 .tsx 只在 useIsMobile() 时挂载,这里是防御性兜底) */
.board-mobile, .mcard-list, .seg-scroll { display: none; }

.view-head { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
.view-head h1 { font-size: 1.25rem; }
.view-head .sub { color: var(--muted); font-size: 0.8125rem; }
.view-head .spacer { flex: 1; }

/* ============ 通用组件 ============ */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 14px; border-radius: var(--r-s);
  border: 1px solid var(--line); background: var(--surface);
  font-size: 0.8125rem; color: var(--ink);
  transition: background 150ms var(--ease), border-color 150ms var(--ease);
}
.btn:hover { background: var(--hover); border-color: var(--muted); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }
.btn-primary { background: var(--jade); border-color: var(--jade); color: var(--on-jade); font-weight: 600; }
.btn-primary:hover { background: var(--jade-dim); border-color: var(--jade-dim); }
.btn-quiet { border-color: transparent; background: transparent; color: var(--muted); }
.btn-quiet:hover { background: var(--hover); color: var(--ink); }
.btn-danger { border-color: color-mix(in oklab, var(--red) 45%, transparent); color: var(--red); background: transparent; }
.btn-danger:hover { background: var(--tint-red); border-color: var(--red); }
.btn-sm { padding: 3px 10px; font-size: 0.75rem; }

.input, select.input {
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r-s); padding: 6px 12px; font-size: 0.8125rem;
  transition: border-color 150ms var(--ease);
}
.input:hover { border-color: var(--muted); }
.input:focus { outline: none; border-color: var(--jade); }
select.input { appearance: none; padding-right: 28px;
  background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="6" viewBox="0 0 10 6"><path d="M1 1l4 4 4-4" stroke="%23999f8e" stroke-width="1.5" fill="none" stroke-linecap="round"/></svg>');
  background-repeat: no-repeat; background-position: right 10px center;
}

.pill {
  display: inline-flex; align-items: center; gap: 5px;
  font-size: 0.6875rem; font-weight: 600; border-radius: 99px; padding: 1px 9px;
  white-space: nowrap;
}
.pill .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill-run  { color: var(--jade);  background: var(--tint-jade); }
.pill-blk  { color: var(--amber); background: var(--tint-amber); }
/* 验收中:紫罗兰单列一色。琥珀独占「等待输入」(会话卡住动不了),验收中是「等你判断」,
   紧迫度不同必须一眼可分;dot 不脉动,与运行/阻塞的活跃态拉开层级 */
.pill-rev  { color: var(--violet); background: var(--tint-violet); }
.pill-idle { color: var(--muted); background: var(--tint-muted); }
.pill-done { color: var(--green); background: var(--tint-green); }
.pill-sched{ color: var(--blue);  background: var(--tint-blue); }
.pill-err  { color: var(--red);   background: var(--tint-red); }
.pill-run .dot, .pill-blk .dot { animation: pulse 2s var(--ease) infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.35; } }

.tag {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 0.6875rem; color: var(--muted);
  border: 1px solid var(--line); border-radius: 4px; padding: 0 6px;
  white-space: nowrap;
}
.mono { font-family: var(--mono); font-size: 0.8em; }

.panel { background: var(--surface); border: 1px solid var(--line-soft); border-radius: var(--r-m); }
.panel-head { display: flex; align-items: center; gap: 10px; padding: 12px 18px; border-bottom: 1px solid var(--line-soft); }
.panel-head h2 { font-size: 0.875rem; }
.panel-head .sub { font-size: 0.75rem; color: var(--muted); }
.panel-head .spacer { flex: 1; }

/* 表格 */
.table { width: 100%; border-collapse: collapse; }
.table th {
  text-align: left; font-size: 0.75rem; font-weight: 600; color: var(--muted);
  padding: 10px 18px; border-bottom: 1px solid var(--line-soft); white-space: nowrap;
}
.table td { padding: 11px 18px; border-bottom: 1px solid var(--line-soft); vertical-align: middle; }
.table tbody tr { transition: background 120ms var(--ease); }
.table tbody tr.rowlink { cursor: pointer; }
.table tbody tr.rowlink:hover { background: var(--hover); }
.table tbody tr:last-child td { border-bottom: none; }

/* 开关 */
.switch { position: relative; display: inline-block; width: 34px; height: 19px; border-radius: 99px; background: var(--line); transition: background 180ms var(--ease); flex: none; vertical-align: middle; cursor: pointer; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 15px; height: 15px; border-radius: 50%; background: var(--ink); transition: transform 180ms var(--ease); }
.switch.on { background: var(--jade); }
.switch.on::after { transform: translateX(15px); background: var(--on-jade); }

/* 抽屉 */
.backdrop {
  position: fixed; inset: 0; background: oklch(0.05 0 0 / 0.55);
  opacity: 0; pointer-events: none; transition: opacity 200ms var(--ease); z-index: var(--z-backdrop);
}
.backdrop.show { opacity: 1; pointer-events: auto; }
.drawer {
  position: fixed; top: 0; right: 0; bottom: 0; width: min(620px, 94vw);
  background: var(--surface-2); border-left: 1px solid var(--line);
  transform: translateX(102%); transition: transform 240ms var(--ease);
  z-index: var(--z-drawer); display: flex; flex-direction: column;
}
.drawer.show { transform: none; }
.drawer-head { padding: 18px 24px 14px; border-bottom: 1px solid var(--line-soft); display: flex; align-items: flex-start; gap: 12px; }
.drawer-head h2 { font-size: 1rem; }
.drawer-head .meta { font-size: 0.75rem; color: var(--muted); margin-top: 4px; display: flex; gap: 12px; flex-wrap: wrap; }
.drawer-body { flex: 1; overflow-y: auto; padding: 20px 24px; }
.drawer-foot { padding: 14px 24px; border-top: 1px solid var(--line-soft); display: flex; gap: 10px; align-items: center; }
.x-btn { margin-left: auto; color: var(--muted); padding: 4px 8px; border-radius: var(--r-s); flex: none; }
.x-btn:hover { background: var(--hover); color: var(--ink); }

/* 空态 */
.empty { text-align: center; padding: 48px 24px; color: var(--muted); }
.empty .glyph { font-size: 1.5rem; margin-bottom: 8px; color: var(--faint); }
.empty p { font-size: 0.8125rem; max-width: 34em; margin: 0 auto 4px; }

/* ============ 全局状态栏 ============ */
/* 外壳家具,不属于任何视图:挂在 .main 顶部吸顶,切视图时不重挂载。详见 DESIGN.md §5 */
.statusbar {
  position: sticky; top: 0; z-index: var(--z-sticky);
  display: flex; align-items: center; justify-content: flex-end; gap: 4px;
  height: 42px;
  /* 左右内边距与 .main 同值,再用等值负外边距出血到主区边缘:模糊层贯通整幅宽度 */
  padding: 0 clamp(32px, 3.5vw, 80px);
  margin: 0 calc(-1 * clamp(32px, 3.5vw, 80px)) 8px;
  /* 功能性模糊:内容从下方滚过时保证状态栏文字可读,与 mobile-topbar/tabbar 吸附垫层同源 */
  background: color-mix(in oklab, var(--bg) 82%, transparent);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line-soft);
}
/* widget 插槽:新增信息 = 新增一枚 .sb-item,不往已有 widget 里塞文字 */
.sb-item {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 3px 9px; border-radius: var(--r-s);
  font-size: 0.75rem; color: var(--muted);
  font-variant-numeric: tabular-nums; white-space: nowrap;
  transition: background 150ms var(--ease), color 150ms var(--ease);
}
button.sb-item { cursor: pointer; }
button.sb-item:hover { background: var(--hover); color: var(--ink); }
.sb-item .n { font-family: var(--mono); }
.sb-item .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--jade); flex: none; }
/* 告警态:复用 pill-blk 的琥珀语义,状态色只表状态 */
.sb-item.warn { color: var(--amber); }
.sb-item.warn .dot { background: var(--amber); animation: pulse 2s var(--ease) infinite; }
/* 故障态:红。文案本身也随之改写,状态永不 color-alone */
.sb-item.bad { color: var(--red); }
.sb-item.bad .dot { background: var(--red); }
/* 观象台时钟 widget:自仪表盘迁入,尺寸与配色一字未改;等宽 + 表格数字,秒位跳动不抖版 */
.sb-clock { gap: 10px; align-items: baseline; }
.sb-clock .date { font-family: var(--mono); font-size: 0.75rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.sb-clock .hms {
  font-family: var(--mono); font-size: 1.0625rem; font-weight: 500;
  color: var(--ink); font-variant-numeric: tabular-nums; letter-spacing: 0.02em;
}
.sb-sep { width: 1px; height: 14px; background: var(--line-soft); margin: 0 2px; flex: none; }
@media (prefers-reduced-motion: reduce) { .sb-item.warn .dot { animation: none; } }

/* ============ 仪表盘 ============ */
.dash-now { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 4fr); gap: 16px; margin-bottom: 16px; }
.need-item { display: flex; align-items: center; gap: 12px; padding: 12px 18px; border-bottom: 1px solid var(--line-soft); }
.need-item:last-child { border-bottom: none; }
.need-item .what { min-width: 0; flex: 1; }
.need-item .what .t { font-weight: 600; font-size: 0.8125rem; }
.need-item .what .n { font-size: 0.75rem; color: var(--amber); }
.run-item { display: flex; align-items: center; gap: 10px; padding: 10px 18px; border-bottom: 1px solid var(--line-soft); font-size: 0.8125rem; }
.run-item:last-child { border-bottom: none; }
.run-item .d { color: var(--muted); font-size: 0.75rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex: 1; }

.dash-strip { display: flex; gap: 24px; flex-wrap: wrap; padding: 12px 18px; font-size: 0.8125rem; color: var(--muted); margin-bottom: 16px; }
.dash-strip b { color: var(--ink); font-weight: 600; }

.dash-grid { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 4fr); gap: 16px; }

.tl { list-style: none; }
.tl li { display: flex; gap: 12px; padding: 9px 18px; border-bottom: 1px solid var(--line-soft); font-size: 0.8125rem; }
.tl li:last-child { border-bottom: none; }
.tl .t { font-family: var(--mono); font-size: 0.75rem; color: var(--faint); flex: none; width: 58px; white-space: nowrap; }
.tl .proj { font-size: 0.75rem; flex: none; } /* 颜色由项目分类色注入 */
.tl .msg { color: var(--muted); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* 7 日热力(sequential:单色 jade 浅→深) */
.heat { padding: 14px 18px; }
.heat-row { display: grid; grid-template-columns: 96px repeat(7, 1fr); gap: 4px; align-items: center; margin-bottom: 6px; }
.heat-row .lbl { font-size: 0.75rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.heat-cell { height: 18px; border-radius: 3px; background: var(--tint-muted); position: relative; }
.heat-days { display: grid; grid-template-columns: 96px repeat(7, 1fr); gap: 4px; margin-top: 6px; }
.heat-days span { font-size: 0.6875rem; color: var(--faint); text-align: center; }
.heat-days span:first-child { text-align: left; }

/* token 消耗:项目级堆叠条(同色相三档:output 最亮=最贵,cache read 最淡),可展开会话明细 */
.tok { padding: 10px 18px 14px; }
.tok-row {
  display: grid; grid-template-columns: 176px 1fr 76px; gap: 12px; align-items: center;
  width: 100%; padding: 6px 0; font-size: 0.8125rem; text-align: left;
  background: none; border: none; color: inherit; font-family: inherit;
}
button.tok-row { cursor: pointer; border-radius: var(--r-s); transition: background 150ms var(--ease); }
button.tok-row:hover { background: var(--hover); }
button.tok-row:focus-visible { outline: 2px solid var(--jade); outline-offset: -2px; }
.tok-row .lbl { color: var(--ink); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 6px; }
.tok-row .chev { color: var(--faint); font-size: 0.6875rem; transition: transform 150ms var(--ease); flex: none; }
.tok-proj.open > .tok-row .chev { transform: rotate(90deg); }
.tok-row .track { height: 9px; }
.tok-row .bar { height: 100%; display: flex; border-radius: 4px; overflow: hidden; min-width: 3px; }
.tok-row .bar i { height: 100%; }
.tok-row .val { font-family: var(--mono); font-size: 0.75rem; color: var(--muted); text-align: right; white-space: nowrap; }
.tok-subs { display: none; padding: 2px 0 6px; }
.tok-proj.open .tok-subs { display: block; }
.tok-row.sub { padding: 4px 0; }
.tok-row.sub .lbl { font-weight: 400; color: var(--muted); padding-left: 22px; font-size: 0.75rem; }
.tok-row.sub .track { height: 6px; }
.tok-legend { display: flex; gap: 14px; font-size: 0.6875rem; color: var(--muted); }
.tok-legend span { display: flex; align-items: center; gap: 5px; }
.tok-legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

/* ---- Token 用量合并模块(成本条形图 + 7 日热力图同属「用量」视角,合为一块) ---- */
/* 头部要塞下标题 + 两组切换:标题不折行,切换组整组换行但不拆散 */
.usage-head { flex-wrap: wrap; row-gap: 6px; }
.usage-head h2 { white-space: nowrap; }
/* 小字用 flex-basis:0 吸收剩余空间(顺带接替 spacer 的角色)。
   关键在 basis 而非 shrink:flex 容器开了 wrap 就是「先换行再压缩」,
   按内容宽度参与分行时,口径文案一变长就会把第二组切换顶到下一行
   (成本↔Token 切换时头部忽高忽低)。basis 归零后它永不顶出换行,
   空间不足时省略号收尾,完整口径仍在 title 悬停里。 */
.usage-head .sub { flex: 1 1 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }

/* 分段切换:沿用 .nav button.active 的选中词汇(玉色 tint),不另造一套 */
.seg {
  display: inline-flex; align-items: center; gap: 2px;
  background: var(--surface-2); border: 1px solid var(--line-soft);
  border-radius: var(--r-s); padding: 2px;
}
.seg button {
  padding: 1px 10px; border-radius: 4px;
  font-size: 0.75rem; color: var(--muted); white-space: nowrap;
  transition: background 150ms var(--ease), color 150ms var(--ease);
}
.seg button:hover { color: var(--ink); }
.seg button.active { background: var(--tint-jade); color: var(--jade); font-weight: 600; }

/* 开发 vs multica 对比条:开发段用玉色(主角),multica 段用中性斜纹——
   它是「非开发」对照组,不该占用任何状态色或模型系列色的词汇 */
.cmp { padding: 14px 18px 4px; transition: opacity 150ms var(--ease); }
.cmp-head { display: flex; align-items: baseline; gap: 8px; font-size: 0.75rem; color: var(--muted); margin-bottom: 7px; flex-wrap: wrap; }
.cmp-head b { color: var(--ink); font-family: var(--mono); font-weight: 500; font-size: 0.75rem; }
.cmp-head .pct { color: var(--jade); font-family: var(--mono); }
.cmp-track { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--tint-muted); }
.cmp-track .dev { background: var(--jade-dim); transition: width 200ms var(--ease); }
.cmp-track .noise { transition: width 200ms var(--ease); }
/* multica 两类任务共用中性灰系(不占状态色/模型色词汇),以纹理区分:
   scan(扫描归因 = workspaces+narrate)= 斜纹;biz-events(业务事件)= 纯色浅一档 */
.cmp-track .noise-scan {
  background: repeating-linear-gradient(-45deg, oklch(0.34 0.012 110) 0 5px, oklch(0.28 0.010 110) 5px 10px);
}
.cmp-track .noise-biz-events { background: oklch(0.42 0.014 110); }
.cmp-legend { display: flex; gap: 16px; margin-top: 6px; font-size: 0.6875rem; color: var(--muted); flex-wrap: wrap; }
.cmp-legend span { display: flex; align-items: center; gap: 5px; }
.cmp-legend b { color: var(--ink); font-family: var(--mono); font-weight: 500; }
.cmp-legend i { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
.cmp-legend .i-dev { background: var(--jade-dim); }
.cmp-legend .i-noise-scan { background: repeating-linear-gradient(-45deg, oklch(0.34 0.012 110) 0 3px, oklch(0.28 0.010 110) 3px 6px); }
.cmp-legend .i-noise-biz-events { background: oklch(0.42 0.014 110); }

/* token 四分量构成:纯文字不画条——cacheRead 量级常是其余三项之和的 20 倍,
   同一根线性条会把另外三段压成碎片,20× 的差距交给数字本身表达。
   三个常规计费分量一组,cacheRead 用竖线断开推到行尾并弱化一档:
   它不是「同类的第四项」,而是被排除在 token 总量之外的另一个计费维度。 */
.comp { padding: 9px 18px 11px; border-top: 1px solid var(--line-soft); transition: opacity 150ms var(--ease); }
.comp-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; font-size: 0.75rem; color: var(--muted); margin-bottom: 5px; }
.comp-head h3 { font-size: 0.75rem; font-weight: 600; color: var(--ink); }
.comp-nums { display: flex; align-items: baseline; gap: 4px 12px; flex-wrap: wrap; font-size: 0.75rem; color: var(--muted); }
.comp-nums span { display: flex; align-items: baseline; gap: 5px; white-space: nowrap; }
.comp-nums .k { color: var(--faint); font-size: 0.6875rem; }
.comp-nums b { color: var(--ink); font-family: var(--mono); font-weight: 500; font-size: 0.8125rem; }
/* cacheRead 与前三项同排,放不下时自然折行接着排(不右推、不强制独占一行:
   两者都会让它看着像另一个模块,而它只是第四个分量)。值弱化一档区分计费维度 */
.comp-nums .cr b { color: var(--muted); }
.comp-nums .cr .eq { font-family: var(--mono); font-size: 0.6875rem; color: var(--faint); }
/* 展开项目内的同款构成行:整体降一档,与会话行拉开层级 */
.comp-line { padding: 2px 0 5px 22px; gap: 4px 10px; }
.comp-line b { font-size: 0.75rem; color: var(--muted); }

/* 近一周数据在路上:今日数据先垫着并压暗,不整块闪空 */
.cmp.pending, .tok.pending, .comp.pending { opacity: 0.5; }
/* 统计中的文字反馈:玉色呼吸,与运行态 pill 同一套「正在进行」词汇 */
.usage-loading { color: var(--jade); animation: pulse 1.6s var(--ease) infinite; }
@media (prefers-reduced-motion: reduce) { .usage-loading { animation: none; } }

/* 模块内分段:热力图与图例接在条形图之下,用整宽细线分隔 */
.usage-divide { border-top: 1px solid var(--line-soft); }
.usage-divide .cap { display: flex; align-items: baseline; gap: 8px; padding: 10px 18px 0; font-size: 0.75rem; color: var(--muted); }
.usage-divide .cap h3 { font-size: 0.75rem; font-weight: 600; color: var(--ink); }
.usage-foot { padding: 10px 18px; }

/* 最近活动拉通整栏:面板由 grid 拉伸到与右侧用量模块等高,列表吃掉剩余空间,超出内部滚动。
   可视区封顶 60vh——40 条全展开会把仪表盘拉到近三屏,而这是一块「扫一眼」的驾驶舱屏,
   要看更早的活动滚动即可,不该让下面的内容被推出视野。 */
.dash-grid > .panel { display: flex; flex-direction: column; min-height: 0; }
.tl-tall { flex: 1; min-height: 0; max-height: 60vh; overflow-y: auto; }

/* ============ 项目 ============ */
.spark { display: flex; align-items: flex-end; gap: 2px; height: 20px; width: 84px; }
.spark i { flex: 1; background: var(--jade-dim); border-radius: 2px 2px 0 0; min-height: 2px; opacity: 0.85; }
.dirty { color: var(--amber); }

/* ============ 会话看板 ============ */
/* 看板锁定一个视口高:列头常驻可见(数量全貌是重要信号),卡片在列内滚动 */
.board { display: grid; grid-template-columns: repeat(4, minmax(252px, 1fr)); gap: 14px; overflow-x: auto; padding-bottom: 8px; height: calc(100vh - 196px); min-height: 340px; }
/* 过滤条在场时,看板高度改由 flex 分配而非再减一个魔数:项目多到 chip 换行(8+ 个项目
   实测就会)时,减固定值会让看板底部溢出视口。外壳锁一个视口高,过滤条占自然高度,
   看板吃掉剩下的。 */
.board-wrap { display: flex; flex-direction: column; height: calc(100vh - 196px); min-height: 340px; }
.board-wrap .board { flex: 1; height: auto; min-height: 0; }
.board > div { display: flex; flex-direction: column; min-height: 0; }
/* flex:1 —— 列体撑满整列高度。不撑满时它只有内容那么高,空闲列一两张卡就意味着拖拽落点
   只是顶部一条窄带,拖到列中段接不住(2026-08-05 实测:已完成列卡多能接,空闲列接不到)。 */
.col-body { flex: 1; overflow-y: auto; min-height: 0; padding: 2px 2px 8px; margin: -2px; }
.col-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; font-size: 0.8125rem; font-weight: 600; flex: none; }
.col-head .n { font-family: var(--mono); font-size: 0.75rem; color: var(--muted); font-weight: 400; }
.scard {
  background: var(--surface); border: 1px solid var(--line-soft); border-radius: var(--r-m);
  padding: 12px 14px; margin-bottom: 10px; cursor: pointer;
  transition: border-color 150ms var(--ease), background 150ms var(--ease);
}
.scard:hover { border-color: var(--muted); background: var(--hover); }
/* outline 是「键盘选中」的专属通道,任何持久状态都不许占用它——
   否则状态描边会盖住选中框,分不清光标在哪(2026-08-05 实测暴露) */
.scard.kb-sel { outline: 2px solid var(--jade); outline-offset: -1px; }
/* 等你回话的卡:左侧琥珀立柱 + 微微琥珀底,走 border 与 background 两个通道,
   与选中框正交——选中时玉色描边照常出现在外圈,立柱仍在,两个信息同时可读 */
.scard.blk {
  border-left: 3px solid var(--amber);
  padding-left: 12px; /* 抵掉加粗的 2px,内容不位移 */
  background: color-mix(in oklab, var(--amber) 5%, var(--surface));
}
.scard.blk:hover { background: color-mix(in oklab, var(--amber) 8%, var(--surface)); }
/* hover 会把整圈边框染成 muted,单独保住左立柱不被冲掉 */
.scard.blk:hover, .scard.blk.kb-sel { border-left-color: var(--amber); }
/* 验收中的中密度卡:行距略收,单行摘要,高度介于全尺寸卡与紧凑卡之间 */
.scard.mid { padding: 10px 14px; }
.scard.mid .foot { margin-top: 2px; }
.scard .top { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
/* 关闭按钮:悬停/键盘选中才现身,悬停转红示意移除 */
.scard .x-close {
  flex: none; border: 0; background: none; cursor: pointer; border-radius: 4px;
  color: var(--faint); font-size: 1rem; line-height: 1; padding: 0 3px; margin: -2px -4px -2px 0;
  opacity: 0; transition: opacity 120ms var(--ease), color 120ms var(--ease);
}
.scard:hover .x-close, .scard.kb-sel .x-close, .scard .x-close:focus-visible { opacity: 1; }
.scard .x-close:hover { color: var(--red); }
.scard .unarchive { font-size: 0.8125rem; }
.scard .unarchive:hover { color: var(--jade); }
/* 拖拽处置:原位卡留半透明占位,跟手的那张由 DragOverlay 画;落点列悬停时显出接纳边框 */
.scard.dragging { opacity: 0.4; cursor: grabbing; border-style: dashed; border-color: var(--jade); }

/* ---- 项目过滤:非命中卡淡出而非移除 ----
   移除会让列长随过滤缩水,而列长在本产品里是「积压量」的信号(验收中列刻意不折叠即为此)。
   留位淡出后,收窄的是注意力、不是事实。暗卡同时退出指针与键盘两个输入通道。 */
.scard.pf-dim { opacity: 0.22; pointer-events: none; }
.scard.pf-dim, .scard.pf-dim * { transition: none; }

/* ============ 项目过滤条(会话看板) ============ */
/* 过滤是「聚焦」不是「导航」:单行、紧贴看板上沿,不做侧栏也不做下拉 */
.proj-filter { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
/* 这行标签是全页少数直接坐在 body(壁纸)上的小字,用 --muted 而非更暗的 --faint:
   开壁纸时 faint 实测只有 2.87:1,muted 才回到可读区间 */
.proj-filter .pf-label { font-size: 0.75rem; color: var(--muted); flex: none; }
/* --pf-base 固定取不透明的 surface-2 原色,不走 var(--surface-2):chip 是控件不是外壳表面
   (同 .dd-menu 的理由)。开壁纸时 body 转透明,任何「往 transparent 里混」的底色都会把壁纸
   漏进这行 0.75rem 小字背后——选中态实测掉到 1.44:1。混进不透明基色则三种模式一律 7:1 以上。 */
.pf-chip {
  --pf-base: oklch(0.165 0.007 120);
  display: inline-flex; align-items: center; gap: 7px;
  font-family: var(--mono); font-size: 0.75rem; font-weight: 500;
  padding: 4px 12px; border-radius: 999px; cursor: pointer;
  color: var(--muted); background: var(--pf-base); border: 1px solid var(--line-soft);
  transition: color 150ms var(--ease), border-color 150ms var(--ease), background 150ms var(--ease);
}
.pf-chip:hover { border-color: var(--muted); color: var(--ink); }
.pf-chip:focus-visible { outline: 2px solid var(--jade); outline-offset: 2px; }
/* 选中态:项目分类色经 --pc 注入,tint 底 + 同色描边——与卡上 .proj-chip 同一套词汇 */
.pf-chip.on { color: var(--pc); background: color-mix(in oklab, var(--pc) 14%, var(--pf-base)); border-color: color-mix(in oklab, var(--pc) 45%, transparent); }
.pf-chip .pf-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--pc); flex: none; }
.pf-chip .pf-n { font-size: 0.6875rem; color: var(--faint); }
.pf-chip.on .pf-n { color: color-mix(in oklab, var(--pc) 70%, var(--ink)); }
/* 待验收角标:琥珀专表「等你处理」,与 chip 的分类色分守两套词汇 */
.pf-chip .pf-warn { font-size: 0.6875rem; font-weight: 650; color: oklch(0.24 0.05 85); background: var(--amber); border-radius: 999px; padding: 0 6px; flex: none; }
.pf-chip.pf-all.on { color: var(--ink); background: oklch(0.215 0.009 120); border-color: var(--muted); }
@media (prefers-reduced-motion: reduce) {
  .pf-chip { transition: none; }
}
/* 跟手卡:抬起来的质感(阴影 + 玉色描边),不再被相邻列或列体滚动容器盖住 */
.drag-ghost .scard { cursor: grabbing; border-color: var(--jade); box-shadow: 0 12px 28px rgb(0 0 0 / 0.45); margin-bottom: 0; }
.col-body.drop-over {
  border: 1px dashed var(--jade); border-radius: var(--r-m);
  background: color-mix(in srgb, var(--jade) 7%, transparent);
}
/* 已完成 = 归档:两行紧凑卡(标题 / 项目+时间),砍掉概要、后台标、去回复 */
.scard.compact { padding: 9px 12px; }
.scard.compact .top { margin-bottom: 5px; }
.scard.compact .cwd { margin-bottom: 0; }
.scard.compact .ctime { font-family: var(--mono); font-size: 0.6875rem; color: var(--faint); flex: none; margin-left: auto; }
/* 已完成默认只展示最近几条,更早的折叠 */
.col-more {
  width: 100%; padding: 8px; margin-bottom: 10px; text-align: center; cursor: pointer;
  font-size: 0.75rem; color: var(--muted); background: none;
  border: 1px dashed var(--line-soft); border-radius: var(--r-m);
  transition: color 150ms var(--ease), border-color 150ms var(--ease);
}
.col-more:hover { color: var(--ink); border-color: var(--muted); }

/* agent 提问卡(AskUserQuestion):提问 ≠ 权限,选项按钮纵排,已答折叠为答案回显 */
.qcard .q-block { margin: 10px 0; }
.qcard .q-text { font-size: 0.8125rem; margin-bottom: 8px; }
.qcard .q-opts { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
.qcard .q-opt {
  text-align: left; padding: 8px 12px; cursor: pointer;
  background: var(--surface-2); border: 1px solid var(--line-soft); border-radius: var(--r-m);
  color: var(--ink); transition: border-color 150ms var(--ease), background 150ms var(--ease);
}
.qcard .q-opt:hover { border-color: var(--muted); }
.qcard .q-opt.sel { border-color: var(--jade); background: color-mix(in oklab, var(--jade) 10%, var(--surface-2)); }
.qcard .q-opt b { display: block; font-size: 0.8125rem; font-weight: 600; }
.qcard .q-opt span { display: block; font-size: 0.75rem; color: var(--muted); margin-top: 2px; }
.qcard .q-answered { font-size: 0.8125rem; color: var(--muted); }
.qcard .q-custom {
  width: 100%; padding: 7px 12px; font-size: 0.8125rem; color: var(--ink);
  background: var(--surface-2); border: 1px solid var(--line-soft); border-radius: var(--r-m);
}
.qcard .q-custom:focus { outline: none; border-color: var(--jade); }

/* 注意力类别标签(等输入/待验收):实心琥珀底 + 深色字——琥珀家族最重的一级 */
.tag.t-unread { color: oklch(0.24 0.05 85); background: var(--amber); border-color: transparent; font-weight: 650; flex: none; }
/* 已挂起:比「待验收」轻一级(描边紫罗兰),标在空闲列被显式挂起的卡上 */
.tag.t-susp { color: var(--violet); background: var(--tint-violet); border-color: color-mix(in oklab, var(--violet) 40%, transparent); font-weight: 600; flex: none; }
.scard .u-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--amber); flex: none; animation: udot 2.2s ease-in-out infinite; }
@keyframes udot { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
/* 待验收条目的摘要是产出信息不是警示:muted */
.need-item .what .n.plain { color: var(--muted); }

/* Claude 输出的 markdown 渲染(react-markdown + gfm;原始 HTML 不渲染,会话内容按不可信数据处理) */
.md > *:first-child { margin-top: 0; }
.md > *:last-child { margin-bottom: 0; }
.md p, .md ul, .md ol, .md pre, .md table, .md blockquote { margin: 0 0 10px; }
.md h1, .md h2, .md h3, .md h4 { font-size: 0.9375rem; font-weight: 700; margin: 14px 0 8px; }
.md h1 { font-size: 1.0625rem; }
.md ul { padding-left: 1.25em; list-style: disc; }
.md ol { padding-left: 1.4em; list-style: decimal; }
.md li { margin: 3px 0; }
.md li > p { margin-bottom: 4px; }
.md strong { font-weight: 700; }
.md a { color: var(--jade); text-underline-offset: 2px; }
.md code { font-family: var(--mono); font-size: 0.8125em; background: var(--surface-2); border: 1px solid var(--line-soft); padding: 1px 5px; border-radius: 4px; }
.md pre { background: var(--surface-2); border: 1px solid var(--line-soft); border-radius: var(--r-m); padding: 10px 12px; overflow-x: auto; }
.md pre code { background: none; border: 0; padding: 0; font-size: 0.75rem; line-height: 1.6; }
.md table { border-collapse: collapse; font-size: 0.8125rem; max-width: 100%; display: block; overflow-x: auto; }
.md th, .md td { border: 1px solid var(--line-soft); padding: 5px 10px; text-align: left; }
.md th { background: var(--surface-2); font-weight: 600; }
.md td { font-variant-numeric: tabular-nums; }
.md blockquote { border-left: 3px solid var(--line); padding-left: 10px; color: var(--muted); }
.md hr { border: 0; border-top: 1px solid var(--line-soft); margin: 12px 0; }

/* Claude 回答高亮:<html data-md-hl="on"> 时生效(off 即现状全白靠字重)。
   只改颜色不改排版;链接(恒 jade)、行内码、代码块正文不动。 */
[data-md-hl="on"] .md :is(h1, h2) { color: var(--md-heading); }
[data-md-hl="on"] .md :is(h3, h4, h5, h6) { color: var(--md-heading-3); }
[data-md-hl="on"] .md strong { color: var(--md-strong); }
/* 标题里的加粗跟随标题色,不在一行里同时出现两种色相 */
[data-md-hl="on"] .md :is(h1, h2, h3, h4, h5, h6) strong { color: inherit; }
[data-md-hl="on"] .md th { color: var(--md-heading); }
[data-md-hl="on"] .md blockquote { border-left-color: var(--md-quote); }
/* 列表记号退后一层,让正文与加粗成为视线落点 */
[data-md-hl="on"] .md :is(ul, ol) > li::marker { color: var(--faint); }


/* 代码块复制按钮。定位壳套在 pre 外面而不是 pre 自己:pre 横向滚动,
   absolute 子元素会跟着滚走,按钮必须钉在可视区右上角。 */
.codeblock { position: relative; margin: 0 0 10px; }
.codeblock pre { margin: 0; }
.copy-btn {
  position: absolute; top: 6px; right: 6px;
  display: inline-flex; align-items: center; gap: 5px;
  padding: 4px 8px; border-radius: var(--r-s);
  font-family: var(--mono); font-size: 0.6875rem; line-height: 1;
  color: var(--muted);
  background: color-mix(in oklab, var(--surface-2) 85%, transparent);
  border: 1px solid var(--line-soft);
  opacity: 0;
  transition: opacity 150ms var(--ease), color 150ms var(--ease), background 150ms var(--ease);
}
.copy-btn svg { width: 12px; height: 12px; flex: none; }
.codeblock:hover .copy-btn, .copy-btn:focus-visible { opacity: 1; }
.copy-btn:hover { color: var(--ink); background: var(--hover); }
.copy-btn.copied {
  opacity: 1; color: var(--jade);
  border-color: color-mix(in oklab, var(--jade) 35%, var(--line-soft));
  background: var(--tint-jade);
}
/* 触屏无 hover 态,常显 */
@media (hover: none) { .copy-btn { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .copy-btn { transition: none; } }

/* 应用内确认框(Pake/Tauri WKWebView 不支持 window.confirm) */
.confirm-mask {
  position: fixed; inset: 0; z-index: 90; display: flex; align-items: center; justify-content: center;
  background: color-mix(in oklab, var(--bg) 62%, transparent); backdrop-filter: blur(2px);
}
.confirm-box {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-l);
  padding: 20px 22px; max-width: 420px; min-width: 300px;
  box-shadow: 0 18px 48px rgb(0 0 0 / 0.5);
}
.confirm-box p { font-size: 0.8125rem; line-height: 1.7; white-space: pre-line; margin-bottom: 16px; }
.confirm-actions { display: flex; justify-content: flex-end; gap: 8px; }

/* 命令弹窗(/resume /wd /model 共用,复用 confirm-mask 遮罩) */
.rp-box {
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-m);
  width: min(520px, calc(100vw - 48px)); box-shadow: 0 18px 48px rgb(0 0 0 / 0.5); overflow: hidden;
}
.rp-head {
  display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
  padding: 14px 18px 12px; font-size: 0.8125rem; font-weight: 600;
  border-bottom: 1px solid var(--line-soft);
}
.rp-hint { font-size: 0.6875rem; font-weight: 400; color: var(--faint); }
.rp-empty { padding: 22px 18px; font-size: 0.8125rem; color: var(--muted); line-height: 1.7; }
.rp-list { max-height: 320px; overflow-y: auto; padding: 6px; }
.rp-item {
  display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
  padding: 9px 12px; border: 0; border-radius: var(--r-s); background: none;
  color: var(--ink); font-size: 0.8125rem; cursor: pointer;
}
/* 选中态:玉色描边环(与 Tab :focus-visible 同款),不用灰底——三个命令弹窗统一,
   「玉色环 = 当前选中」是全局一致的视觉词汇;inset offset 防被滚动容器裁掉 */
.rp-item.sel { background: transparent; outline: 2px solid var(--jade); outline-offset: -2px; }
.rp-item .rp-name { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
.rp-item .rp-meta { flex-shrink: 0; font-size: 0.6875rem; color: var(--faint); }
/* 搜索命中片段:玉色加粗,不加底色——底色会与 .rp-item.sel 的玉色描边环在同一行双重强调 */
.rp-mark { color: var(--jade); font-weight: 600; }

/* /wd·/model 模糊搜索弹窗(WdPalette,复用 rp-box/rp-list/rp-item;仅补搜索框与右侧完整值列) */
.wd-search { padding: 10px 12px; border-bottom: 1px solid var(--line-soft); }
.wd-search .input { width: 100%; }
/* 短名不截断优先展示;完整值(路径/模型 id)吃掉剩余空间并末端省略,悬停(title)见全文 */
.wd-box .rp-item .rp-name { flex: none; max-width: 45%; }
.wd-path { flex: 1; min-width: 0; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 0.6875rem; color: var(--faint); }
.wd-cur { color: var(--jade); }
/* 手输完整路径行:置底并以细线与「已有项目」区隔;短名位是玉色动词,提示这是新建而非选择 */
.wd-manual { border-top: 1px solid var(--line-soft); margin-top: 6px; padding-top: 12px; }
.wd-manual .rp-name { color: var(--jade); }
.wd-manual:disabled { cursor: not-allowed; }
.wd-manual:disabled .rp-name { color: var(--faint); }
.wd-bad { color: var(--red); }
/* 可变字段一律限行截断(全文在回放页),压住生产环境长文案导致的卡高参差 */
.scard .title { font-weight: 600; font-size: 0.8125rem; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.scard .cwd { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; min-width: 0; }
/* 项目芯片:玉色 tint 底 + 玉色 mono 字,与仪表盘时间线的项目玉色惯例同一词汇;悬停见完整路径 */
.proj-chip {
  font-family: var(--mono); font-size: 0.6875rem; font-weight: 500;
  border-radius: 4px; padding: 1.5px 8px; flex: none;
}
.scard .sid { font-family: var(--mono); font-size: 0.6875rem; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.scard .detail { font-size: 0.75rem; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
/* 中密度卡的摘要:单行截断(全文在悬停提示与回放里),把列长还给积压量本身 */
.scard .detail.one { display: block; white-space: nowrap; text-overflow: ellipsis; }
.scard .needs { font-size: 0.75rem; color: var(--amber); margin-top: 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.scard .foot { display: flex; align-items: center; gap: 8px; margin-top: 10px; }
.scard .time { font-size: 0.6875rem; color: var(--faint); margin-left: auto; }

.notice {
  display: flex; align-items: center; gap: 10px;
  font-size: 0.75rem; color: var(--muted);
  padding: 8px 14px; border: 1px solid var(--line-soft); border-radius: var(--r-s);
  background: var(--surface-2); margin-bottom: 16px;
}
.notice .ok { width: 7px; height: 7px; border-radius: 50%; background: var(--jade); flex: none; }

/* ============ 消息发送时间(派发页聊天流 + 回放抽屉共用) ============ */
/* 时间是元信息:落在 who(muted/jade)之下的 faint 层,mono + tabular-nums 保证
   HH:MM 逐位对齐、分钟跳动不抖版。tool/raw 事件源数据无时间,不渲染也不占位。 */
.msg-ts {
  font-family: var(--mono); font-size: 0.6875rem; font-weight: 400;
  color: var(--faint); margin-left: 8px;
  font-variant-numeric: tabular-nums; letter-spacing: 0.02em;
}
/* 本轮耗时:紧跟 .msg-ts 同排同字号——「多久」与「何时」是同类信息,不另起一行。
   .msg-ts 本身保持不变,这里只是它右侧的同级 span。 */
.xj-turn-dur {
  font-family: var(--mono); font-size: 0.6875rem; font-weight: 400;
  color: var(--faint); margin-left: 6px;
  font-variant-numeric: tabular-nums; letter-spacing: 0.02em;
}
.xj-turn-dur::before { content: '·'; margin-right: 6px; opacity: 0.55; }
/* 长回合(≥5min)上调一级色阶:翻长会话时一眼能挑出重活那几轮(原型同款) */
.xj-turn-dur.long { color: var(--muted); }
/* 跨天分隔线:时间只显示 HH:MM,日期由分隔线交代(隔夜后台任务、多天续接的会话
   靠它还原时间脉络)。会话首条消息前也插一条,交代这段对话发生在哪天。 */
.day-sep {
  display: flex; align-items: center; gap: 12px;
  margin: 22px 0 18px; color: var(--faint);
  font-family: var(--mono); font-size: 0.6875rem; letter-spacing: 0.04em;
  font-variant-numeric: tabular-nums;
}
.day-sep::before, .day-sep::after { content: ""; flex: 1; height: 1px; background: var(--line-soft); }
.day-sep:first-child { margin-top: 0; }

/* 回放 */
.replay-msg { margin-bottom: 18px; }
.replay-msg .who { font-size: 0.6875rem; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
.replay-msg .who.u { color: var(--jade); }
.replay-msg .body { font-size: 0.8125rem; color: var(--ink); max-width: 68ch; text-wrap: pretty; }
/* 用户消息是纯文本(assistant 走 .md 由 markdown 排版),保留原始换行 */
.replay-msg .body:not(.md) { white-space: pre-wrap; }
.toolcard {
  border: 1px solid var(--line-soft); border-radius: var(--r-s);
  background: var(--surface); margin: 8px 0; overflow: hidden; max-width: 68ch;
}
.toolcard .tc-head {
  display: flex; align-items: center; gap: 8px; padding: 7px 12px;
  font-family: var(--mono); font-size: 0.75rem; color: var(--muted); cursor: pointer; width: 100%;
}
.toolcard .tc-head:hover { background: var(--hover); }
.toolcard .tc-head .fn { color: var(--blue); }
.toolcard .tc-head .fn[data-cat="skill"] { color: var(--tool-skill); }
.toolcard .tc-head .fn[data-cat="exec"]  { color: var(--tool-exec); }
.toolcard .tc-head .fn[data-cat="read"]  { color: var(--blue); }
.toolcard .tc-head .fn[data-cat="write"] { color: var(--tool-write); }
.toolcard .tc-head .fn[data-cat="orch"]  { color: var(--violet); }
.toolcard .tc-head .fn[data-cat="other"] { color: var(--muted); }
.toolcard .tc-head .chev { margin-left: auto; transition: transform 180ms var(--ease); color: var(--faint); }
.toolcard.open .tc-head .chev { transform: rotate(180deg); }
.toolcard .tc-body { display: none; padding: 10px 12px; border-top: 1px solid var(--line-soft); font-family: var(--mono); font-size: 0.71875rem; color: var(--muted); white-space: pre-wrap; overflow-x: auto; }
.toolcard.open .tc-body { display: block; }

/* 思考卡:与工具卡同族但刻意全中性——彩色是稀缺资源,留给工具卡函数名与用户消息底色。
   唯一的结构记号是左侧 1px 竖线,保证思考永远落在助手正文之后的第二层级。 */
.thinkcard { max-width: 68ch; margin: 8px 0; }
.thinkcard .tk-head {
  display: flex; align-items: center; gap: 8px; width: 100%;
  padding: 5px 10px 5px 0; background: none; border: none; text-align: left;
  font-family: var(--mono); font-size: 0.75rem; color: var(--faint);
  cursor: pointer; border-radius: var(--r-s); transition: color 150ms var(--ease);
}
.thinkcard .tk-head:hover { color: var(--muted); }
.thinkcard .tk-head:disabled { cursor: default; }
.thinkcard .tk-head .ico { flex: none; }
.thinkcard .tk-label { font-family: var(--sans); font-weight: 600; font-size: 0.6875rem; letter-spacing: 0.02em; }
/* 耗时是有意义的信息不是装饰,必须过 AA:再降透明度会掉到 3.2:1(实测),
   与 tk-label 的层次改由字体族/字重承担(mono 400 vs sans 600) */
.thinkcard .tk-meta { color: var(--faint); }
.thinkcard .tk-head .chev { margin-left: auto; transition: transform 180ms var(--ease); flex: none; }
.thinkcard.open .tk-head .chev { transform: rotate(180deg); }
.thinkcard .tk-body {
  display: none; position: relative;
  margin-left: 7px; padding: 4px 0 8px 16px; border-left: 1px solid var(--line);
  font-size: 0.8125rem; line-height: 1.65; color: var(--faint); text-wrap: pretty;
  overflow-wrap: anywhere;
}
.thinkcard.open .tk-body, .thinkcard.live .tk-body { display: block; }
.thinkcard .tk-body p + p { margin-top: 10px; }
/* 超长思考:限高 + 底部渐隐 + 展开全文(高度与 THINK_CLAMP_CHARS 的估算保持一致) */
.thinkcard .tk-body.clamped { max-height: 320px; overflow: hidden; }
.thinkcard .tk-body.clamped::after {
  content: ''; position: absolute; inset: auto 0 0 0; height: 56px; pointer-events: none;
  background: linear-gradient(to bottom, transparent, var(--surface-2));
}
.thinkcard .tk-more {
  position: absolute; left: 16px; bottom: 0; z-index: 1;
  font-size: 0.6875rem; font-weight: 600; color: var(--muted);
  background: none; border: none; cursor: pointer; padding: 0;
}
.thinkcard .tk-more:hover { color: var(--jade); }
/* 思考中:竖线呼吸 + 图标缓慢自转,与助手正文的 .typing 三点区分(两者会先后出现) */
.thinkcard.live .tk-head { color: var(--muted); }
.thinkcard.live .tk-body { animation: think-breathe 2.4s var(--ease) infinite; }
.thinkcard.live .tk-head .ico { animation: think-spin 3.6s linear infinite; }
@keyframes think-breathe { 0%, 100% { border-left-color: var(--line); } 50% { border-left-color: var(--muted); } }
@keyframes think-spin { to { transform: rotate(360deg); } }
.thinkcard .caret {
  display: inline-block; width: 6px; height: 0.95em; vertical-align: -2px;
  background: var(--faint); margin-left: 2px; animation: think-blink 1s steps(2) infinite;
}
@keyframes think-blink { 50% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) {
  .thinkcard.live .tk-body, .thinkcard.live .tk-head .ico, .thinkcard .caret { animation: none; }
}

/* 「上下文已压缩」卡片:时间线分界感(虚线边框)+ 可展开摘要 */
.compactcard {
  border: 1px dashed var(--line); border-radius: var(--r-s); margin: 12px 0; max-width: 68ch;
}
.compactcard .cc-head {
  display: flex; align-items: center; gap: 8px; width: 100%; padding: 8px 12px;
  background: none; border: none; cursor: pointer; text-align: left;
  font-size: 0.75rem; color: var(--muted);
}
.compactcard .cc-head:disabled { cursor: default; }
.compactcard .cc-head .label { font-weight: 600; }
.compactcard .cc-head .stats { color: var(--faint); }
.compactcard .cc-head .chev { margin-left: auto; color: var(--faint); transition: transform 0.15s var(--ease); }
.compactcard.open .cc-head .chev { transform: rotate(180deg); }
.compactcard .cc-body {
  border-top: 1px dashed var(--line); padding: 10px 12px;
  font-size: 0.8125rem; color: var(--muted); max-height: 480px; overflow-y: auto;
}

/* PR/MR 链接卡片:与 .compactcard 同为元事件条(小字、muted、非消息层级),
   但它可点,故用实线边框区分于虚线的压缩卡。平台色只给 GitLab/GitHub 两家品牌用,
   不进状态色词汇表 —— 认不出的自建实例走 other,保持中性 */
.prcard {
  display: inline-flex; align-items: center; gap: 8px;
  max-width: min(68ch, 100%); margin: 10px 0; padding: 6px 12px 6px 10px;
  border: 1px solid var(--line-soft); border-radius: var(--r-s);
  background: var(--surface-2);
  font-size: 0.75rem; color: var(--muted); text-decoration: none;
  transition: border-color 150ms var(--ease), background 150ms var(--ease), color 150ms var(--ease);
}
.prcard .pr-ico { flex: none; width: 14px; height: 14px; color: var(--faint); }
.prcard .pr-ico svg { width: 100%; height: 100%; display: block; }
.prcard .pr-num { flex: none; font-family: var(--mono); color: var(--ink); }
.prcard .pr-repo {
  flex: 1 1 0; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  font-family: var(--mono); font-size: 0.71875rem; color: var(--muted);
}
.prcard .pr-meta { flex: none; color: var(--faint); }
.prcard .pr-go { flex: none; color: var(--faint); opacity: 0; transition: opacity 150ms var(--ease); }

.prcard[data-platform='gitlab'] .pr-ico, .prcard[data-platform='gitlab'] .pr-num { color: var(--pr-gitlab); }
.prcard[data-platform='github'] .pr-ico, .prcard[data-platform='github'] .pr-num { color: var(--pr-github); }

.prcard:hover { border-color: color-mix(in oklab, var(--ink) 22%, var(--line)); background: var(--hover); color: var(--ink); }
.prcard:hover .pr-go { opacity: 1; color: var(--muted); }
.prcard[data-platform='gitlab']:hover { border-color: color-mix(in oklab, var(--pr-gitlab) 42%, var(--line)); }
.prcard[data-platform='github']:hover { border-color: color-mix(in oklab, var(--pr-github) 42%, var(--line)); }
.prcard:focus-visible .pr-go { opacity: 1; }
@media (hover: none) { .prcard .pr-go { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .prcard, .prcard .pr-go { transition: none; } }

.raw-event {
  border: 1px dashed var(--line); border-radius: var(--r-s); padding: 8px 12px; margin: 8px 0;
  font-family: var(--mono); font-size: 0.71875rem; color: var(--faint); max-width: 68ch;
}
.raw-event .note { font-family: var(--sans); color: var(--amber); font-size: 0.6875rem; margin-bottom: 4px; }

/* ============ 会话内查找(⌘F) ============ */
/* 被搜索的滚动容器:查找条与高亮层的定位父级 */
.drawer-body, .chat { position: relative; }

/* 零高度 sticky 锚点。查找条不能直接 absolute 挂在滚动内容里——那样它属于内容流,
   跳转命中时会被内容一起卷走,顶边还会被容器边缘裁掉(原型阶段实测)。 */
.find-anchor { position: sticky; top: 0; height: 0; z-index: var(--z-sticky); }

/* 查找条 = 悬浮控件层,必须明显浮在会话内容之上。底色取 --bg(0.145),比它盖住的
   --surface-2 / --surface 更暗:深色 UI 里「更暗 + 更硬的边 + 更重的投影」才读作抬起。 */
.findbar {
  position: absolute; top: 10px; right: 18px; z-index: var(--z-sticky);
  display: flex; align-items: center; gap: 6px;
  padding: 6px 8px;
  background: var(--bg); border: 1px solid var(--line); border-radius: var(--r-s);
  box-shadow: 0 10px 30px oklch(0.03 0 0 / 0.66), 0 0 0 1px oklch(0.03 0 0 / 0.5);
  animation: fb-summon 620ms var(--ease);
}
/* 唤出瞬间闪一圈玉色轮廓,替代「用户自己找搜索框在哪」;不留常驻装饰 */
@keyframes fb-summon {
  0%   { box-shadow: 0 10px 30px oklch(0.03 0 0 / 0.66), 0 0 0 1px var(--jade), 0 0 0 6px var(--tint-jade); }
  100% { box-shadow: 0 10px 30px oklch(0.03 0 0 / 0.66), 0 0 0 1px oklch(0.03 0 0 / 0.5), 0 0 0 6px transparent; }
}
/* 输入框是独立控件,聚焦上玉色环(与 .composer:focus-within 同一套焦点语言) */
.find-field {
  display: flex; align-items: center; gap: 8px;
  background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r-s); padding: 4px 8px 4px 10px;
  transition: border-color 150ms var(--ease), box-shadow 150ms var(--ease);
}
.find-field:focus-within { border-color: var(--jade); box-shadow: 0 0 0 2px color-mix(in oklab, var(--jade) 26%, transparent); }
.find-field.nores { border-color: color-mix(in oklab, var(--red) 55%, transparent); }
.find-field.nores:focus-within { border-color: var(--red); box-shadow: 0 0 0 2px color-mix(in oklab, var(--red) 26%, transparent); }
.findbar input {
  width: 172px; background: none; border: none; outline: none;
  font-size: 0.8125rem; color: var(--ink); caret-color: var(--jade);
}
.findbar input::-webkit-search-cancel-button { display: none; }
/* 定宽:计数在「无结果 / 3/17 / 12/128」间变化时,右对齐的查找条会被推着横向抖动 */
.find-count {
  font-size: 0.75rem; color: var(--muted); flex: none;
  white-space: nowrap; font-variant-numeric: tabular-nums;
  min-width: 4.25rem; text-align: center;
}
.find-count.num { font-family: var(--mono); }
.find-count.zero { color: var(--red); }
.find-sep { width: 1px; height: 17px; background: var(--line); flex: none; margin: 0 1px; }
.find-btn {
  width: 23px; height: 23px; border-radius: 4px; color: var(--muted);
  display: grid; place-items: center; font-size: 0.75rem; line-height: 1; flex: none;
  transition: background 150ms var(--ease), color 150ms var(--ease);
}
.find-btn:hover:not(:disabled) { background: var(--hover); color: var(--ink); }
.find-btn:disabled { color: oklch(0.40 0.008 110); cursor: default; }
.find-field .find-btn { width: 20px; height: 20px; }
.find-btn.toggle[aria-pressed="true"] { background: var(--tint-jade); color: var(--jade); }
.find-btn .g { font-family: var(--mono); font-weight: 600; font-size: 0.6875rem; }
.find-scope-note {
  position: absolute; top: calc(100% + 5px); right: 0;
  font-size: 0.6875rem; color: var(--faint); white-space: nowrap;
  background: var(--bg); border: 1px solid var(--line-soft); border-radius: 4px; padding: 2px 8px;
}

/* 命中高亮层:量出来画上去,不改一个文本节点(见 FindBar.tsx 的取舍说明)。
   用半透明玉色水洗而非实心块——命中的字要照常读得清,当前命中另加一圈实边区分。 */
.find-hl-layer { position: absolute; top: 0; left: 0; width: 0; height: 0; pointer-events: none; z-index: 1; }
.find-hl {
  position: absolute; border-radius: 2px;
  background: color-mix(in oklab, var(--jade) 26%, transparent);
}
.find-hl.cur {
  background: color-mix(in oklab, var(--jade) 42%, transparent);
  box-shadow: 0 0 0 1px var(--jade);
}

/* 折叠工具卡里的命中:卡头打角标,避免「计数 12、看得见 5」的失信。
   attr() 只能读 ::after 所在元素身上的属性,故数量写在 .tc-head 上而不是卡上。 */
.toolcard:not(.open) .tc-head[data-find-hits]::after {
  content: attr(data-find-hits) " 处";
  order: 1; margin-left: auto; flex: none;
  font-family: var(--sans); font-size: 0.6875rem; font-weight: 600;
  color: var(--jade); background: var(--tint-jade); border-radius: 99px; padding: 0 7px;
}
.toolcard:not(.open) .tc-head[data-find-hits] .chev { order: 2; margin-left: 8px; }

@media (max-width: 560px) {
  .findbar { left: 12px; right: 12px; }
  .findbar input { flex: 1; width: auto; min-width: 0; }
  .find-scope-note { display: none; }
}
@media (prefers-reduced-motion: reduce) { .findbar { animation: none; } }

/* ============ 派发 ============ */
.dispatch { display: flex; flex-direction: column; height: calc(100vh - 128px); min-height: 480px; }
/* 会话状态条(紧贴输入框上方):会话标识(左端)→ 用量指示(对齐 claude-hud:Context / Usage / Weekly)→ agent 实时状态(auto 顶到最右) */
.chat-status { display: flex; align-items: center; gap: 14px; padding: 8px 6px 0; font-size: 0.6875rem; color: var(--muted); }
/* 会话标识:名称按所属项目的锁明度分类色「荧光」呈现(叠一层同色低透光晕,呼应「数据是唯一发光的东西」),
   项目身份编码进颜色后不再单列项目芯片;未命名态转 faint 中性、去光晕以区分「待命名」。
   与同行的用量条/agent 状态共享 gap,故内部再收窄一层 gap 并给标题限宽,避免挤没三条用量条。 */
.sess-ctx { display: flex; align-items: center; gap: 8px; min-width: 0; max-width: 40%; flex: none; }
.sess-ctx .sc-title { font-size: 0.9375rem; font-weight: 600; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 20ch; }
.sess-ctx .sc-title.sc-named { color: oklch(0.82 0.155 var(--ph)); text-shadow: 0 0 12px oklch(0.82 0.155 var(--ph) / 0.4); }
.sess-ctx .sc-title.sc-unnamed { color: var(--faint); font-weight: 400; }
.sess-ctx .sc-id { font-family: var(--mono); font-size: 0.6875rem; color: var(--faint); white-space: nowrap; }
.cs-state { display: flex; align-items: center; gap: 7px; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-left: auto; font-variant-numeric: tabular-nums; }
/* 状态文字变长(「已用 1m07s」「本轮 2m09s」)后整行会挤:让会话标识先让位——
   它有 ellipsis 兜底(截掉的是能从别处看到的会话名),而状态里的数字截一半就没意义了。
   cs-state 不参与收缩,收缩压力全部落到 sess-ctx;空间够时两者都不变。 */
.chat-status .sess-ctx { flex: 0 20 auto; }
/* 状态条不参与收缩:加上「本轮 N」后整行只差几像素就会把成本截成 $0…,而截一半的数字
   比截掉的会话名有害得多(会话名本就带 ellipsis,且能从卡片/标题栏看到)。
   放不下时的兜底不在这里:≤960px 由 .chat-status 的 flex-wrap 折行,≤430px 由 overflow-x 横滑。 */
.chat-status .cs-state { flex: none; }
.cs-state .cs-text { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cs-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); flex: none; transition: background 150ms var(--ease); }
.cs-state.think .cs-dot { background: var(--jade); animation: pulse 1.2s ease-in-out infinite; }
.cs-state.wait .cs-dot { background: var(--amber); animation: pulse 1.2s ease-in-out infinite; }
.cs-state.wait { color: var(--amber); }
.u-chips { display: flex; align-items: center; gap: 14px; }
/* 终端式状态行(紧贴输入框下方):cwd ⎇ 分支 | 模型 · 权限模式 */
.term-line { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 7px 6px 0; font-size: 0.75rem; color: var(--muted); }
.term-line .spacer { flex: 1; }
.term-line .branch { color: var(--jade); font-size: 0.75rem; white-space: nowrap; }
.term-line .branch .gs-m, .term-line .branch .gs-u { color: var(--amber); }
.term-line .branch .gs-a { color: var(--blue); }
/* 自绘下拉(原生 select 弹层由 OS 绘制,无法主题化;实现层用 shadcn/ui Select):状态行内向上弹出 */
.dd { position: relative; }
.dd-btn {
  display: flex; align-items: center; gap: 5px; min-width: 0;
  background: none; border: none; font-family: var(--mono); font-size: 0.75rem;
  padding: 3px 7px; margin: -3px 0; border-radius: var(--r-s); cursor: pointer;
  transition: background 150ms var(--ease);
}
.dd-btn:hover { background: var(--hover); }
.dd-btn:focus-visible { outline: 2px solid var(--jade); outline-offset: 1px; }
.dd-btn .caret { font-size: 0.5625rem; color: var(--faint); flex: none; }
/* 长路径(如工作目录)超出下拉框宽度时省略号截断,不再撑破右边界;完整值走 title 悬浮提示 */
.dd-val { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#cwd-dd .dd-btn { color: var(--blue); }
#model-dd .dd-btn { color: var(--violet); }
.dd.dim .dd-btn { color: var(--muted); font-family: var(--sans); }
.dd-menu {
  position: absolute; bottom: calc(100% + 6px); left: 0; min-width: 200px;
  max-width: min(420px, calc(100vw - 32px));
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-m);
  padding: 4px; z-index: var(--z-dropdown); box-shadow: 0 8px 24px oklch(0.05 0 0 / 0.5);
  opacity: 0; transform: translateY(4px); pointer-events: none;
  transition: opacity 150ms var(--ease), transform 150ms var(--ease);
}
.dd.open .dd-menu { opacity: 1; transform: none; pointer-events: auto; }
/* 移动端 sheet 化专用背景(见「移动端」媒体查询块);桌面始终隐藏 */
.dd-backdrop { display: none; }
.dd-item {
  display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%;
  background: none; border: none; text-align: left; cursor: pointer;
  font-family: var(--mono); font-size: 0.75rem; color: var(--ink);
  padding: 7px 10px; border-radius: var(--r-s); transition: background 150ms var(--ease);
}
.dd.dim .dd-item { font-family: var(--sans); }
.dd-item:hover { background: var(--hover); }
.dd-item:focus-visible { outline: 2px solid var(--jade); outline-offset: -2px; }
.dd-item-label { min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dd-item .tick { color: var(--jade); font-size: 0.6875rem; visibility: hidden; flex: none; }
.dd-item.sel .tick { visibility: visible; }
#jm-cwd-dd .dd-btn { color: var(--blue); }
#jm-model-dd .dd-btn { color: var(--violet); }
/* 模态内下拉:向下弹出(默认向上弹出是为贴屏底的 composer 设计),触发钮补满字段宽度并现出 surface 底 + line 边框 */
.dd.down .dd-menu { bottom: auto; top: calc(100% + 6px); width: 100%; min-width: 0; }
.dd.down .dd-btn { width: 100%; justify-content: space-between; background: var(--surface); border: 1px solid var(--line); padding: 6px 12px; margin: 0; }
.dd.down .dd-btn:hover { border-color: var(--muted); }
.dd.down.open .dd-btn { border-color: var(--jade); }
/* 切目录但会话仍在进行时的常驻提示(比 toast 更稳妥) */
.cwd-note {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 8px 6px 0; font-size: 0.75rem; color: var(--muted);
}
.cwd-note .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--amber); flex: none; }
.cwd-note .mono { color: var(--ink); }
/* 用量芯片:轨道 = 配额窗口。填充=已用,轨上亮刻度=此刻在窗口中的位置,填充越过刻度即烧超。
   5px 细轨在近黑底上读不出填充比例,故加厚到 10px;倒计时从 title 移到轨后常驻(悬停在移动端不存在)。 */
.u-chip { display: flex; align-items: center; gap: 7px; font-size: 0.6875rem; color: var(--muted); white-space: nowrap; }
.u-chip b { font-family: var(--mono); font-weight: 500; font-size: 0.75rem; color: var(--ink); }
.u-chip .u-reset { font-family: var(--mono); font-style: normal; font-size: 0.6875rem; color: var(--faint); }
.u-bar {
  position: relative; width: 88px; height: 10px; border-radius: 3px;
  background: var(--tint-muted); overflow: hidden; display: inline-block; flex: none;
}
.u-bar i { display: block; height: 100%; background: var(--jade-dim); transition: width 400ms var(--ease); }
/* 刻度上下各溢出 1px 顶到轨道边缘,窄轨上才看得出是「一道标线」而非填充的一段 */
.u-bar .u-tick { position: absolute; top: -1px; bottom: -1px; width: 2px; border-radius: 1px; background: var(--ink); opacity: 0.55; }
@media (prefers-reduced-motion: reduce) { .u-bar i { transition: none; } }
/* Weekly 合并双轨(原型 prototype-fable-quota.html 方案 B):all models 与模型级周窗口同一重置时刻,
   并为一个芯片——上轨 8px all models、下轨 5px 模型级(如 Fable),共用时间刻度,倒计时只写一遍。
   模型级数值恒以紫色小字前缀标识模型身份(与模型下拉同源),填充色仍按 50/75 阈值。 */
.u-chip.wk2 .wk2-bars { display: grid; gap: 2px; flex: none; }
.u-chip.wk2 .u-bar { height: 8px; }
.u-chip.wk2 .u-bar.wk2-fb { height: 5px; border-radius: 2px; }
.u-chip.wk2 .wk2-vals { display: grid; line-height: 1.25; }
/* 两排数值同字号(0.75rem b),只靠字母前缀区分:A(faint 灰)对 F(紫,紫只标模型身份) */
.u-chip.wk2 .wk2-pfx { font-size: 0.625rem; color: var(--faint); }
.u-chip.wk2 .wk2-pfx.fb { color: var(--violet); }
/* min-height:0 是经典 flexbox 坑的修复:flex 子项默认 min-height:auto,在部分内核
   (含若干 Android 内嵌 WebView)下会拒绝收缩到小于内容自然高度,导致 flex:1 + overflow-y:auto
   形同虚设——内容直接把父容器撑高,溢出屏幕(2026-07-23 真机反馈:嵌入式浏览器里发送按钮被顶到
   底部导航条后面看不清,根因正是这里,而非某个具体尺寸算错)。 */
/* position:relative —— 轮次导航按 offsetTop 量当前轮,offsetParent 必须是这个滚动容器本身 */
.chat { position: relative; flex: 1; min-height: 0; overflow-y: auto; border: 1px solid var(--line-soft); border-radius: var(--r-m); background: var(--surface-2); padding: 20px 28px; }
.chat-msg { margin-bottom: 20px; }
.chat-msg .who { font-size: 0.6875rem; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
.chat-msg.user .who { color: var(--jade); }
/* 你的消息靠右贴边:与左侧 Claude 文区分居两侧车道(各自 ≤72%),各自贴近外框 */
.chat-msg.user { display: flex; flex-direction: column; align-items: flex-end; }
/* overflow-wrap:长 URL/路径/哈希等无空格串强制断行,不再溢出气泡侵入对侧车道 */
.chat-msg .body { font-size: 0.875rem; max-width: 72%; text-wrap: pretty; overflow-wrap: anywhere; word-break: break-word; }
.chat-msg.user .body {
  background: var(--tint-jade); border-radius: var(--r-m);
  padding: 10px 14px; display: inline-block; max-width: 72%;
  /* pre-wrap:用户输入的多行文本原样换行(复制出来也保留换行),而非被折叠成一行 */
  white-space: pre-wrap;
}
.typing { display: inline-flex; gap: 4px; padding: 4px 0; }
.typing i { width: 5px; height: 5px; border-radius: 50%; background: var(--muted); animation: pulse 1.2s infinite; }
.typing i:nth-child(2) { animation-delay: 0.2s; }
.typing i:nth-child(3) { animation-delay: 0.4s; }

.approval {
  border: 1px solid color-mix(in oklab, var(--amber) 45%, transparent);
  background: var(--tint-amber); border-radius: var(--r-m);
  padding: 14px 16px; margin: 10px 0; max-width: 68ch;
}
.approval .a-head { display: flex; align-items: center; gap: 8px; font-size: 0.75rem; font-weight: 600; color: var(--amber); margin-bottom: 8px; }
.approval .a-tool { font-family: var(--mono); font-size: 0.78125rem; color: var(--ink); background: var(--surface); border: 1px solid var(--line-soft); border-radius: var(--r-s); padding: 8px 12px; margin-bottom: 10px; overflow-x: auto; white-space: pre; }
.approval .a-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.approval.resolved { border-color: var(--line-soft); background: var(--surface); }
.approval.resolved .a-head { color: var(--muted); }

.composer { margin-top: 6px; border: 1px solid var(--line); border-radius: var(--r-m); background: var(--surface); transition: border-color 150ms var(--ease); }
.composer:focus-within { border-color: var(--jade); }

/* 粘贴图片附件条:在 textarea 上方、composer 边框之内——图片与文字视觉上同属一条待发消息。
   缩略图 56px 方块 cover 裁切,多张换行不横滚(横滚会藏图,数量本就封顶 8 张)。 */
.composer .attach-strip { display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 16px 0; }
.composer.has-attach textarea { padding-top: 10px; } /* 附件条已给了呼吸感,顶部留白略收 */
.attach-chip {
  position: relative; width: 56px; height: 56px; flex: none;
  border: 1px solid var(--line); border-radius: var(--r-s);
  overflow: hidden; background: var(--surface-2); cursor: zoom-in;
  animation: chip-in 150ms var(--ease);
}
@keyframes chip-in { from { opacity: 0; transform: scale(0.92); } }
.attach-chip img { width: 100%; height: 100%; object-fit: cover; display: block; }
.attach-chip .rm {
  position: absolute; top: 2px; right: 2px; width: 18px; height: 18px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 50%; background: oklch(0.145 0.006 120 / 0.72); color: var(--ink);
  font-size: 0.625rem; line-height: 1; opacity: 0; transition: opacity 120ms var(--ease); cursor: pointer;
}
.attach-chip:hover .rm, .attach-chip .rm:focus-visible { opacity: 1; }
/* 触屏无 hover:粗指针设备上 ✕ 常驻,否则图片没法移除 */
@media (pointer: coarse) { .attach-chip .rm { opacity: 1; } }

/* 已发送消息里的图片:缩略图排在文字上方,点击开灯箱 */
.chat-msg .msg-imgs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
.chat-msg.user .msg-imgs { justify-content: flex-end; }
.chat-msg .msg-imgs img {
  width: 88px; height: 88px; object-fit: cover;
  border: 1px solid var(--line); border-radius: var(--r-s); cursor: zoom-in;
}

/* 灯箱:点缩略图看原图 */
.lightbox {
  position: fixed; inset: 0; z-index: var(--z-backdrop);
  display: none; align-items: center; justify-content: center;
  background: oklch(0.145 0.006 120 / 0.82); cursor: zoom-out;
}
.lightbox.open { display: flex; }
.lightbox img {
  max-width: 88vw; max-height: 88vh; border-radius: var(--r-m);
  border: 1px solid var(--line); box-shadow: 0 24px 64px oklch(0 0 0 / 0.5);
}
/* 高度跟随内容:由 Dispatch.tsx 的 growTa() 写 inline height(WebKit 尚不支持 field-sizing)。
   下限 56px 与 TA_MIN_H 同值(改一处必须改另一处);上限取 12 行正文与 40vh 的小者,
   触顶后转输入框内部滚动。不给 height 加 transition——逐键动画会抖,瞬时跟手才是输入框手感。 */
.composer textarea {
  width: 100%; background: none; border: none; resize: none;
  min-height: 56px;
  max-height: min(40vh, calc(0.875rem * 1.5 * 12 + 16px));
  overflow-y: auto;
 
}
.composer textarea:focus { outline: none; }

/* ============ 斜杠命令联想面板 ============
   锚在输入框上方,沿用 .dd-menu 的浮层词汇:不透明 surface + line 边框 + 8px 投影。
   与 .dd-menu 同理,玻璃档下不跟随变半透明——浮在前景内容之上的弹层透出底下的字会没法选。 */
.composer { position: relative; }
.xj-slash {
  position: absolute; left: 0; right: 0; bottom: calc(100% + 6px);
  background: var(--surface-opaque); border: 1px solid var(--line); border-radius: var(--r-m);
  z-index: var(--z-dropdown); box-shadow: 0 8px 24px oklch(0.05 0 0 / 0.5);
  overflow: hidden;
}
.xj-slash-list { max-height: 312px; overflow-y: auto; padding: 4px 4px 6px; }
.xj-slash-item {
  display: grid; grid-template-columns: auto 1fr; column-gap: 10px; align-items: baseline;
  width: 100%; text-align: left; background: none; border: none; cursor: pointer;
  padding: 6px 10px; border-radius: var(--r-s); transition: background 150ms var(--ease);
}
.xj-slash-item:hover { background: var(--hover); }
.xj-slash-item.sel { background: var(--tint-jade); }
.xj-slash-name { font-family: var(--mono); font-size: 0.75rem; white-space: nowrap; color: var(--muted); }
/* CLI 同款:只把已输入的前缀提亮加粗,其余字淡;不画下划线 */
.xj-slash-name mark { background: none; color: var(--ink); font-weight: 700; }
.xj-slash-item.sel .xj-slash-name, .xj-slash-item.sel .xj-slash-name mark { color: var(--jade); }
.xj-slash-name .arg { color: var(--faint); font-weight: 400; margin-left: 6px; }
.xj-slash-desc {
  min-width: 0; font-size: 0.6875rem; color: var(--muted);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.xj-slash-item.sel .xj-slash-desc { color: var(--ink); }
/* 输入框里完整命中的命令词。只变色不加粗:镜像层字宽必须与 textarea 逐字一致,
   粗体会让 caret 压在命令末字上(2026-09-16 原型实测)。 */
.ta-wrap .ta-mirror .tk-cmd { color: var(--jade); }

/* ============ 输入框代码语法高亮 ============
   textarea 文字设为透明、只留 caret,底下叠一层 .ta-mirror 用完全相同的排版重绘同一段文本,
   只给代码区间上底色(解析见 lib/composer-code.ts)。字体不切等宽:切了字宽变化,镜像与
   textarea 必然逐字错位,代码的辨识度交给底色。 */
.ta-wrap { position: relative; }
/* 镜像与 textarea 必须共享的一切排版属性 —— 改任一处必须同步改另一处,否则字不对位 */
.ta-wrap textarea,
.ta-wrap .ta-mirror {
  font-family: inherit; font-size: 0.875rem; line-height: 1.5;
  padding: 12px 16px 4px;
  white-space: pre-wrap; word-break: break-word;
  letter-spacing: normal; tab-size: 4;
}
/* display: block 不可省:textarea 默认 inline-block 按 baseline 对齐,会在 .ta-wrap 底部多出约 6px
   行框余量;镜像 inset:0 铺满整个 .ta-wrap 就比 textarea 高 6px,两者可滚动范围不等——触顶后
   textarea 滚到底时镜像还差 6px 没滚到,文字整体低于 caret/IME 下划线(2026-09-15 用户实测:
   剪切再粘贴长文本,caret 与文字错位、拼音下划线画成删除线)。 */
.ta-wrap textarea { display: block; position: relative; z-index: 1; color: transparent; caret-color: var(--ink); }
/* 全局 ::placeholder 给了显式色,不随 color:transparent 隐去 —— 不压掉就与镜像层 .ph 叠成重影 */
.ta-wrap textarea::placeholder { color: transparent; }
.ta-wrap textarea::selection { background: color-mix(in oklab, var(--jade) 26%, transparent); }
.ta-wrap .ta-mirror {
  position: absolute; inset: 0; overflow: hidden; pointer-events: none;
  color: var(--ink); border-radius: var(--r-m);
}
.ta-wrap .ta-mirror .ph { color: var(--faint); } /* 空输入的占位文案(textarea 自身 placeholder 被透明色吃掉) */
/* IME 预编辑态:镜像让位给 textarea(见 Dispatch.tsx 的 onCompositionStart)。
   visibility 而非 display:none —— 不动布局,组合结束原地恢复,不会闪一下高度。 */
.ta-wrap.composing textarea { color: var(--ink); }
.ta-wrap.composing .ta-mirror { visibility: hidden; }
/* 行内代码 `x`:与消息区 .md code 同一层语汇 —— 比所在面亮一档 + 一条细边。
   描边用 inset shadow 而非 border/padding:零布局影响,字形位置不动。 */
.tk-inline {
  background: var(--code-tint); box-shadow: inset 0 0 0 1px var(--line);
  border-radius: 4px; color: var(--ink);
}
/* 代码块正文:与行内同底,逐行连成一片以示「整段」 */
.tk-fence {
  background: var(--code-tint); box-shadow: inset 0 0 0 1px var(--line-soft);
  border-radius: 3px; color: var(--ink);
}
/* 围栏标记 ``` 与语言名:是语法不是内容,退到 faint/玉暗 */
.tk-mark { color: var(--faint); }
.tk-lang { color: var(--jade-dim); }
/* 未闭合的围栏:琥珀描边 —— 本产品里琥珀 = 「等你处理」,这里等的是一条收尾 ``` */
.tk-open { box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--amber) 55%, transparent); border-radius: 4px; }
/* 底栏 hint 在围栏内换词:玉点提示 Enter 语义已切换,是状态不是装饰 */
.composer .hint.in-fence { color: var(--jade-dim); }
.composer .hint.in-fence::before {
  content: ''; display: inline-block; width: 5px; height: 5px; border-radius: 50%;
  background: var(--jade); margin-right: 6px; vertical-align: middle;
}
/* 语法提示:只在输入框聚焦时现身,不常驻抢注意力 */
.composer .code-help {
  font-family: var(--mono); font-size: 0.6875rem; color: var(--faint); flex: none;
  border: 1px solid var(--line-soft); border-radius: var(--r-s); padding: 2px 7px;
  opacity: 0; transition: opacity 150ms var(--ease);
}
.composer:focus-within .code-help { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .composer .code-help { transition: none; } }
/* 触顶渐隐:只在 .at-max 时现出,负 margin 压在输入框底部一线,不占布局高度 */
.composer .grow-fade {
  height: 14px; margin-top: -14px; position: relative; pointer-events: none;
  background: linear-gradient(to bottom, transparent, var(--surface));
  opacity: 0; transition: opacity 150ms var(--ease);
}
.composer.at-max .grow-fade { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .composer .grow-fade { transition: none; } }
.composer .c-bar { display: flex; align-items: center; gap: 12px; padding: 6px 10px 8px 16px; }
.composer .hint { font-size: 0.6875rem; color: var(--faint); }
.composer .bg-opt { display: flex; align-items: center; gap: 6px; font-size: 0.75rem; color: var(--muted); margin-left: auto; cursor: pointer; }
/* 发送按钮:桌面文字常驻,移动端切图标(见「移动端」媒体查询块),二选一由 CSS 驱动而非 JS 条件渲染 */
.send-btn-icon { display: none; }

/* 移动端专属:会话标识挪进消息区顶部(见 Dispatch.tsx chat-sessctx-mobile),桌面恒隐藏 */
.chat-sessctx-mobile { display: none; }

/* ============================================================
   快速提问标记:新会话未绑仓库时的显性标识,出现在状态行与空态两处。
   命名带 xj- 项目前缀,避开 Tailwind 工具类命名空间(见 memory)。
   底色混进 --surface-opaque(面板基色的不透明原值),而不是 var(--surface):
   玻璃档 body.wall-glass 会把 --surface 重定义成半透明,混进去照样漏壁纸
   (原型实测 1.16:1)。弹出菜单与设置模态用的是同一个 token。
   ============================================================ */
.xj-qa-pill {
  display: inline-flex; align-items: center; gap: 5px; flex: none;
  font-size: 0.6875rem; font-weight: 500;
  color: var(--blue); background: color-mix(in oklab, var(--blue) 16%, var(--surface-opaque));
  border-radius: var(--r-s); padding: 2px 7px; white-space: nowrap;
}
.xj-qa-pill .qa-ico { width: 12px; height: 12px; flex: none; }
.xj-qa-badge {
  display: inline-flex; align-items: center; gap: 6px; margin-bottom: 12px;
  font-size: 0.75rem; color: var(--blue);
  background: color-mix(in oklab, var(--blue) 14%, var(--surface-opaque));
  border-radius: 999px; padding: 4px 12px 4px 10px;
}
.xj-qa-badge .qa-ico { width: 14px; height: 14px; flex: none; }
.chat-empty { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.chat-empty h2 { font-size: 1rem; margin-bottom: 6px; }
.chat-empty p { color: var(--muted); font-size: 0.8125rem; max-width: 40em; margin-bottom: 18px; }
.sugg { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
.sugg button {
  border: 1px solid var(--line); border-radius: 99px; padding: 6px 16px;
  font-size: 0.8125rem; color: var(--muted); background: var(--surface);
  transition: border-color 150ms var(--ease), color 150ms var(--ease);
}
.sugg button:hover { border-color: var(--jade); color: var(--jade); }

.resume-note {
  display: flex; align-items: center; gap: 8px; font-size: 0.75rem; color: var(--blue);
  background: var(--tint-blue); border-radius: var(--r-s); padding: 6px 12px; margin-bottom: 10px;
}

/* ============ 技能 ============ */
.filter-tabs { display: inline-flex; gap: 2px; background: var(--surface-2); border: 1px solid var(--line-soft); border-radius: var(--r-s); padding: 2px; }
.filter-tabs button { padding: 4px 12px; border-radius: 4px; font-size: 0.75rem; color: var(--muted); transition: background 150ms var(--ease), color 150ms var(--ease); }
.filter-tabs button:hover { color: var(--ink); }
.filter-tabs button.active { background: var(--hover); color: var(--ink); font-weight: 600; }
.skill-desc { color: var(--muted); font-size: 0.75rem; max-width: 46ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.check { color: var(--jade); }
.uncheck { color: var(--faint); }

/* ---- 技能表列宽 ----
   auto 布局下列宽由内容决定:切窗口让 210 变成 3、排序把长名字换到首屏,
   整张表就会重新分配宽度、行与行之间横向错位。改 fixed + colgroup 定死骨架:
   只有「描述」是弹性列(窄屏只压它),其余按内容上界给定值,任何窗口/排序下都不动。 */
/* 宽度写在表头单元格而不是 colgroup:fixed 布局下列宽取自首行,
   这样窄屏 display:none 掉某列时,剩下的列自然按各自宽度重排
   (colgroup 是按位置映射的,隐藏第 4 列会让第 5 列错拿第 4 个 col 的宽度) */
.table-skills { table-layout: fixed; }
.table-skills th:nth-child(1) { width: 200px; }  /* mono 技能名,超长省略号 + title 兜全名 */
.table-skills th:nth-child(2) { width: auto; }   /* 描述:唯一弹性列,吃掉剩余空间 */
.table-skills th:nth-child(3) { width: 132px; }  /* 3 位数字(3ch)+ 72px 满条 + 间距,四位数也不换行 */
.table-skills th:nth-child(4) { width: 76px; }
.table-skills th:nth-child(5) { width: 72px; }
.table-skills th:nth-child(6) { width: 78px; }
.table-skills th:nth-child(7) { width: 64px; }
/* 描述列没给 col 宽度 = 吃掉剩余空间;fixed 布局下 max-width 失效,靠单元格自身截断 */
.table-skills .skill-desc { max-width: none; }
.table-skills .cell-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* 窄屏结构性收列:固定列合计 622px,窗口再窄就只剩描述被压(1024 宽时只剩 ~100px,等于不可读)。
   版本/可调用/来源是查阅项而非扫视项,抽屉里都有,先收它们把宽度还给描述;
   名称/触发/启用是这张表的三个主任务(找技能、看用量、开关),任何宽度都保留。 */
@media (max-width: 1279px) {
  .table-skills :is(th, td):nth-child(4),
  .table-skills :is(th, td):nth-child(5),
  .table-skills :is(th, td):nth-child(6) { display: none; }
}

/* ---- 显式排序控件 ----
   「排序」标签用 faint 层级只作锚点:窗口组(7/30/90 天)与筛选组(全部/已启用)语义自明,
   排序组不带标签会和它们混成一排无从分辨。tabs 本身复用 filter-tabs,控件语言保持一套。 */
.sort-group { display: inline-flex; align-items: center; gap: 8px; }
.sort-label { font-size: 0.75rem; color: var(--faint); }
.s-arrow { font-size: 0.625rem; color: var(--faint); }
.sort-group .filter-tabs button.active .s-arrow { color: var(--jade); }

/* ---- 触发次数 ---- */
/* 排序表头:按钮撑满 th(点击热区仍是整格),当前排序列点亮箭头 */
.usage-th { padding: 0; }
.usage-th button {
  display: block; width: 100%; text-align: left; cursor: pointer; user-select: none;
  padding: 10px 18px; font: inherit; font-size: 0.75rem; font-weight: 600; color: var(--muted);
  transition: color 150ms var(--ease);
}
.usage-th button:hover { color: var(--ink); }
.usage-th .arrow { font-size: 0.625rem; margin-left: 3px; color: var(--faint); }
.usage-th.sorted button { color: var(--ink); }
.usage-th.sorted .arrow { color: var(--jade); }
/* 数字用 tabular-nums 右对齐:逐位对齐,列内数字上下成一条线。
   横条走图表色(--chart-1)而非状态色——它表量级,不表状态 */
.usage-cell { display: flex; align-items: center; gap: 8px; }
.usage-n { font-family: var(--mono); font-size: 0.8125rem; font-variant-numeric: tabular-nums; min-width: 3ch; text-align: right; }
.usage-n.zero { color: var(--faint); }
.usage-bar { height: 5px; border-radius: 99px; background: color-mix(in oklab, var(--chart-1) 55%, transparent); min-width: 2px; flex: none; transition: width 200ms var(--ease); }

/* 抽屉「使用情况」:kv + 近 30 天逐日迷你柱 */
.drawer-sec { border-top: 1px solid var(--line-soft); padding-top: 16px; margin-top: 4px; }
.drawer-sec + .drawer-sec { margin-top: 20px; }
.drawer-sec h3 { font-size: 0.8125rem; color: var(--ink); margin-bottom: 10px; }
.usage-kv { display: grid; grid-template-columns: 96px 1fr; gap: 6px 14px; font-size: 0.8125rem; margin-bottom: 18px; }
.usage-kv dt { color: var(--muted); }
.usage-kv dd { font-family: var(--mono); font-size: 0.78125rem; font-variant-numeric: tabular-nums; }
.usage-spark { display: flex; align-items: flex-end; gap: 2px; height: 36px; margin: 4px 0 2px; }
.usage-spark i { flex: 1; min-width: 3px; border-radius: 2px 2px 0 0; background: color-mix(in oklab, var(--chart-1) 55%, transparent); }
.usage-spark i.zero { height: 2px !important; background: var(--line-soft); }
.usage-spark-cap { font-size: 0.6875rem; color: var(--faint); display: flex; justify-content: space-between; }
.usage-spark-empty { font-size: 0.75rem; color: var(--faint); height: 36px; display: flex; align-items: center; }

.kv { display: grid; grid-template-columns: 96px 1fr; gap: 6px 14px; font-size: 0.8125rem; margin-bottom: 18px; }
.kv dt { color: var(--muted); }
/* 长 URL / 路径(MR 链接、锚点文件路径)无空格,不强制断行会顶破抽屉右边界 */
.kv dd { min-width: 0; overflow-wrap: anywhere; }
.md-preview { border-top: 1px solid var(--line-soft); padding-top: 16px; font-size: 0.8125rem; color: var(--muted); max-width: 68ch; }
.md-preview h3 { color: var(--ink); font-size: 0.875rem; margin: 14px 0 6px; }
.md-preview code { font-family: var(--mono); font-size: 0.75rem; background: var(--surface); border: 1px solid var(--line-soft); border-radius: 4px; padding: 0 5px; }
.md-preview p { margin-bottom: 8px; text-wrap: pretty; }

/* ============ 经验 ============ */
.mem-toolbar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 18px; }
.mem-group { margin-bottom: 22px; }
.mem-group > h2 { font-size: 0.8125rem; color: var(--muted); font-weight: 600; margin-bottom: 8px; display: flex; gap: 8px; align-items: baseline; }
.mem-group > h2 .path { font-family: var(--mono); font-size: 0.6875rem; color: var(--faint); font-weight: 400; }
.mem-item {
  display: flex; align-items: baseline; gap: 12px; padding: 10px 18px;
  border-bottom: 1px solid var(--line-soft); cursor: pointer;
  transition: background 120ms var(--ease);
}
.mem-item:hover { background: var(--hover); }
.mem-item:last-child { border-bottom: none; }
.mem-item .name { font-family: var(--mono); font-size: 0.78125rem; color: var(--ink); flex: none; }
.mem-item .desc { color: var(--muted); font-size: 0.8125rem; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
