const PUB = [{"name": "agent-browser-headed-leftover-cpu-hog", "description": "agent-browser --headed 开的 Chrome for Testing 不会随会话结束退出，会在用户机器上持续满载跑一天以上，把整机拖慢并制造出「偶发卡顿」假象；每轮验证结束必须 agent-browser close --all，排查性能先看 ps", "type": "feedback", "project": "xuanji", "projectPath": "~/xuanji", "file": "~/.claude/projects/…/memory/agent-browser-headed-leftover-cpu-hog.md", "body": "用 `agent-browser --headed` 验证过 IO/动画后没关，那个 Chrome for Testing 在用户 Mac 上留了 25 小时，\n两个进程各占 86–97% CPU、累计 561 分钟 CPU 时间；同期后端 10ms 的接口跑到 200–590ms，用户在 Pake\n壳里看到的「每十几秒冻结 600–950ms」和我的实验室里「看板娘开/关/换档都一样冻结」都是整机被拖慢的\n结果，害我在 markdown、看板娘、轮询之间绕了整整一轮。\n\n**How to apply:** 每轮浏览器验证结束（尤其 `--headed`、live2d/WebGL 页面）立刻 `agent-browser close --all`，\n交付前 `pgrep -fl \"Chrome for Testing\"` 确认无残留。凡是「偶发卡顿 / 全局变慢 / 后端接口忽快忽慢」，\n先 `uptime` + `top -o cpu` 看整机负载和 CPU 大户（`ps -o etime,time` 看累计 CPU 时间揪出长期驻留者），\n再谈前端代码；后端与前端同时变慢就是整机问题的指纹。另外卡顿记录文件会混进我自己测试浏览器上报的\n记录，读用户现场要按 UA 过滤（Pake 壳是 `Version/16.1 Safari`）。相关：[[perf-ab-needs-narrow-window]]、\n[[shared-browser-instance-tab-race]]。", "links": ["perf-ab-needs-narrow-window", "shared-browser-instance-tab-race"]}, {"name": "browser-automation-blind-to-native-dialogs", "description": "agent-browser 拦截系统文件选择器等原生对话框,「事件到达了元素」证明不了「窗口真的弹出来」;要证明必须起独立 Chrome + CDP 真实鼠标 + 整屏截图", "type": "feedback", "project": "xuanji", "projectPath": "~/xuanji", "file": "~/.claude/projects/…/memory/browser-automation-blind-to-native-dialogs.md", "body": "自动化浏览器（agent-browser / 任何 CDP 驱动的实例）默认**拦截系统级原生对话框**：文件选择器、打印、权限弹窗。页面里能观察到的一切都正常——click 事件到达了 `input[type=file]`、`elementFromPoint` 命中它、`document.hasFocus()` 也是 true——但那扇窗从来没打开过。**页面内的探针天然看不见页面外的东西。**\n\n**Why:** 2026-09-03 做璇玑设置面板，用户报「点『本地…』没反应」。我用 agent-browser 验证到「click 计数为 1」，就据此说修好了，被打回；第二次改成 label 包裹 file input，仍然只验到同一个指标，又被打回。**两次都是拿「事件到达」当「对话框弹出」的证据**，而这两件事之间恰好隔着自动化环境的拦截层。最后起了一个独立 Chrome（自己的 user-data-dir、非自动化 profile）+ CDP `Input.dispatchMouseEvent` 发真实鼠标 + `/usr/sbin/screencapture` 整屏截图，才第一次看到 macOS「打开」对话框真的压在设置面板上，从而证明代码是对的、用户那边是旧模块没热更新。绕这一大圈的根因是我一开始就没意识到工具有这条能力边界。\n\n**How to apply:**\n1. 交付涉及**原生对话框**（文件选择/上传、打印、摄像头麦克风权限、beforeunload）时，agent-browser 只能验到「链路通」，**不能验到「窗口出现」**。这个差距必须在交付说明里讲明，不要含糊成「已验证」。\n2. 要拿真证据就走这条路：`Google Chrome --remote-debugging-port=<高位端口> --user-data-dir=/tmp/<临时目录>` 起一个干净实例 → CDP `Input.dispatchMouseEvent`（`mouseMoved`→`mousePressed`→`mouseReleased`）发真实鼠标 → `/usr/sbin/screencapture -x` 截**整个屏幕**而不是页面。注意 `screencapture` 不在默认 PATH 里，要写全路径。\n3. 验文件上传的**功能**（不含弹窗本身）用 `agent-browser upload @eN <path>`：能验到 onChange、落库、界面反应，够覆盖大部分回归。\n4. 用户报「点了没反应、也没有任何闪动」时，先分清两种：**没弹出**（事件没到 / 元素被禁用 / 手势判定失败）与**弹了又立刻关**（DOM 被重建把 picker 关掉）。前者页面无变化，后者常伴随焦点跳动。\n5. 用完 `pkill -f \"user-data-dir=/tmp/<临时目录>\"` 并删掉 profile，别把临时 Chrome 留在用户桌面上。\n\n相关：[[shared-browser-instance-tab-race]]（同属 agent-browser 的使用陷阱）、[[vacuous-assertion-false-positive]] 与 [[verify-in-users-daily-config]]（同属「验证本身不可信」这一类）", "links": ["shared-browser-instance-tab-race", "vacuous-assertion-false-positive", "verify-in-users-daily-config"]}, {"name": "build-strips-unprefixed-backdrop-filter", "description": "璇玑前端构建(Tailwind v4 / lightningcss)把无前缀 backdrop-filter 折叠成只剩 -webkit-,Chrome 下所有磨砂失效而 Pake 壳正常;判生效要读构建产物或 getComputedStyle,别看源码", "type": "project", "project": "xuanji", "projectPath": "~/xuanji", "file": "~/.claude/projects/…/memory/build-strips-unprefixed-backdrop-filter.md", "body": "2026-09-24 做内嵌终端时发现:源码同时写了 `backdrop-filter` 与 `-webkit-backdrop-filter`,构建产物里只剩 `-webkit-` 那条;\nChrome 不认前缀版,`getComputedStyle(el).backdropFilter === 'none'`。全站壁纸玻璃档(`body.wall-glass :is(...)`)同病——\n**Chrome 里从来没有磨砂**,只是日常用 Pake 壳(WebKit,认前缀)所以没人发现。\n\n**Why:** 源码看着没问题、Pake 里也正常,只有在 Chrome 截图里背景卡片「清晰可读」才露馅;症状像「模糊值太小」,其实是整条声明没了。\n\n**How to apply:**\n- 任何磨砂/模糊改动,验收时 `getComputedStyle(...).backdropFilter` 读一次,或 grep 构建产物 `dist/assets/*.css`。\n- 需要跨浏览器生效时用 React 内联 style(`backdropFilter` + `WebkitBackdropFilter`)绕开构建链(终端 `.tty-c` 即此做法)。\n- 玻璃档的全局修复(改构建 targets 或内联)尚未做,见收口卡 2026-09-24-xuanji-embedded-terminal。\n- 相关:[[verify-in-users-daily-config]] [[ua-default-needs-scheme-declaration]]", "links": ["verify-in-users-daily-config", "ua-default-needs-scheme-declaration"]}, {"name": "claude-weekly-limit-cost-weighted", "description": "Claude 订阅 weekly limit 的消耗按成本权重计,cacheRead 只按 0.1× 计入——看额度大头用成本口径,不用 token 量口径(inOut 把 cacheRead 排除在外,对这个问题是错的)", "type": "reference", "project": "xuanji", "projectPath": "~/xuanji", "file": "~/.claude/projects/…/memory/claude-weekly-limit-cost-weighted.md", "body": "Claude 订阅(Pro/Max)的 session/weekly limit 消耗是**成本加权**的,不是按原始 token 数等权:cacheRead 按 **0.1× input 单价**计入,output 5×、cacheWrite 1.25×,与 API 计费权重一致。\n\n**证据**(2026-08-31 查证,Claude Code 官方 costs 文档「Why usage climbs in a long session」):\n\n> With prompt caching, Claude Code re-reads that history **at the cached token rate**, so a one-line question in a session that has been open all day still draws usage for the whole conversation.\n\n即缓存命中的历史按缓存费率(0.1×)扣额度。同文档把「cache misses」列为 `/usage` plan 用量分析特别标记的吃额度行为——miss 的代价正是 0.1× 的 read 变成 1.25× 的 write,若两者等权则无需点名。\n\n**How to apply**:\n- 用户问「weekly limit 大头是谁 / 额度被什么吃掉」→ 看璇玑仪表盘的**成本 $ 口径**,不是 token 量。inOut 口径故意排除了 cacheRead,而 cacheRead 折算当量往往比 inOut 总量还大(2026-08 实测:459M×0.1≈46M vs inOut 23M),等权直觉会严重高估它。\n- 实测参照(2026-08 那一周,weekly limit 用到 97%):开发 $379(53%)vs multica $330(47%),基本对半;multica 里扫描归因 $300 是主力。\n- 两个已知不确定:仪表盘只统计本机 `~/.claude`(与账号级额度计量不完全重合,但相对占比可信);跨模型额度权重是否严格等于牌价比例($5 opus vs $3 sonnet)官方未写死。\n- 交叉验证入口:终端 `/usage` 按 `w` 切 7 天视图,官方自己的 plan 用量归因。\n- 另注意:订阅下 prompt cache TTL 是 1 小时,用尽额度改走 usage credits 后降为 5 分钟——同样的使用模式 cache miss 会变多,成本结构会变差。\n\n相关:[[reused-filter-changes-meaning]](multica 归类口径)。API 速率限制(ITPM)是另一套口径:cacheRead 完全不计入 ITPM,与额度的 0.1× 不同,勿混用。", "links": ["reused-filter-changes-meaning"]}, {"name": "client-cache-must-self-heal", "description": "只在写入侧拦坏数据不够——坏值进了 IndexedDB/localStorage 就每次命中，⌘⇧R 碰不到它，用户只能手动清站点数据；读取侧必须同样校验", "type": "feedback", "project": "xuanji", "projectPath": "~/xuanji", "file": "~/.claude/projects/…/memory/client-cache-must-self-heal.md", "body": "给缓存加校验时只拦了写入侧（「不要把空白图存进去」），结果**先前版本已经存进去的坏值永远出不来**：每次读都命中，⌘⇧R 清的是 HTTP 缓存、根本碰不到 IndexedDB，用户只能去开发者工具手动 Clear site data。让用户替实现缺陷善后是错的。\n\n**How to apply**：同一条校验规则在读取侧再执行一次，不合格就删掉并当作未命中，触发重新生成覆盖。常量提取到一处两边共用。实测注入 1156B 坏图后刷新，自动变回 29575B 正常图。\n\n**IndexedDB 另一个坑**：新增 object store 必须**提高版本号**，`onupgradeneeded` 只在版本提高时触发；而多个模块各写各的 `onupgradeneeded` 会让「先打开库的那一方」只建自己那张表，另一张永远不存在。版本号与建表逻辑必须收在单点，版本号写不一致还会抛 VersionError 把先前好好的功能一起带坏。\n\n**调试时别用裸 `indexedDB.open(name, N)` 探查**：库不存在时它会创建一个版本号正确但**一张表都没有**的空库，之后应用再用同版本号打开就不会触发建表——我用它查缓存，反而把环境搞成「store not found」，一度以为建表逻辑坏了。", "links": []}, {"name": "code-comments-about-external-tools-expire", "description": "代码注释里对外部工具能力的断言有保质期,CLI 一升级就悄悄失效而注释不会自己更新;基于这类断言做设计前先花一分钟实测", "type": "project", "project": "xuanji", "projectPath": "~/xuanji", "file": "~/.claude/projects/…/memory/code-comments-about-external-tools-expire.md", "body": "仓库里写着「某外部工具不支持 X,所以我们自己实现了 Y」的注释,**在写下的那一刻是真的,之后就只是一句历史记录**。外部工具(Claude Code CLI、飞书 API、MCP 服务)持续演进,能力补上了不会有人回来改注释,于是这句话变成一颗定时误导。\n\n2026-09-16 实测:璇玑 `Dispatch.tsx` 里两句注释说「SDK 环境下原生 `/clear` 会被当普通 prompt 发给模型(白烧一轮 token)」「`/rename` 是终端专属命令,SDK 环境不可用」。在 CLI 2.1.273 上跑 `claude -p '/clear'` / `'/rename 测试名'`,两条都由 CLI 本地处理,0 轮模型调用、0 成本,`/rename` 还正常回「Session renamed to: 测试名」。`/effort` `/model` 同样。当时的判断很可能没错,是 CLI 后来补上了。\n\n**Why:** 这次开局本打算做一套「把斜杠命令翻译成 SDK 能懂的形式」的适配层,先实测了一把 `claude -p '/caveman lite'`,发现 CLI 早就会展开成技能调用、插件技能裸名也认、未知命令本地拒绝不烧轮次——**整个任务的前提被推翻,真需求从「让它能用」缩成「让用户知道有哪些命令」**,工作量差一个数量级。如果照着注释设计,会造出一个完全没必要的适配层。\n\n**How to apply:** 看到「某外部工具不支持 X」的注释或结论(无论出自代码、我自己之前的会话、还是收口卡),**只当线索不当依据**,动手前用最小命令实测一次现状;成本通常是一分钟,收益是整个方案的方向。实测后顺手把注释按实测改写,并写清楚「现在为什么仍然这么做」——本次四条命令仍然拦截,理由从「CLI 不支持」改成了「CLI 侧副作用不会同步回璇玑状态(改名只活在 CLI 进程内存里而看板读自有库)」。相关:[[sdk-artifact-tool-entrypoint-gate]] [[runtime-only-metadata-needs-snapshot]]", "links": ["sdk-artifact-tool-entrypoint-gate", "runtime-only-metadata-needs-snapshot"]}, {"name": "delivery-artifact-needs-owner-and-lifecycle", "description": "落在项目目录里的「某次交付的产物」（如 .xuanji/runbook.json）必须绑归属会话 + 定生命周期，否则同目录后续会话会一路继承上次交付的残留；这类「不该出现的东西出现了」先查归属，别查判定逻辑。", "type": "feedback", "project": "xuanji", "projectPath": "~/xuanji", "file": "~/.claude/projects/…/memory/delivery-artifact-needs-owner-and-lifecycle.md", "body": "璇玑里凡是**落在项目/worktree 目录、代表「某一次交付」的产物**，设计时必须同时定死两件事：**归属**（属于哪条会话）与**生命周期**（谁在什么时候清除它）。只按「目录下有没有这个文件」决定 UI 行为，等于把一次性产物当成了项目常驻配置。\n\n**Why**：验收面板（2026-08-27 上线）的渲染条件只有「会话 cwd 下存在 `.xuanji/runbook.json`」，清单里没有任何归属信息，归档处置也不清除它。结果第二天用户说「版本发布」、还在被追问版本号时就弹出了验收面板——目录里躺着前一天铺功能时留下的示例清单，之后在该目录派发的**任何**会话都继承了它。两个缺口单独看都像小事，叠一起就是「面板在完全不相干的时机出现」。\n\n**How to apply**：\n- 新增这类文件时，schema 里就带 `sessionId`（或等价归属字段），并在唯一的解析出口做归属判定——渲染与执行都从那里过，一处生效。\n- 会话写文件时往往**拿不到自己的 sessionId**：`XUANJI_DISPATCH=1` 那份 env 是在 `query()` 构造时定死的，而 sessionId 要等 SDK `system/init` 才知道。故归属由**后端认领时盖章**：文件 mtime ≥ `dispatches.created_at`（`onConflictDoNothing`，是会话首次出现的时刻，重启/接回都不刷新）才算本次交付。\n- 判定不确定时**宁可不出，不错出**——错出比不出更破坏信任。\n- 排查「某个 UI 元素在错误时机出现」时，先问「这东西属于谁、谁负责清掉它」，再去看判定逻辑。与 [[unread-badge-multi-entry-paths]]（角标不熄灭查入口不查判定）是同一类归因错位。", "links": ["unread-badge-multi-entry-paths"]}, {"name": "dnd-kit-drag-needs-playwright", "description": "璇玑看板拖拽(dnd-kit)用 agent-browser 鼠标驱动不起来,须 Playwright+系统 Chrome;常驻挂载视图要先切到激活页再取坐标", "type": "feedback", "project": "xuanji", "projectPath": "~/xuanji", "file": "~/.claude/projects/…/memory/dnd-kit-drag-needs-playwright.md", "body": "验证璇玑看板拖拽时,agent-browser 的 mouse down/move/up 连原有的右拖都驱动不了(headless/headed 均无 `.dragging`),一度让我以为代码改坏了。可用的路径:Playwright + `executablePath` 指向系统 Chrome + `--headless=new`,`mouse.move(..., {steps: 20})`。\n\n第二个坑:视图常驻挂载,停在仪表盘时看板的 `.col-head` 照样查得到但坐标全 0;要用 evaluate 点侧栏「会话」按钮切页(按键 3、getByText().click 都没切成),选择器限定 `section.view.active`。\n\n**Why:** 2026-09-23 PR#78,两层测试手段问题叠在一起,被误判为「新代码把拖拽弄坏了」。\n**How to apply:** 验交互改动先用**未改动的原有交互**做基线;基线也失败 = 测试手段问题,别去改代码。相关:[[intersection-observer-pitfalls]]、[[vacuous-assertion-false-positive]]。", "links": ["intersection-observer-pitfalls", "vacuous-assertion-false-positive"]}, {"name": "fixed-cap-buffer-evicted-by-stream", "description": "按条数封顶的缓冲混入流式事件时，条数不等于信息量，高频片段会把低频关键事件挤掉；配套的兜底分界若用静态时间戳则一起失效。", "type": "feedback", "project": "xuanji", "projectPath": "~/xuanji", "file": "~/.claude/projects/…/memory/fixed-cap-buffer-evicted-by-stream.md", "body": "按**条数**封顶的缓冲里一旦混入流式事件（token 级 delta），条数就不再代表信息量：1849 条思考/正文片段塞满 2000 上限，4 条用户消息被挤到只剩 1 条，症状是「接回会话后 ⌘⇧O 轮次目录只有一轮」。\n\n**Why:** 缺陷长在数据源，但症状出现在最下游的显示端，而显示端恰好刚改过（前一天 PR#51 动过轮次索引、`isRealTurn` 注释里明写着 37% 用户事件是元条目）——所有线索都指向「过滤把提问吞了」，实际过滤完全无辜。判定「谁被挤掉了」不能看总条数是否合理，要**按事件类型分别计数**：attach 一次数出 `user-echo` 只有 1 条，结论立刻成立。\n\n**How to apply:**\n- 定长缓冲里同时存流式片段与语义事件时，片段**入缓冲前先合并**（订阅侧仍逐条推，不影响打字机效果）；裁剪要裁到**语义边界**（下一条用户消息）而非按量裁，否则留下半截轮次比整轮消失更难理解。\n- 「缓冲满了就从别处补」的兜底，分界必须是**缓冲实际起点**而非进程启动时间之类的静态值——同一进程内跑满时静态分界会让补偿查询返回空集，兜底静默失效（本次正是如此，只修缓冲不够）。\n- 排查「下游少了东西」先在数据源按类型点数，别先怀疑最近改过的显示逻辑。同类教训见 [[unread-badge-multi-entry-paths]]、[[runtime-only-metadata-needs-snapshot]]。", "links": ["unread-badge-multi-entry-paths", "runtime-only-metadata-needs-snapshot"]}, {"name": "flex-wrap-breaks-before-shrink", "description": "flex-wrap 容器是「先换行再压缩」，子元素的 text-overflow ellipsis 根本来不及生效；文案一变长就把后面的元素顶到下一行，缩短文案只是推迟阈值，真正的修法是让它 flex-basis 归零退出分行决策", "type": "feedback", "project": "xuanji", "projectPath": "~/xuanji", "file": "~/.claude/projects/…/memory/flex-wrap-breaks-before-shrink.md", "body": "`flex-wrap: wrap` 的容器里，浏览器**先按各子项的完整内容宽度决定分行，再在行内做压缩**。所以给某个子项设了 `flex-shrink: 1` + `min-width: 0` + `text-overflow: ellipsis`，它在分行阶段依然按完整宽度参与计算——文案一变长就把后面的元素顶到下一行，ellipsis 永远等不到生效的机会。\n\n**Why**：2026-08-28 璇玑用量模块，头部小字从「条长 = 实际成本」换成更长的口径文案后，第二组切换按钮被挤到下一行，成本↔Token 切换时模块头忽高忽低。当时 `.sub` 已经写了 nowrap + ellipsis + min-width:0，看着「应该会截断而不是换行」，实际不会。\n\n**How to apply**：给该子项 `flex: 1 1 0`（basis 归零，顺带接替 spacer 的角色）。basis 为 0 意味着它的假想主尺寸是 0，永不顶出换行；随后 grow 吃掉剩余空间，真放不下时才 ellipsis 收尾，完整内容留在 title 悬停里。**只缩短文案是治标**——阈值往后推一点，下次再加一个字又会翻。判断信号：「某个文案变长后布局跳行」且容器开了 wrap，先查 flex-basis，别去数字符。\n\n验证要跨多档宽度对比同一容器在两种状态下的高度与关键子元素的 y 坐标是否一致，单一宽度看不出翻转（本次 1440px 下两种单位都换行、1100px 下都不换行，只有 1920px 才复现用户看到的现象）。相关：[[prototype-inline-real-css]]", "links": ["prototype-inline-real-css"]}, {"name": "gh-pr-edit-projects-classic-error", "description": "gh pr edit 在本仓库会因 GitHub 下线的经典 Projects GraphQL 字段报错且不生效,改用 gh api REST PATCH", "type": "reference", "project": "xuanji", "projectPath": "~/xuanji", "file": "~/.claude/projects/…/memory/gh-pr-edit-projects-classic-error.md", "body": "`gh pr edit 94 --title ... --body ...` 在 tqd9563/xuanji 上输出一行 `GraphQL: Projects (classic) is being deprecated ... (repository.pullRequest.projectCards)` 后**静默不生效**(2026-10-21 实测:标题仍是旧的)。命令看起来像只是警告,实际整个编辑被放弃。\n\n**Why:** 本机 gh 版本的 pr edit 仍查询已下线的 projectCards 字段,GraphQL 报错即中止。\n\n**How to apply:**\n- 改 PR 标题/正文一律走 REST:`gh api -X PATCH repos/<owner>/<repo>/pulls/<n> -f title=\"...\" -F body=@file.md`。\n- 合并同理可走 `gh api -X PUT repos/<owner>/<repo>/pulls/<n>/merge -f merge_method=squash`(返回体里 `merged` 是布尔,`-q` 里别对整个对象做字符串拼接)。\n- 任何 gh 写操作后用 `gh api .../pulls/<n> -q .title` 回读确认,别信命令没报 exit code。相关:[[xuanji-pr-squash-merge]]", "links": ["xuanji-pr-squash-merge"]}, {"name": "global-shortcut-interception-layers", "description": "网页快捷键「按了没反应」要逐层排查拦截者；Chrome 会截走 ⌘`/⌃`，Pake 壳(WebKit)不会，快捷键要在目标壳里验", "type": "project", "project": "xuanji", "projectPath": "~/xuanji", "file": "~/.claude/projects/…/memory/global-shortcut-interception-layers.md", "body": "2026-09-24 做内嵌终端(⌘` 呼出)时，用户按 ⌘` 无反应，连排三层才定位：\n1. Ghostty 配置 `keybind = global:cmd+grave_accent=...`(全局热键,用户已删)\n2. macOS 系统快捷键「移动焦点到下一个窗口」默认就是 ⌘`(`defaults read com.apple.symbolichotkeys` 的 27 号,参数 96/50/1048576;用户已关)\n3. **Chrome 自己截走 ⌘` 和 ⌃`**——两层都清掉后 Chrome 页面仍只收到 MetaLeft/ControlLeft，Safari 正常。Pake 壳是 WebKit，与 Safari 同路径。\n\n**Why:** Playwright 合成的 ⌘` 直接进渲染进程、绕过浏览器与系统，测出来「能用」是假阳性；我据此交付后被用户当场打回。\n\n**How to apply:**\n- 选全局快捷键时先查三层：系统 symbolichotkeys、常驻 App 配置(Ghostty/Raycast)、宿主浏览器保留键；在**用户真实使用的壳**(Pake=WebKit)里验，别拿 Chrome 或合成事件下结论。\n- 定位靠页面内「按键探针」(window 捕获阶段记录 keydown + blur):只到修饰键 = 被上游吞；有 blur = 被别的窗口抢焦点。\n- `CGGetEventTapList`(python ctypes,无需权限)可列出所有键盘事件钩子进程；Carbon 热键不在其中。\n- agent shell 发不出真实按键(osascript 辅助访问被拒),这类验证只能请用户亲手按。\n- 相关:[[shortcut-toggle-not-context-branch]] [[vacuous-assertion-false-positive]]", "links": ["shortcut-toggle-not-context-branch", "vacuous-assertion-false-positive"]}, {"name": "guard-clause-cost-assumption-unmeasured", "description": "「为了不付出代价 X 而拦住功能 Y」的前置拦截,代价 X 往往从没被量过;用户抱怨「为什么不能做 Y」时先去读那行拦截的注释,量一次 X 再决定", "type": "project", "project": "xuanji", "projectPath": "~/xuanji", "file": "~/.claude/projects/…/memory/guard-clause-cost-assumption-unmeasured.md", "body": "自己写下的前置拦截,注释里常带一句成本理由——「不为一句旁路提问冷启动整个会话」。**这句理由是写的时候的直觉,不是测出来的数**,而它决定了一个功能在某状态下彻底不可用。\n\n2026-11-02:璇玑会话空闲自动退出(默认 30 分钟)后,`/btw` 旁路提问被 `dispatch.ts` 的 hibernated 前置拦截挡下,提示「先发一条消息接上再问」。用户一眼看出矛盾——**用旁路提问就是为了不给主对话加上下文,「先发一条消息」正好破坏了这个目的**。实测那个被规避的代价:`--resume` 冷启动一次 8.5s,转录只多 mode/cost-state 两行元数据、user/assistant 消息数 3→3。8 秒换一个功能从「完全不能用」到「能用」,这笔账拦截写下时显然没算过。\n\n**Why:** 症状报上来是「功能坏了」(用户还举证说今天早些时候明明能用),很容易一头扎进去查进程、查 SDK、查时序。真因是一行 return,查到它只花了两分钟——但如果没先 grep 那句报错文案、而是先去复现,方向就偏了。更关键的是:**找到拦截 ≠ 结论是「设计如此」**,拦截本身可能就是错的,得去量它规避的那个代价。\n\n**How to apply:** 用户说「为什么不能做 X」时,第一步 grep 报错文案定位到那行 guard,读它的注释理由;理由若是成本/性能假设(「太慢」「太贵」「不值得」),**用最小脚本量一次真实数字再判断**——本次量法是独立 20 行脚本:临时 cwd 起会话种暗号 → resume → 不发消息直接问,验证「假设不成立」。另:判「有没有污染上下文」按转录里 `type in (user,assistant)` 点数,元数据行会增加但不占上下文,别看文件行数。相关:[[code-comments-about-external-tools-expire]] [[vacuous-assertion-false-positive]]", "links": ["code-comments-about-external-tools-expire", "vacuous-assertion-false-positive"]}, {"name": "input-feature-needs-output-end", "description": "给输入端加了新表达能力，必须同时检查产物在下游渲染端有没有对应支持——否则「输入时认得、发出后不认」", "type": "feedback", "project": "xuanji", "projectPath": "~/xuanji", "file": "~/.claude/projects/…/memory/input-feature-needs-output-end.md", "body": "在输入侧新增一种表达能力（代码块高亮、富文本、@提及、图片……）时，动手前先问一句：**这段内容发出去之后，由谁渲染？那一端认得它吗？**\n\n2026-09-02 派发输入框加代码语法高亮（PR#44）踩到：输入框边打边给 `` `x` `` 与 ``` 上高亮，用户发出去在气泡里却退回成一串生反引号——用户消息从来只走纯文本 + `white-space: pre-wrap`，从未渲染过 markdown。这不是回归，是新功能把「一直如此」变成了缺陷：**高亮本身就是一句承诺，承诺这段是代码；下游不兑现，功能就只做了一半。**用户第一眼就发现了，我在交付说明里还写着「验证充分」。\n\n**Why:** 输入端的改动天然只在输入端验证（我把输入框的五条交互全跑了真实浏览器），而缺陷发生在链路对端。这类缺口在单测和输入侧的端到端里都是盲区，只有把「输入 → 存储 → 渲染」整条链走一遍才会现形。\n\n**How to apply:**\n- 输入侧功能的验收清单里强制加一条：**真发一次，看渲染端**。哪怕要为此付出一次真实调用（本次在 preview 环境派发了一条只回 ok 的会话来拿气泡证据，值得）。\n- 修的时候优先让两端**共用同一份解析**（本次输入框高亮与消息渲染共用 `lib/composer-code.ts` 的 `parse()`），而不是各写一套——口径分裂只是时间问题。\n- 下游补渲染时按需最小化：用户 prompt 里的 `#`/`*`/路径是字面内容，只解析代码语法，别顺手上完整 markdown（会毁原文，还会回归 [[unread-badge-multi-entry-paths]] 那类「改一处坏另一处」的既有行为，如 PR#42 的多行不折叠）。", "links": ["unread-badge-multi-entry-paths"]}, {"name": "input-overlay-breaks-during-ime", "description": "「输入框文字透明 + 底下叠镜像层」这类方案在 IME 预编辑期整体失效——预编辑底色由内核直接画在输入框上，会盖住/错开镜像，表现为「光标离行末字符一段空白」；取证只能用 CDP Input.imeSetComposition。", "type": "feedback", "project": "xuanji", "projectPath": "~/xuanji", "file": "~/.claude/projects/…/memory/input-overlay-breaks-during-ime.md", "body": "给输入框做高亮/装饰时常见的做法是「textarea 文字设 transparent、底下叠一层同排版的镜像层重绘」。这套方案有一个**与排版对齐无关**的失效区间：**IME 预编辑期（拼音/候选未上屏）**。预编辑文本的底色与下划线由内核直接画在 textarea 上，而 textarea 的文字是透明的——镜像要么被那块绘制整块盖住（Chrome 实测：一块不含任何文字的纯色块），要么与它对不齐，用户看到的就是「光标不紧贴行末字符、中间隔着一段没有字符的空白，退格却直接删掉末字」。\n\n**Why**：数据层完全无辜——实测 `ta.value` 与 `mirror.textContent` 在组合期逐字一致（React 的 onInput 在 composition 期照常触发），所以顺着「镜像少字」「排版属性不一致」「caret 偏移」查全是死路。病根在绘制层归属：预编辑区那几个字的渲染权在内核手里，不在你的镜像里。\n\n**How to apply**：\n- 症状带「输入法候选窗开着」这个上下文，先怀疑 composition 期的绘制归属，别先去比对 padding / word-break / scrollTop（那是 [[textarea-overlay-baseline-gap]] 那类问题）。\n- 修法是组合期间把舞台交回原生：`compositionstart`/`compositionend` 切一个 `.composing`，期间镜像 `visibility: hidden`（别用 `display:none`，会闪高度）+ 文字染回正常色，上屏后重绘恢复。短暂丢高亮优于「字看不见」。\n- **取证手段**：IME 组合态用普通自动化（fill / keyboard type）模拟不出来，必须走 CDP `Input.imeSetComposition`（独立 Chrome + `get cdp-url` + ws 直发协议），截图才是真证据——同 [[browser-automation-blind-to-native-dialogs]] 的路数。", "links": ["textarea-overlay-baseline-gap", "browser-automation-blind-to-native-dialogs"]}, {"name": "intersection-observer-pitfalls", "description": "IntersectionObserver 在内嵌滚动容器里必须设 root（rootMargin 不解决祖先裁剪）；headless 浏览器不产生渲染帧，IO/rAF 完全不投递，验不了也测不出", "type": "feedback", "project": "xuanji", "projectPath": "~/xuanji", "file": "~/.claude/projects/…/memory/intersection-observer-pitfalls.md", "body": "用 IntersectionObserver 做懒加载/无限滚动（哨兵）时，连踩两个坑：\n\n1. **内嵌滚动容器里必须 `root: 容器元素`**。默认 root 是视口，祖先容器的裁剪照样生效，而\n   `rootMargin` 只放大 root 矩形，救不了被容器裁掉的哨兵——症状是「滚到底也不追加下一片」，\n   而元素的 `getBoundingClientRect()` 看上去明明在视口内。零高度哨兵还会在容器下边缘「相切\n   不相交」，给它 1px 高度更稳。\n2. **agent-browser 默认 headless，页面不产生渲染帧**（实测 rAF 2 秒 0 帧，`requestIdleCallback`\n   靠 timeout 兜底还能跑），于是 IO 回调**一次都不投递**。在这种环境里既验证不了 IO 逻辑，\n   也会把「功能没生效」错判成代码 bug——我为此改了一轮根本不存在的问题。\n\n**How to apply:** 写 IO 前先问「root 是不是某个滚动容器」；跨组件传容器用 context 而不是层层\n传 ref。验证任何依赖渲染帧的东西（IO / rAF / 动画 / 懒加载）一律 `agent-browser --headed`，\n上手先跑一句 rAF 计帧确认环境能出帧，再开始测。没有 jsdom 的项目里这类逻辑测不了运行时，\n就用扫源码的守卫测试钉住关键选项（并实际验证它能变红，见 [[vacuous-assertion-false-positive]]）。\n\n相关：[[perf-ab-needs-narrow-window]]（性能测量口径）、[[shared-browser-instance-tab-race]]。", "links": ["vacuous-assertion-false-positive", "perf-ab-needs-narrow-window", "shared-browser-instance-tab-race"]}, {"name": "lark-bot-dev-pitfalls", "description": "璇玑飞书中控(lark-cli 长连接)开发与验收的坑:卡片回调互斥但消息事件可被多个后端同时收到(验收环境会和生产各回一遍)、事件到没到看 bus.log、读消息权限缺失的连锁症状、内置色深色模式发闷", "type": "project", "project": "xuanji", "projectPath": "~/xuanji", "file": "~/.claude/projects/…/memory/lark-bot-dev-pitfalls.md", "body": "璇玑的飞书中控经 `lark-cli --profile xuanji` 常驻 `event consume` 收事件(2026-11-11 上线,PR#99/#100/#102)。\n\n- **同一个飞书应用:卡片回调互斥,消息事件却能多个接收方同时订阅、各收一份**(lark-cli 总线日志里 `first=false` 即后来者照样接入)。所以 `./preview.sh` 的验收后端(快照里带着生产的启用状态与绑定人)一连上,用户每句话都被生产和验收环境各处理一遍:2026-11-15 一个挂了 4 天的验收环境对同一条消息回了「发给哪个会话?」,生产同时已开跑——两边路由都没错,错在有两个后端。PR#104 起验收环境默认 `XUANJI_LARK=off`,要验飞书用 `XUANJI_PREVIEW_LARK=1 ./preview.sh` 且验完立刻 `--stop`。卡片回调那一路冲突报 `another consumer (pid N) is already running`,跨机报 `another event bus is already connected`;「同一事件出现两种反应」先 `lark-cli --profile xuanji event status` 数消费者、顺 ppid 链看各属哪个后端。\n- **事件到没到,看 `~/.lark-cli/events/<app_id>/bus.log` 的 `Event received: type=...` 行**,别靠「界面上看起来有按钮」推断。2026-11-12 菜单电脑/手机都显示了,bus.log 里 `application.bot.menu_v6` 却一条没有——是开放平台订阅/动作配置问题,不是代码问题。我曾据「菜单显示了」说「点了能出卡片」,被打回。\n- **应用缺 `im:message:readonly` 的连锁症状**:下载消息里的图片/文件报 99991672、`+chat-messages-list` 读不了、卡片回调的 `card_content` 恒为空。收消息只需 `im:message.p2p_msg:readonly`,所以「能收能发」不代表能读资源。\n- **lark-cli 的坑**:`+messages-resources-download --output` 只允许 cwd / /tmp / ~/files 内的路径(用子进程 cwd + 相对名);消息 content 是预渲染文本,图片 `[Image: img_xxx]`、文件 `<file key=\"..\" name=\"..\"/>`。\n- **飞书卡片内置色(`-50/-200` 档)在深色模式下会变成大块饱和色**;需要「淡淡一层」的底色/边框用 `config.style.color` 自定义 RGBA 低透明度(底 0.06/0.10、边 0.22/0.30,同 anomaly-board)。\n\n**Why:** 这几条都是实测才暴露、且下次改飞书中控必然再碰的环境事实。\n**How to apply:** 动飞书中控前先确认生产是否连着同一机器人;任何「事件没反应」先看 bus.log 再改代码;新增读消息类能力先确认应用权限。相关:[[verify-in-users-daily-config]]、[[vacuous-assertion-false-positive]]。", "links": ["verify-in-users-daily-config", "vacuous-assertion-false-positive"]}, {"name": "macos-memory-metrics-pitfalls", "description": "macOS 上量内存/swap/CPU 的四个口径陷阱:RSS 低估、swap 百分比无意义、memory_pressure 空闲%≠压力等级、top CPU 首样本无效", "type": "feedback", "project": "xuanji", "projectPath": "~/xuanji", "file": "~/.claude/projects/…/memory/macos-memory-metrics-pitfalls.md", "body": "macOS 上判断「内存紧不紧、谁占的」时,常用数字有四个坑(2026-09-23 做璇玑系统监控 PR#83 时逐一踩到):\n1. `ps` 的 RSS 只算驻留页,被压缩/换出的不算,严重低估(Pylance RSS 0.6G vs `top` MEM 3.3G);按进程排占用用 `top -stats mem,cmprs`,CMPRS=压缩+换出,是 swap 归因的正确口径。\n2. `vm.swapusage` 的 total 按需扩缩(同一天 17.4G→16.0G),used 总逼近 total,「swap 94%」永远偏高、毫无信息量;只看已用绝对值。\n3. `memory_pressure` 的「空闲 %」把可回收缓存算作可用,会与内核压力等级矛盾(报 51% 空闲时 `kern.memorystatus_vm_pressure_level`=2 警告);判级只信内核等级(1/2/4,活动监视器同源)。\n4. `top` 的 %CPU 首个样本无效,要 `top -l 2 -s 1` 取第二次;%CPU 以单核 100% 计。\n\n另:agent shell 的 PATH 里没有 sysctl,要写 `/usr/sbin/sysctl`。\n\n**Why:** 第一轮我拿 RSS 排了「占用最多的进程」、原型里把「空闲 51%」和「压力正常」写在一起,都被用户追问到矛盾点才改;用户还因为「swap 94% 却亮绿灯」直接质疑判色。\n**How to apply:** 任何读 macOS 内存/CPU 指标的功能或排障,先按上面四条选口径再出数;展示给用户的「占用率」用 (active+wired+压缩器占用页)/hw.memsize。相关:[[reused-filter-changes-meaning]]", "links": ["reused-filter-changes-meaning"]}, {"name": "metric-passes-problem-remains", "description": "像素/数字指标通过不等于视觉问题解决——测量只能佐证某个机制，视觉改动的终审必须人眼看整图；指标选错时数字越漂亮越误导。", "type": "feedback", "project": "xuanji", "projectPath": "~/xuanji", "file": "~/.claude/projects/…/memory/metric-passes-problem-remains.md", "body": "修状态栏黑带时，第一版把硬边改成渐变 + mask，灰度采样从「42→73 一级阶跃」变成最大单步 7 级，\n数字非常漂亮，我据此交付，用户一眼打回：带还在。\n\n**Why**：我测的是「边缘是否陡峭」，而用户看到的问题是「有一块整幅宽的深色区域」。\n指标对后者完全不敏感，所以它越绿越误导——它证明的是我修的那个机制生效了，\n不是用户的问题消失了。同类陷阱见 [[vacuous-assertion-false-positive]]（断言恒真）与\n[[verify-in-users-daily-config]]（环境差集），三者的共同形状是「验证覆盖的不是用户实际感知的那件事」。\n\n**How to apply**：\n- 视觉类改动的终审是**人眼看整幅截图**，像素测量只能用来佐证「我改的那个机制确实起作用了」，不能当作「好看了」的证明。\n- 交付前先问一句：**用户抱怨的原话是什么？我的指标能不能直接反驳这句话？**「黑带太明显」对应的指标应是「状态栏区域与壁纸的整体色差」，不是边缘梯度。\n- 第一版被打回时，先怀疑**问题定义**而不是参数——把渐变调得更缓只是在同一条错路上加码；\n  这次的解法是退回去想「这块底色到底有没有必要存在」（静止态文字裸坐壁纸上就能看清 → 底色多余），\n  一旦重定义问题，折中区间直接消失。", "links": ["vacuous-assertion-false-positive", "verify-in-users-daily-config"]}, {"name": "new-tests-silently-not-run", "description": "璇玑后端 vitest 只 include tests/**，测试写在 src/ 下会静默不跑；新增测试后必须看总数增量而非「全绿」来确认它真的执行了。", "type": "feedback", "project": "xuanji", "projectPath": "~/xuanji", "file": "~/.claude/projects/…/memory/new-tests-silently-not-run.md", "body": "新增测试后，**用「测试总数的增量」确认它真的跑了，不要看到「全绿」就算过**。\n\n2026-08-27 在 `/wd` 手输路径任务里踩到：新写的 10 条测试放在 `code/backend/src/services/paths.test.ts`（与被测模块同级，很多项目的惯例），但璇玑后端 `vitest.config.ts` 的 `include` 只有 `tests/**/*.test.ts` —— 文件被完全忽略，`pnpm test` 照样绿灯输出 `161 passed`。发现它的唯一线索是这个数字与改动前**一模一样**。\n\n**Why:** 「全绿」在测试根本没被收集时和「全部通过」输出完全相同，是个静默失败。而 lint 和 `tsc --noEmit` 都会正常检查该文件，不会报任何异常，三道门一起放行。\n\n**How to apply:**\n- 璇玑后端测试一律放 `code/backend/tests/`，import 用 `../src/services/xxx.js`；前端相反，`src/**/*.test.ts` 与被测模块同级（`resume-score.test.ts`、`fuzzy.test.ts` 都在 src 下）。**动手前先看该包 vitest 配置的 include，别照搬另一个包的惯例。**\n- 交付说明里写测试数字时带上增量口径（如「171 passed，新增 10 条」），这个习惯本身就是校验——写不出增量就说明没确认过。\n- 同理适用于任何「产物由配置驱动收集」的门（见 [[R7 质量门是唯一出口]]）：门跑通不等于你的东西进了门。", "links": ["R7 质量门是唯一出口"]}, {"name": "offscreen-webgl-render-pitfalls", "description": "离屏 WebGL 渲染(截图/缩略图)的三连坑：canvas 不挂 DOM 会永不 resolve、drawing buffer 默认被清空读出空白、按固定比例裁剪换个素材就裁空", "type": "feedback", "project": "xuanji", "projectPath": "~/xuanji", "file": "~/.claude/projects/…/memory/offscreen-webgl-render-pitfalls.md", "body": "浏览器里离屏渲染一张图（Live2D 缩略图、canvas 截图、WebGL 导出）连踩三个坑，症状各不相同但都指向「图出不来」：\n\n1. **canvas 必须真的挂进 DOM**。只 `createElement` 不 append，拿不到渲染帧，纹理/资源加载永远等不到完成——`await` 的 promise **既不 resolve 也不 reject**（实测卡 55s+ 无任何回调）。串行循环会卡死在第一个，后面一个都不执行，日志上只看到 `start` 没有 `ok`/`FAILED`。挪到视口外（`position:fixed;left:-99999px`），**不能用 `display:none`**，那同样会停止渲染。\n\n2. **`preserveDrawingBuffer: true` 必须开**。WebGL 的 drawing buffer 默认在合成后即清空，`toBlob`/`toDataURL` 读到的是全透明。同一条路径实测：修复前 1156B，修复后 30369B。能在同步紧跟 `render()` 后读出来是侥幸，中间隔了任何 `await` 就中招。\n\n3. **不要按固定比例裁剪**。「头在全身高的 2%~34%」这类参数对一类素材成立，换个构图（兽型/Q 版）直接裁到一片空白。改成渲全图后扫描非透明像素求包围盒，再从包围盒取区域——不用为每个素材配参数。\n\n**配套的防御**：给导出的图加最小字节数校验（全透明 PNG 压出来只有 1KB 出头）。但只防写入不够，见 [[client-cache-must-self-heal]]。\n\n排查时注意：这类「卡住」在 console 里什么都不打，因为 catch 根本没被触发。判据是**有 start 无结束**，不是有没有报错。", "links": ["client-cache-must-self-heal"]}, {"name": "oklch-contrast-measurement", "description": "本项目色值全是 oklch()，getComputedStyle 原样返回该字符串，用 rgb 正则解析会算出一片假的对比度数字；要用 canvas fillStyle 取真实 sRGB 像素再算 WCAG", "type": "reference", "project": "xuanji", "projectPath": "~/xuanji", "file": "~/.claude/projects/…/memory/oklch-contrast-measurement.md", "body": "在璇玑（及任何 OKLCH-only 的项目）里用 Playwright 实测 WCAG 对比度时，`getComputedStyle(el).color` 返回的是 **`oklch(0.93 0.008 110)` 这样的原样字符串**，不是 Chrome 惯常回吐的 `rgb(...)`。拿 `match(/[\\d.]+/g)` 抓三个数当 RGB 通道除以 255 去算亮度，会得到一批看似正常、其实全错的比值。\n\n**Why：** 2026-08-28 验全局状态栏时，这么算出来时钟、日期、daemon 三项对比度**全是 1.04**——三个明度差很大的颜色不可能同为 1.04，这个「过于整齐的可疑值」是唯一的破绽；若当时数字碰巧落在 4~8 之间，就会带着假证据写进 PR 说「对比度达标」，正好违反 R7 的反臆断。改用真实取样后实测为 16.11 / 7.7 / 7.7。\n\n**How to apply：** 在页面里建一个 1×1 canvas，把 CSS 颜色字符串赋给 `ctx.fillStyle` 让浏览器自己解析，`fillRect` 后用 `getImageData` 读回真实 sRGB 三通道，再套 WCAG 相对亮度公式。浏览器解析什么颜色语法都吃（oklch / color-mix / var() 求值后的结果），所以这套写法对后续任何色彩空间都成立，可以直接当模板复用：\n\n```js\nconst cv = document.createElement('canvas'); cv.width = cv.height = 1;\nconst ctx = cv.getContext('2d', { willReadFrequently: true });\nconst toRgb = (css) => { ctx.clearRect(0,0,1,1); ctx.fillStyle = css; ctx.fillRect(0,0,1,1);\n  return [...ctx.getImageData(0,0,1,1).data].slice(0,3); };\n```\n\n顺带两个同场景要点：底色要取元素**视觉上叠在其上**的那一层（状态栏是 82% 透明 + blur，视觉底色仍是 `--bg`，不能取状态栏自身的半透明背景色）；大字号（≥18px 或 ≥14px 粗体）阈值是 3:1 而非 4.5:1，报数字时要一并标明适用哪档，否则就是 R7 说的「数字不带口径」。\n\n相关：[[prototype-inline-real-css]]", "links": ["prototype-inline-real-css"]}, {"name": "one-card-many-cli-processes", "description": "璇玑一张会话卡片底下可能跑着多个 claude CLI 子进程(重复提交的消息会各起一个),它们并发写同一 worktree 互相覆盖；别让用户去「中断另一个会话」——界面上根本没有第二张卡", "type": "project", "project": "xuanji", "projectPath": "~/xuanji", "file": "~/.claude/projects/…/memory/one-card-many-cli-processes.md", "body": "同一条 dispatch 被重复触发(用户那条消息进来两次)时,后端会起**两个 `claude --resume=<同一 sessionId>` 子进程**,两个「我」在同一个 worktree 上并发改同一批文件。\n\n**Key Takeaway**:发现并发的第一反应不该是「让用户中断其中一个会话」——`dispatches` 表里那个 sessionId 只有一条记录,璇玑界面上就一张卡片,用户无从中断,这个建议会让用户困惑并浪费一轮。\n\n**症状**(任何一条出现就该怀疑):\n- 同一个函数在文件里出现两份,注释措辞不同(两边各写了一版)\n- 前后两次 `git status` 输出的文件集不一致,多出你没碰过的文件\n- 文件 mtime 落在你确知自己没有写入的时刻\n\n**取证三步**(全是只读,安全):\n1. `sqlite3 code/backend/data/xuanji.db \"select session_id,last_state from dispatches …\"` — 确认界面上到底有几张卡\n2. `ps -eo pid,ppid,lstart,args | grep resume=<sessionId>` — 几个 CLI、是否同一个后端父进程\n3. 顺着 `$$` 的 ppid 链往上走,确认**自己是哪一个 pid**(`ps -o pid=,ppid=,comm= -p <pid>` 循环)\n\n**善后**:并发通常会自行停止(一个进程挂着不再写文件,比对文件 mtime 与当前时间即可判断)。真正的代价是**有价值的修改会被另一版静默覆盖**——本次「墙钟口径」的修复就只活在 PR 正文里,代码被覆盖回了错误版本,靠逐段读 diff 才找回来。所以接手这种局面时,**PR 正文 / commit message 与代码不一致要当成信号去查**,别默认代码是对的。\n\n禁止 kill 这些进程:其中一个就是你自己(见 [[xuanji-dispatch-no-self-kill]] 的同类风险)。", "links": ["xuanji-dispatch-no-self-kill"]}, {"name": "perf-ab-needs-narrow-window", "description": "性能 A/B 用端到端墙钟在忙机器上会把结论测反；改用紧跟触发事件的窄窗口口径，另：fetch 回调延迟不等于网络耗时", "type": "feedback", "project": "xuanji", "projectPath": "~/xuanji", "file": "~/.claude/projects/…/memory/perf-ab-needs-narrow-window.md", "body": "前端性能改动做 BEFORE/AFTER 对比时，**端到端墙钟与「N 秒窗口内长任务总和」在负载高的机器上不可用**：\nload≈5 时两边都会偶发 2~4.5s 的系统级长任务，实测一度出现 AFTER 9381ms vs BEFORE 4523ms\n的反向结论，而同一改动在安静窗口是 0ms vs 17854ms。噪声只会加不会减，单次样本足以把结论测反。\n\n**How to apply:** 性能 A/B 一律选「紧跟触发事件的窄窗口」口径——hook 住触发源（如轮询的\nfetch 响应时刻），只统计其后 ~800ms 内的 longtask，把与被测路径无关的系统噪声挡在窗口外；\n每边采 ≥2 轮看可复现性，并先 `uptime` 看负载再决定数字能不能用。另外两条同族陷阱：\n① **fetch 的 promise 回调耗时 ≠ 网络耗时**——回调排在主线程上，被渲染堵住会把 9ms 的请求\n显示成 753ms；判网络快慢看 `performance.getEntriesByType('resource')`，这个差额本身就是\n「主线程被堵了多久」的度量，是很好的定位信号。② A/B 两边都必须是**生产构建**且禁掉缓存\n（index.html 不设 no-store 会让浏览器拿旧 JS，测的其实是同一份代码）。\n\n**Why:** 见 [[metric-passes-problem-remains]]（指标通过不等于问题解决）与\n[[vacuous-assertion-false-positive]]（观测手段本身会造假）——这条补的是第三种失真：\n环境噪声压过信号。\n\n**补充（2026-09-21）**：A/B 别每次重新加载页面再操作——首次加载的渲染成本会混进「点击后长任务」，\n实测出现过「抽屉压根没打开却记到 10.7s 长任务」。改成**同一页面内反复执行被测操作取稳态**。\n另一条思维教训：**把成本摊进空闲回调 ≠ 消除成本**，profile 会诚实地告诉你总量没变\n（见 [[intersection-observer-pitfalls]] 那次任务）。", "links": ["metric-passes-problem-remains", "vacuous-assertion-false-positive", "intersection-observer-pitfalls"]}, {"name": "prototype-inline-real-css", "description": "给已上线产品做新功能原型时，不要按 DESIGN.md token 手搓外壳——内联真实样式表、照抄真实 class 名与 DOM 结构，否则一眼被否", "type": "feedback", "project": "xuanji", "projectPath": "~/xuanji", "file": "~/.claude/projects/…/memory/prototype-inline-real-css.md", "body": "给**已有真实页面**的产品做新功能原型（全局 R2 的 prototype.html）时，不要按 DESIGN.md 的 token 手搓一套外壳。做法应是：把项目真实的样式表整份内联进单文件原型，DOM 结构与 class 名照抄真实组件的 JSX，品牌 SVG 等资源从源码里抠出来，只为「新功能」那部分写新样式。\n\n**Why：** 2026-08-12 做璇玑 ⌘F 查找原型时，第一版按 DESIGN.md token 手搓，色值全对，但用户第一句话是「和我们现在的实际页面好像不太一样」——token 对不等于页面对：抽屉是右侧滑出还是居中面板、有没有侧栏、工具卡是 `.toolcard/.tc-head` 还是 `<details>`、消息行有没有时间戳，这些结构差异比色值更早被眼睛捕捉到。token 只约束「像不像这个设计系统」，约束不了「是不是这个产品」。第二版内联了 1410 行真实 `index.css` + 抠出品牌 SVG，一次通过。\n\n**内联 CSS 是必要条件，不是充分条件（2026-08-26 复发一次）：** 做代码块复制按钮原型时，第一版已经整份内联了真实 `index.css`，但只搭了个 `.demo-wrap` 演示壳装几个代码块，没有派发页的会话流 / 状态条 / 输入框，用户仍是一眼「和实际线上 UI 差这么多」并打回。样式对了页面还是不对——**必须连真实页面的 DOM 外壳一起照抄**，孤立的组件演示页不算原型。\n\n**How to apply：** 最省事也最不会错的做法是**以最近一次获批的原型文件为底**（本项目在 `wiki/design/prototype-*.html`，挑承载同一页面的那个），复制出来只替换内容部分并叠加新功能，别从零拼。没有可复用的获批原型时才回到手工三步：定位真实页面的样式表文件、承载该功能的组件 JSX、外壳（App 布局 + 导航），用脚本把 CSS 拼进 HTML，别手抄。新功能自身的样式单独一段、注释标明是新增的，方便之后直接搬进项目。仅当项目从零起步、没有任何既有页面时，才按 token 手搓。\n\n**Mock 数据同样必须抄真值，不能填「常见默认值」（2026-08-27 一轮审阅连中两枪）：** 验收面板原型的 mock 里凭训练数据惯性写了 vite 5173/uvicorn 8000，而 baize_web 真实脚本用的是定制端口 48163/48164；改完端口后又栽在入口 URL 上——`local_test.sh` 打开的是 `…/api/auth/dev-login?email=…`（先种 Cookie 再跳转），不是根路径 `/`，用户点根路径直接 404。外壳照抄解决「像不像这个产品」，mock 抄真值解决「经不经得起用户按记忆核对」：端口、URL、命令参数、示例数据，凡真实系统里有对应物的都去源头（脚本/Makefile/配置）grep 出来，别拼一个看起来合理的。这条同样适用于未来「agent 起草模板/配置」类功能的实现——起草必须读真实脚本。\n\n**把既有元素搬到新位置时，一个像素都别顺手改（2026-08-28 第三次在原型阶段被打回）：** 做全局状态栏原型时要把仪表盘时钟迁进状态栏，我顺手按新容器的 38px 条高把日期压到 0.6875rem、时间压到 0.8125rem——自认为是合理的「适配」，用户回的是「现在你的原型里的时钟样式我不喜欢，他能迁移进 statusbar 里吗」。**用户对既有元素的记忆是像素级的，「迁移」在他脑子里的默认含义就是原样搬运，任何尺寸/配色调整都是未经同意的改动。**正确做法：一字不改地复制原样式，反过来让新容器去适配它（本次把条高从 38px 提到 42px 给它让位）；真觉得该调，先原样出一版、把调整作为可选项单独提，别默认塞进去。\n\n**内联真实 CSS 的代价:新增类名必须先 grep 查重(2026-09-02 实测踩到):** PR 卡片原型里给 `<body>` 加了个 `class=\"brand\"` 做配色切换,整页布局当场散架——说明文字跑到左半边、聊天区挤到右半边。原因是 `.brand` 在璇玑真实 CSS 里早已是侧栏品牌区(`display: flex`),等于让整个页面套用了侧栏那行的样式。**症状与病因看起来毫不相干**:加的是一行管颜色的 class,坏的是全局布局,很容易往刚写的 CSS 之外去怀疑。把整份线上样式表内联进原型 = 把线上全部类名一起继承过来,任何新类名都在和几百条既有规则抢命名空间。动手前 `grep -n \"\\.<新类名>\" styles/index.css` 查一遍,或者干脆用 `data-*` 属性选择器(`body[data-tone=\"brand\"]`)绕开 class 命名空间。**实现阶段同样适用**:往 `index.css` 加 `.prcard` / `.pr-*` 前先 grep 确认无占用才写。\n\n另:R2 要求的 impeccable 关卡容易在「只是加个小按钮」时被顺手跳过，本次与原型问题被用户一并点名。原型阶段先跑 skill 的 setup（context.mjs + register reference）成本很低，别省。`/impeccable audit` 对小组件同样有产出——状态栏这种只有三个 widget 的小东西，audit 照样抓出 daemon 指示器「好坏只差圆点颜色、标签恒为 daemon」违反项目自己的「状态永不 color-alone」原则。\n\n相关：[[webkit-hidden-element-focus-retention]]、[[oklch-contrast-measurement]]\n\n**照抄派发输入框的 DOM 时镜像层要同步内容(2026-10-14 提示词库原型被打回):** 线上 composer 是「textarea 文字透明(`color: transparent`)+ `.ta-mirror` 用相同排版重绘同一段文本」的叠层结构,只抄 DOM 不喂镜像,输入框里敲什么都看不见——用户第一眼就是「字呢」。凡原型复制了 `.ta-wrap` 结构,就得在 input 事件里照 `syncCode` 的做法把文本(含占位文案 `.ph`、命令词 `.tk-cmd`)写进镜像、滚动同步、IME 组合期加 `.composing` 让位。", "links": ["webkit-hidden-element-focus-retention", "oklch-contrast-measurement"]}, {"name": "react-controlled-input-programmatic-events", "description": "用 dispatchEvent 合成 blur/input 去测 React 组件会得到假阴性——React 委托的是 focusout,合成 blur 根本不进它的处理器;验输入类交互必须用真实焦点操作", "type": "feedback", "project": "xuanji", "projectPath": "~/xuanji", "file": "~/.claude/projects/…/memory/react-controlled-input-programmatic-events.md", "body": "在浏览器里验 React 表单行为时,**不要用 `el.dispatchEvent(new Event('blur'))` / `new Event('input')` 合成事件**——\nReact 17+ 把事件委托挂在 root 上,`onBlur` 实际监听的是 **`focusout`**(会冒泡),\n`onChange` 走的是原生 `input` 加上对受控 value 的追踪。合成的 `blur` 不冒泡也不是 `focusout`,\n处理器压根不会跑;直接赋 `el.value` 也不会被 React 的 value tracker 认作变更。\n\n**症状是假阴性,不是报错。** 2026-09-10 验「快速提问目录」设置行的无效路径兜底:\n合成 blur 后看到输入框还留着 `/no/such/dir-xyz`、toast 没弹、库没改,\n差一点写成「兜底没生效」去改代码——实际是我的测试没触发到任何代码。\n换成真实操作(`agent-browser fill @ref` + `press Tab`)立刻拿到正确结果:\n提示「目录不存在,未保存」、输入框回填原值、库未改。\n\n**Why:** 这类假阴性比假阳性更危险——它会让你去\"修\"一个根本不存在的 bug,\n把好代码改坏;而且它长得和真缺陷一模一样(界面没反应),没有任何报错提示你测法错了。\n\n**How to apply:**\n① 验 React 的输入类交互一律用真实用户操作:`fill` / `type` / `click` / `press Tab`,\n让浏览器自己派发真实事件序列,别在 `eval` 里合成;\n② 万不得已要程序化改值时,用 `Object.getOwnPropertyDescriptor(HTMLInputElement.prototype,'value').set`\n调原生 setter 再派发 `new Event('input',{bubbles:true})`,失焦则派发 **`focusout`** 而不是 `blur`\n—— 但这只是兜底,优先走 ①;\n③ **看到「界面没反应」先怀疑自己的测法**,尤其是当同一段代码逻辑读起来明明是对的时候。\n这与 [[vacuous-assertion-false-positive]] 是同一类问题的两面:那条讲断言恒真所以永远绿,\n这条讲触发根本没发生所以看起来永远红。\n\n相关:[[browser-automation-blind-to-native-dialogs]](自动化看不见原生对话框,同属「测法本身不成立」)、\n[[shared-browser-instance-tab-race]]。", "links": ["vacuous-assertion-false-positive", "browser-automation-blind-to-native-dialogs", "shared-browser-instance-tab-race"]}, {"name": "rename-project-dir-keep-xuanji-resume", "description": "本地项目目录改名后要让璇玑会话还能续接,除了 mv 目录和 ~/.claude/projects 的 slug 目录,还必须改 jsonl 里的 cwd 字段和璇玑库的 cwd 两处", "type": "project", "project": "xuanji", "projectPath": "~/xuanji", "file": "~/.claude/projects/…/memory/rename-project-dir-keep-xuanji-resume.md", "body": "本地项目目录改名(2026-11-10 实操 `~/vexel` → `~/airoutly`,会话 76dfd939)后想在璇玑里继续续接旧会话,一共要改四处,少一处都不行:\n\n1. **项目目录本身**:`mv OLD NEW`。前置:工作区干净、没有其它 worktree(改名会断 worktree 链接)、没有进程的 cwd 还在旧目录(`lsof -a -d cwd | grep OLD`、`claude agents --json`)。\n2. **Claude 的会话目录**:`mv ~/.claude/projects/<旧编码> ~/.claude/projects/<新编码>`(编码 = 路径里非字母数字一律换 `-`)。整体 mv 会连 `memory/` 和 `<sessionId>/` 子目录一起带走;新编码目录已存在时只能逐会话挪。\n3. **jsonl 里的 `cwd` 字段**:`sed -i '' 's#\"cwd\":\"OLD\"#\"cwd\":\"NEW\"#g' <sessionId>.jsonl`。不改的话璇玑 `decodeProjectDir` 嗅探最新 jsonl 前 50 行拿到旧路径,新项目被判「目录不存在」,从项目列表和 ⌘D 消失。正文里的引号是转义的,这个模式只会命中真字段。备份放到 slug 目录外面。\n4. **璇玑库的 cwd**:`code/backend/data/xuanji.db` 的 `dispatches`、`dispatch_prompts`(另有 `scheduled_jobs`、`todos`、`prompts` 三张带 cwd 的表,有记录就一起改)。不改的话续接被 `ws.ts` 的「工作目录不存在」拦住。库是 WAL,后端不用停;备份用 `sqlite3 \"$DB\" \".backup ...\"` 不要 `cp`。\n\n**Why:** 璇玑看板从自己的 `dispatches` 表读 cwd,续接时原样带给 SDK;项目列表则靠 jsonl 嗅探 cwd。两条路径各认各的来源,只 mv 目录的话卡片还在、历史能看,但续接报错、项目消失。\n\n**How to apply:** 用户要改项目目录名、或问「改名后会话还在吗」时按这四步走;通用的改名脚本(改目录 + 改 git 远端 + mv slug 目录 + 改收口卡项目名)只覆盖 1、2,要补 3、4。做完用接口验收:`/api/sessions` 里卡片 cwd、`/api/projects` 里出现新项目、`/api/sessions/<id>/can-resume` 返回 ok,再让用户刷新页面发一条消息确认。卡片不在后端内存里(接口返回没有 `dispatchId`)时不需要重启后端;派发会话里跑这套是安全的,只要被迁的不是自己所在的目录。其它不用管的地方:`~/.claude.json`、`history.jsonl` 对 SDK 派发的会话没有记录。相关:[[session-jsonl-retention-cleanup]]、[[runtime-only-metadata-needs-snapshot]]。", "links": ["session-jsonl-retention-cleanup", "runtime-only-metadata-needs-snapshot"]}, {"name": "replay-inherits-realtime-semantics", "description": "回放事件与实时事件共用一条处理路径时，会继承「现在=事件时刻」这类实时语义，历史被整条抹成「刚刚」；两部分表现不一致的那条分界线就是定位线索。", "type": "feedback", "project": "xuanji", "projectPath": "~/xuanji", "file": "~/.claude/projects/…/memory/replay-inherits-realtime-semantics.md", "body": "派发页接回会话后 40 轮时间全是 17:44（2026-09-17, PR#62）：后端把内存回放缓冲裸推给前端，前端 `user-echo`/`assistant`/delta 一律 `Date.now()` 打点——实时路径这么写是对的，回放走同一条路径就把整条会话的时间抹成了「刚刚」。\n\n**Why:** 凡是「同一个 handler 既处理实时流又处理历史回放」的设计，任何隐含「此刻」的取值（时间戳、序号、当前用户、活动状态）都会在回放时失真，而代码本身看不出错。\n\n**How to apply:** 症状出现在显示层时，先问「这个值是谁给的」——本次显示层（`msgClock`）完全无辜。定位靠**分界线**：从 jsonl 补的更早轮次时间一直是对的、内存回放那段全错，两条装载路径的差异直接指出病灶。修法是让回放事件自带当初的时刻（缓冲里本来就有平行的 `eventAt`），而不是在下游反查对齐。参见 [[unread-badge-multi-entry-paths]]、[[runtime-only-metadata-needs-snapshot]]。", "links": ["unread-badge-multi-entry-paths", "runtime-only-metadata-needs-snapshot"]}, {"name": "reused-filter-changes-meaning", "description": "复用既有过滤器/白名单常量前先回到它当初为什么存在——同一个过滤器换个问题域会从「降噪」变成「系统性漏数」，且症状是数字小得合理、不报错", "type": "feedback", "project": "xuanji", "projectPath": "~/xuanji", "file": "~/.claude/projects/…/memory/reused-filter-changes-meaning.md", "body": "给新功能做聚合统计时复用了 `config.projectNoisePatterns`（原用途：把 `multica-workspaces` 临时目录挡在**项目列表**外，因为它们不该显示成项目）。套到「技能触发了多少次」上，直接把 baize 的 209 次算成个位数——因为 200+ 次恰恰发生在那些临时工作区里。\n\n**Why:** 过滤器的正确性是**相对问题域**的。「临时工作区不是一个项目」为真，不代表「临时工作区里的活动不算数」。这类错误不抛异常、不返空，只是数字小得看起来很合理——如果不是我恰好先用 grep 独立算过一遍真值，会直接当成正确结果交付。这是 R7「查数返空先自查口径」的变体：**数字不空但偏小，同样要先自查口径**。\n\n**How to apply:** 复用任何既有的过滤器 / 噪声名单 / 白名单常量前，先找到它的定义处读注释与调用点，问一句「它当初是为了回答哪个问题而存在，我现在问的是不是同一个问题」。不是就别套，并在新口径里显式写明包含/排除了什么（写进用户可见的口径字符串，不是只写代码注释）。新聚合功能上线前，用一条独立路径（grep / 一次性脚本）对至少一个高频样本算出真值做交叉验证——两边对不上时，先怀疑口径，再怀疑解析。\n\n相关：[[new-tests-silently-not-run]]（同属「全绿但其实没生效」这类静默失败）", "links": ["new-tests-silently-not-run"]}, {"name": "runtime-only-metadata-needs-snapshot", "description": "会话名等元数据只活在进程内存里，进程一退 ~/.claude 里查不到；显示退化成兜底值时先确认源头是否根本没被持久化，别在显示逻辑里找 bug。", "type": "project", "project": "xuanji", "projectPath": "~/xuanji", "file": "~/.claude/projects/…/memory/runtime-only-metadata-needs-snapshot.md", "body": "`claude agents --json` 能查到会话名，但那是进程内存里的东西——会话退出后 `~/.claude` 的 history.jsonl、session jsonl 里**一个 title 类事件都没有**（已逐个 grep 验证）。而璇玑的用量统计、周报这类功能统计的恰恰是**已结束**的历史会话，所以它们拿到的永远是空，只能退化成转录首句。\n\n**Why**：2026-08-28 修「用量条形图显示首句不显示 name」时，第一反应是去查显示逻辑和 nameMap 拼装（那里确实也有个漏源的 bug），但真正治本的是发现名字压根没被持久化过。在显示层反复找是找不到的——源头就是空。\n\n**How to apply**：\n- 看到「某字段退化成兜底值」，先花一分钟确认**源头还存不存在**（grep 全部候选存储），再去查解析/显示逻辑。源头没了的话，任何显示层修法都只是换个兜底。\n- 依赖外部进程运行时状态的元数据（会话名、pid、临时端口），要在**能看到它的那个轮询出口**顺手快照进自有库。璇玑的看板本来就在轮询，写在 `sessionsBoard` 出口一处即可，新增入口不会漏记。\n- 快照定位为「自有可重建索引」，不回写 `~/.claude`（架构铁律），丢了只是退回兜底显示。\n- 快照要挡掉占位名（如 `sessionId.slice(0,8)`），否则兜底值会把已记下的真名盖成一串 hex。\n- 代价要说清楚：快照只对**上线之后**活过的会话生效，存量的名字已经永久消失，别承诺能救。\n\n相关：[[unread-badge-multi-entry-paths]]（同属「先查数据/入口，别先查判定逻辑」这一类）、[[reused-filter-changes-meaning]]。", "links": ["unread-badge-multi-entry-paths", "reused-filter-changes-meaning"]}, {"name": "sdk-artifact-tool-entrypoint-gate", "description": "Agent SDK / claude -p 入口默认不注册 Artifact 工具,交互式终端有;设 CLAUDE_CODE_ARTIFACT=1 即可,已端到端发布验证", "type": "project", "project": "xuanji", "projectPath": "~/xuanji", "file": "~/.claude/projects/…/memory/sdk-artifact-tool-entrypoint-gate.md", "body": "Claude Code 2.1.259 的 `Artifact` 工具(把本地 html 发布成 claude.ai/code/artifact 托管页)在入口为 `sdk-ts` / `sdk-py` / `sdk-cli`(含 `claude -p`)/ `mcp` 时默认不注册,交互式终端(/config 里 Artifacts=true)才有。判定原文:`if(!De(a.CLAUDE_CODE_ARTIFACT)&&GCr())return!1`,即环境变量 `CLAUDE_CODE_ARTIFACT=1` 可强开。`enableArtifact` 设置与 `CLAUDE_CODE_ARTIFACT_TOOLSET` 对此无效(后者只管 comments/resolve 子工具集)。\n\n**Why:** 2026-09-15 我先根据 init 报文里没有 Artifact 就断言「账号未灰度」,用户拿 /config 截图打回;真因是入口门控。init 报文是真注册表没错,但「工具没注册」有多种原因,交互式与非交互式入口要分开验。\n\n**How to apply:** 璇玑派发要用 Artifact 时在 `dispatch.ts` 的 `env` 里加 `CLAUDE_CODE_ARTIFACT: '1'` 即可,已用 SDK `query()` 端到端发布成功(账号 Max、claude.ai 登录)。排查「SDK 里少某个工具」先对比同账号交互式终端是否有,再查入口变量,别先怪账号。相关:[[runtime-only-metadata-needs-snapshot]]", "links": ["runtime-only-metadata-needs-snapshot"]}, {"name": "sdk-payload-has-the-field-you-were-about-to-invent", "description": "准备给外部信号自造判定规则前,先读一遍它的类型定义——官方往往已有语义字段并写明 host 该怎么用;同症状也未必同病因,先取证再分流。", "type": "feedback", "project": "xuanji", "projectPath": "~/xuanji", "file": "~/.claude/projects/…/memory/sdk-payload-has-the-field-you-were-about-to-invent.md", "body": "给外部信号（SDK 事件、API 返回）**自造分类规则之前，先把它的类型定义连注释读完**。\n\n2026-09-18 派发卡片卡在「进行中」：我已经给用户提了「打日志捞真实 `task_type`，按类型名白名单分流」的方案并获批，动手第一步读 `sdk.d.ts` 就发现 `background_tasks_changed` 的 payload 里躺着 `ambient?: boolean`，注释原文写着「auto-started live-update watchers; **hosts should exclude them from activity indicators**」——正是我要解决的那一类，且该字段在整个仓库零消费。自造方案当场作废，改成一行 filter。按类型名分流本会要维护枚举、还会漏掉未来新增的杂务类型。\n\n讽刺的是这段代码原有的注释就写着「不靠猜测工具名/完成时机，直接读 SDK 的权威集合」——原则本来就对，只是当初读漏了一个字段。**「我读过这个 payload」不等于「我读过它的类型定义」**。\n\n**同症状不同病因**：同一次会话里用户给了第二张截图，摘要格式一模一样，差点被当成同一个 bug 的漏网之鱼。`ps` 一查，那个后台任务**真的在跑**——一条等 `localhost:37777` 的 `until` 循环空转 2h48m，端口没人监听、循环没有超时上限，卡片是如实反映。刚修完一个 bug 时最容易把下一个同症状问题也归给它，**取证一分钟能挡住这种惯性**。参见 [[code-comments-about-external-tools-expire]]（那次是注释过期，这次是字段没读到，同一类「依据没核对就动手」）。\n\n**Why:** 自造判定规则的成本不在写，在维护——枚举要跟着上游更新，而官方语义字段本就是给 host 用的、上游新增类型时自动覆盖。\n\n**How to apply:** 要给外部 payload 加分类逻辑时，先 `grep` 它的 `.d.ts` / schema 看有没有现成语义字段（尤其看字段注释里有没有 \"hosts should …\" 这类给调用方的指示）；已经跟用户报过方案也照样先读，读完再改口比维护一套多余的枚举便宜。修完一个 bug 后遇到同症状的第二例，先 `ps` / 查真实状态确认它是不是同一个病因。", "links": ["code-comments-about-external-tools-expire"]}, {"name": "session-jsonl-retention-cleanup", "description": "~/.claude/projects 下的会话 jsonl 会被 Claude Code 按保留期清理,项目目录只剩 memory/;任何「从 jsonl 读字段」的逻辑都要有不依赖 jsonl 的兜底", "type": "project", "project": "xuanji", "projectPath": "~/xuanji", "file": "~/.claude/projects/…/memory/session-jsonl-retention-cleanup.md", "body": "`~/.claude/projects/<编码目录>/` 里的 session jsonl 会被 Claude Code 按保留期(cleanupPeriodDays,默认约 30 天)删除，目录本身连同 `memory/` 保留。依赖「最新 jsonl 里的 cwd」还原路径的 `decodeProjectDir` 因此退化成朴素替换 `-`→`/`,把 `~/baize_web` 解码成不存在的 `/baize/web`,项目被当作 missing 从项目页和 ⌘D 候选里过滤掉(PR#97,2026-11-09;本机 29 个无 jsonl 的目录里有 26 个中招)。history.jsonl 不受清理影响，可以佐证用户「明明用过很多次」。\n\n**Why:** 用户的直觉是「用过的项目理应一直在」,而数据源会随时间静默流失；新建一个会话就会让现象消失，复现窗口很窄。\n\n**How to apply:**\n- 「某个老项目搜不到 / 列表里消失」:先看该编码目录下还有没有 jsonl,再查匹配逻辑。\n- 新写从 jsonl 取字段的功能时，默认数据可能已被清理，补上不依赖 jsonl 的兜底(磁盘探测或 history.jsonl)。\n- 和 [[runtime-only-metadata-needs-snapshot]] 是同一类问题：先确认数据源还在。", "links": ["runtime-only-metadata-needs-snapshot"]}, {"name": "setstate-updater-reads-mutable-ref", "description": "React setState 更新函数是延后执行的,在里面读可变 ref 会拿到「求值那一刻」的值;事件连发(回放/高负载)时整批消息共享同一个错值,单条事件测试永远绿", "type": "feedback", "project": "xuanji", "projectPath": "~/xuanji", "file": "~/.claude/projects/…/memory/setstate-updater-reads-mutable-ref.md", "body": "派发页接回会话后 98 条 Claude 消息只剩 6 个时刻(全是渲染刻度),PR#62 修过的「回放不带时间」本次复发在前端另一层:`flushDelta` 把 `pendingAtRef.current ?? Date.now()` 写在 `setItems` 的更新函数里,紧接着一行 `pendingAtRef.current = null`。更新函数在队列非空时延后到 render 才求值,那时 ref 已被清空/改写。\n\n**Why:** React 只在更新队列为空时立即(eager)求值更新函数,所以单条事件、平时实时对话都对;接回回放几百条 ws 消息连发或机器 load 高时队列攒着,同一批更新函数一起跑、读到同一个 ref 终值。症状与「回放继承实时语义」([[replay-inherits-realtime-semantics]])一模一样,但数据通道完全无辜——先连 WS 抓原始事件核对 `at`,再往前端找。\n\n**How to apply:** 更新函数只用捕获的常量:先 `const at = ref.current ?? Date.now()` 再 `setX(prev => ...at...)`;闭包里的事件对象 `e` 是安全的,`ref.current` 不是。这类时序 bug 用扫源码守卫钉住(项目已有先例 `tests/replay-timestamps-guard.test.ts`),并且必须先在旧代码上跑一次确认它会红。另:agent-browser 共享实例在高负载下开页/抢标签会返回 `chrome-error://`,先核 href 再信 n=0([[shared-browser-instance-tab-race]])。", "links": ["replay-inherits-realtime-semantics", "shared-browser-instance-tab-race"]}, {"name": "shared-browser-instance-tab-race", "description": "agent-browser 是跨会话共享的浏览器实例,并行会话会抢走活动标签;验证前先 tab new,读结果前先核对 location.href", "type": "feedback", "project": "xuanji", "projectPath": "~/xuanji", "file": "~/.claude/projects/…/memory/shared-browser-instance-tab-race.md", "body": "`agent-browser` 连的是**一台机器上共享的浏览器实例**,不是每个会话一个。多个 Claude 会话同时跑浏览器验证时,后发起的 `open` 会把先前会话的活动标签导航走。\n\n**Why:** 2026-09-02 做璇玑轮次导航验收时,另一个会话(feature/composer-code-syntax)正在调它自己的原型页,我的标签被抢走两次。第二次直到 `location.href` 返回的是**别人的 `file://…prototype-composer-code.html`** 才发现——在那之前,`querySelector` 全部返回 null / undefined,报错长得像「页面没加载完」或「选择器写错了」,很容易往错的方向查半天。更糟的情况是选择器**恰好在别人页面上也匹配得到**,那就会拿到一份看起来合理、实际来自另一个页面的假数据。\n\n**How to apply:**\n1. 开始一轮浏览器验证前先 `agent-browser tab new`,拿一个自己的标签;`agent-browser tab list` 能看到当前所有标签和谁是活动的。\n2. **凡是要写进交付说明的测量值,取值前先确认 `location.href` 是自己的地址**,别只看返回值像不像。\n3. 元素查询接连返回 null 时,第一个怀疑对象是「页面被换掉了」,而不是选择器或加载时序。\n4. 多轮交互尽量合并成**一次链式 async eval**(内部 `await sleep`),减少被抢占的时间窗;逐条 `agent-browser` 命令之间的间隙就是别人插进来的机会。\n5. 反过来也要自觉:自己 `open` 之前想一下会不会正踩着别人的验证。\n\n相关:[[vacuous-assertion-false-positive]](同属「验证本身不可信」这一类)", "links": ["vacuous-assertion-false-positive"]}, {"name": "shortcut-toggle-not-context-branch", "description": "一个快捷键别按上下文分叉成两种动作(空输入框开面板 / 有内容预填前缀),用户按下去得不到「同一个键再按一次就撤销」的预期;做成纯开关,判定只看一个状态", "type": "feedback", "project": "xuanji", "projectPath": "~/xuanji", "file": "~/.claude/projects/…/memory/shortcut-toggle-not-context-branch.md", "body": "给旁路提问设计 ⌘/ 时我把它做成「输入框为空 → 重开面板;有内容 → 预填 /btw 前缀」,自以为聪明地省了一个键。用户第一次验收就打回:「按下去只弹侧栏但没进提问态,而且没法用同一个键关掉,交互有点怪」。改成开关后一次过:进入 = 开面板 + 加前缀进模式 + 聚焦;再按 = 去前缀 + 关面板;判定只看「输入框是否处于旁路模式」这一个状态,不看面板开合。\n\n**Why:** 快捷键的心智模型是「按一下进去,再按一下出来」。按上下文分叉后,同一个键在用户看来行为不可预测,而且分叉的两个分支都不是「撤销上一次」,于是没有退出路径。\n\n**How to apply:** 凡设计模式切换类快捷键,先写出「再按一次会怎样」;答案不是「回到按之前的状态」就重做。判定依据选一个最贴近用户意图的状态(输入框内容),不要综合两三个 UI 状态推断。相关:[[verify-in-users-daily-config]](验收前自己按用户的路径走一遍)。", "links": ["verify-in-users-daily-config"]}, {"name": "skeleton-only-for-known-shape", "description": "骨架屏只在内容形状已知时成立；长度未知的地方用骨架是语义用错，且实色填充在壁纸档会退化成黑板", "type": "feedback", "project": "xuanji", "projectPath": "~/xuanji", "file": "~/.claude/projects/…/memory/skeleton-only-for-known-shape.md", "body": "用户对 `/btw` 等待态的原话是「这个黑色的横条是骨架屏吗？太丑了」。表面是审美问题，实际是骨架屏用错了场景：它的前提是「内容形状已知，先把轮廓占住」，而旁路答案可能一行也可能一张表，长度完全未知——预告一个假形状，答案回来时还要跳变。叠加 `background: var(--hover)` 是实色，开壁纸时（用户日常配置）几条占位条就成了面板里的黑板。\n\n**Why**：产品 register 是 product，`reference/product.md` 写着「Skeleton states for loading, not spinners in the middle of content」，照抄这条就会在这里犯错——那句话的适用前提是列表/卡片这类形状确定的内容区。规则要连前提一起读，不能只记结论。\n\n**How to apply**：加载占位前先问「这块内容的形状我现在知道吗」。知道（列表行、卡片网格、表格）→ 骨架；不知道（模型输出、可变长文本）→ 一行状态指示，用产品里已有的「正在生成」符号（本项目是助手正文的 `.typing` 三点），别新造符号。等待久了要改口就在同一位置换措辞，别追加第二行——窄面板会把操作按钮挤走。相关：[[verify-in-users-daily-config]]、[[prototype-inline-real-css]]。", "links": ["verify-in-users-daily-config", "prototype-inline-real-css"]}, {"name": "table-colgroup-hidden-column-shift", "description": "table-layout:fixed 下用 colgroup 定列宽时，用 display:none 隐藏中间某列会让后面的列错拿前一个 col 的宽度；把宽度写在 th 上即可", "type": "reference", "project": "xuanji", "projectPath": "~/xuanji", "file": "~/.claude/projects/…/memory/table-colgroup-hidden-column-shift.md", "body": "`<colgroup><col>` 是**按位置**映射到列的。窄屏用 `display:none` 隐藏第 4、5、6 列后，剩下的第 7 列（启用开关）变成渲染中的第 4 列，于是拿走了 `col:nth-child(4)` 的宽度——实测被压成 0，而症状出现在一个我没动过的列上。\n\n**How to apply:** `table-layout: fixed` 下，列宽写在**表头单元格**（`th:nth-child(n) { width }`）而不是 colgroup —— fixed 布局的列宽取自首行，隐藏任何列后剩余列自然按各自宽度重排。响应式收列同理用 `:is(th, td):nth-child(n) { display: none }`。\n\n顺带：技能表这类数字列要 `font-variant-numeric: tabular-nums` + 固定列宽，否则切换统计窗口（209 ↔ 3）会让整表列宽重新分配、行间横向错位。", "links": []}, {"name": "tailwind-generates-the-class-you-collide-with", "description": "Tailwind v4 按需生成工具类，撞名对象在你写下这个类名之前不存在于任何文件里，所以「先 grep 查重」查不出来；业务类名一律加项目前缀，并用测试守住", "type": "feedback", "project": "xuanji", "projectPath": "~/xuanji", "file": "~/.claude/projects/…/memory/tailwind-generates-the-class-you-collide-with.md", "body": "在启用 Tailwind v4(`@import \"tailwindcss\"`)的项目里写业务类名，**不能靠 grep 查重来确认安全**。Tailwind 按需生成：它扫描源码里出现的**类名字符串**，命中自己的工具类名就现场生成对应规则。也就是说，**你写下 `className=\"fixed\"` 这一刻，`.fixed{position:fixed}` 才被造出来**——写之前它不在任何文件里，grep 项目、grep 样式表都是干净的。\n\n**Why:** 2026-09-03 璇玑设置面板的快捷键表，只读键位行我起名 `className=\"fixed\"`（语义是「这个键位固定不可改」）。用户截图报「切换视图」一行的说明文字与后面的分组标题叠在一起。实测该行 computed style 是 `position: fixed; display: block`：整行脱离表格流，表格底与行顶同在 379px，行却继续下延 56px 盖住下方内容。**症状（文字重叠）与病因（一个类名）看着毫不相干**，从样式表读起来永远读不到问题——因为那条规则不在样式表里，在构建产物里。\n\n这条经验是对 [[prototype-inline-real-css]] 里「新增类名先 grep 查重」的**修正**：那次撞的是项目已有的 `.brand`，grep 得到；这次撞的是构建时才诞生的工具类，grep 不到。同一个做法在两种撞名上一个有效一个无效。\n\n**How to apply:**\n1. **业务类名一律加项目前缀**（璇玑用 `stg-` 之类）。这是唯一无脑正确的做法，比任何查重都可靠。\n2. 特别当心这批语义「像普通类名」的工具类：`fixed` `absolute` `relative` `sticky` `static` `block` `inline` `flex` `grid` `table` `hidden` `contents` `container` `group` `peer` `visible` `invisible` `collapse` `border` `rounded` `shadow` `outline` `ring` `transform` `transition` `truncate`。\n3. 要查证时**查构建产物而不是源码**：`curl <站点>/assets/index-*.css | grep -o '\\.fixed{[^}]*}'`。注意 `grep -o '\\.a{'` 会匹配到 `.runline i.a{...}` 的子串，**短类名极易得到假阳性**，看到命中先确认它是不是独立规则。\n4. 璇玑已有守卫 `code/frontend/src/lib/classname-collision.test.ts`，扫 `className=\"…\"` 与 `cn('…')` 字面量。它对「工具类落在本就是这个 display 的元素上」豁免（`<table className=\"table\">` 无害）。别的项目遇到同类问题可以照抄这个思路。\n5. 写这种守卫时记得加一条「扫到的文件数 > N」的断言，否则 glob 失效后守卫空跑还报绿（[[vacuous-assertion-false-positive]]）。\n\n相关：[[prototype-inline-real-css]]（同族但机理不同的类名撞车）、[[vacuous-assertion-false-positive]]", "links": ["prototype-inline-real-css", "vacuous-assertion-false-positive", "prototype-inline-real-css", "vacuous-assertion-false-positive"]}, {"name": "textarea-overlay-baseline-gap", "description": "textarea 叠镜像层必须 display:block,否则 inline-block 基线余量让叠层比 textarea 高约 6px、滚到底时错位", "type": "project", "project": "xuanji", "projectPath": "~/xuanji", "file": "~/.claude/projects/…/memory/textarea-overlay-baseline-gap.md", "body": "textarea 默认 inline-block 且按 baseline 对齐,包裹容器底部会多出约 6px 行框余量;任何用 `inset:0` 铺满容器的叠层(高亮镜像、占位层)都会比 textarea 高这一段,两者可滚动上限不等,textarea 滚到底时叠层差 6px 没滚到(PR#56,用户看到的是「光标与文字错位、拼音下划线成删除线」)。\n\n**Why:** 未滚动时逐像素对齐,只有内容超上限并滚到底才暴露,所以像「粘贴后才出现」的偶发 bug;余量随字号/行高变化,减固定像素不可靠。\n\n**How to apply:** textarea 叠层一律给 textarea 加 `display:block`(或 vertical-align:top);排查叠层错位先量 wrap 高 vs textarea 高、两者 `scrollHeight-clientHeight` 是否相等,而不是先怀疑 scrollTop 同步时机。相关:[[table-colgroup-hidden-column-shift]]。", "links": ["table-colgroup-hidden-column-shift"]}, {"name": "ua-default-needs-scheme-declaration", "description": "暗色站滚动条悬停冒出灰白粗轨道的两层真因(缺 color-scheme + Chrome 标准滚动条属性会整体禁用 ::-webkit-scrollbar),以及「症状散落多处先找全局声明」的判断法;附一次自造回归的教训。", "type": "feedback", "project": "xuanji", "projectPath": "~/xuanji", "file": "~/.claude/projects/…/memory/ua-default-needs-scheme-declaration.md", "body": "用户报「会话页右缘滚动条变成灰白粗条，其他窗口也一样」。真因有两层，我第一版只修了一层还顺手造出回归（PR#74 → PR#77）：\n\n1. **缺 `color-scheme: dark`**：浏览器的 UA 默认样式（滚动条、表单控件、日期图标）按 `color-scheme` 分暗/浅两套绘制，暗色站不声明就一律按浅色画。这解释了「灰白」，但不解释「粗」。\n2. **Chrome 121+ 的优先级规则**：元素上只要设了 `scrollbar-width` / `scrollbar-color`，`::-webkit-scrollbar` 自定义样式就**整体被忽略**，滚动条退回 macOS 原生 overlay（悬停展开成粗轨道）。仓库里原有四处局部规则两套都写，本就处于「自定义被忽略」状态；我把这套写法推到 `*` 全局，等于把回退铺满了全站——修完症状反而无处不在。\n\n**Why:** 两个属性体系互斥而非互补，「都写上保险」恰恰是错的。且我第一版验证在 agent-browser 自带的 Chromium 里做：它不走 macOS overlay 滚动条模式，`scrollbar-color` 在那里被 Chrome 自绘成细条，看上去像修好了；用户的真实 Chrome 走 overlay，标准属性被忽略成原生。这是 [[verify-in-users-daily-config]] 的又一例——差集这次在浏览器的滚动条模式。\n\n**How to apply:**\n1. 症状出现在多个互不相干的 UI 处 → 先问「有没有一个全局开关能一次解释全部」，再动手改任何一处；仓库里已有的零散局部覆盖是误导源，别顺着它们「补第 N 处」。\n2. 自定义滚动条：Chromium/WebKit 只写 `::-webkit-scrollbar`，标准属性放进 `@supports not selector(::-webkit-scrollbar)` 只给 Firefox。判定生效看 `offsetWidth - clientWidth`（overlay 为 0，自绘 6px 为 6），别看 `getComputedStyle().scrollbarWidth`。\n3. 滚动条/原生控件类视觉改动，验证要用用户机器上的真实 Chrome（独立 `--user-data-dir` + `--remote-debugging-port`，`agent-browser --cdp` 连上），agent-browser 自带 Chromium 的滚动条模式与用户不同。CDP 截图拍不到 overlay 滚动条的悬停态，机制证据用占位宽度。\n4. Pake 壳(WKWebView, WebKit 17.1)不认标准属性,只看 `::-webkit-scrollbar`;本机 Playwright WebKit 起不来(Bus error),WebKit 取证用 Safari + 自包含测试页 + `screencapture -l <windowID>`(窗口 ID 用 Swift 取)。\n5. 与 [[unread-badge-multi-entry-paths]] 是一对：那条说「多入口要逐个枚举」，这条说「多出口要往上找共同根」。分界是各处**是否共享同一段判定/声明**。", "links": ["verify-in-users-daily-config", "unread-badge-multi-entry-paths"]}, {"name": "ui-feel-bugs-sweep-sample-first", "description": "「不灵敏/偶尔才生效/往回不跟手」这类手感 bug 别去调参数——先把输入扫一遍、连点多次采样输出，二值突变或状态依赖的静默失败一眼可见", "type": "feedback", "project": "xuanji", "projectPath": "~/xuanji", "file": "~/.claude/projects/…/memory/ui-feel-bugs-sweep-sample-first.md", "body": "用户说「视线往左灵敏、往右要到屏幕最右才转」「表情点很多次偶尔才出现」，第一反应是「阈值/区域太宽，调一调」。两次都错：根因是**映射本身不连续**和**依赖内部状态的静默失败**，调参数无解。\n\n**How to apply**：手感类报告先做两件事，再决定改什么：\n\n1. **扫描采样**：把输入沿一条线扫过去，每一步记录输出值（视线：鼠标横扫 17 个点读 `targetX`）。二值突变（-1 … -1 | 0 | +1 … +1）、单侧饱和（右侧最多 0.15）、阶梯，都能一眼看出，比「感觉不跟手」精确一百倍。看到二值就去翻映射函数——本例 `model.focus()` 内部 `atan2` 只取方向不取距离，幅度永远拉满。\n2. **连点采样**：「偶尔才生效」= 成功与否取决于某个内部状态。连点 N 次记录每次结果 + 相关状态（表情下标 + 已加载数）。本例 `setRandomExpression` 的筛选 `expressions[i] !== currentExpression` 在两边都 undefined 时把候选全排除、静默 `return false`，要等某项被别的路径加载过才有候选。\n\n**两个附带教训**：\n- 我自己一次点击「9→4」成功过就以为没问题——单次撞对不代表路径可靠，尤其是带随机/懒加载的 API。\n- 读输出要在正确时机：Live2D 的 `update()` 末尾就 `loadParameters()` 重置参数，帧间读永远是 0；挂在它重置前的 `beforeModelUpdate` 事件上才读得到真值（同 [[vacuous-assertion-false-positive]] 里「观测手段造假」）。", "links": ["vacuous-assertion-false-positive"]}, {"name": "unread-badge-multi-entry-paths", "description": "璇玑「进入会话」有多条入口,凡是要跟着换会话归零/标记的状态都得每条入口都做——已复发五次;第五次(旁路计数串会话)证明逐入口补清空不够,按会话挂载的状态要自带 sessionId 归属 + 拉取用 REPLACE;修前先枚举入口,并把动作收进消费侧单点", "type": "feedback", "project": "xuanji", "projectPath": "~/xuanji", "file": "~/.claude/projects/…/memory/unread-badge-multi-entry-paths.md", "body": "璇玑的「待验收」角标(`isUnread`)由**本地已读表**判定,而标已读(`markSeen`)散落在多条**进入会话的入口路径**上:看板打开回放、续接装载(`applyResume`)、attach 接回、派发页回合进行中的兜底 effect。用户报「角标不熄灭」时,真因几乎总是**某条入口路径没标**,而不是 `isUnread` 判定写错了。\n\n这个缺陷已连续复发三次,且第三次换了个状态:PR#19 补 resume 路径,PR#23(2026-08-21)补 attach 接回路径,\nPR#51(2026-09-09)则是**轮次索引**没跟着换会话清空——`⌘⇧O` 轮次目录里列着上一个会话的 40 条轮次,\n本会话的轮次被挤到后面。六条进入会话的入口(看板接回 attach / `/resume` 续接 / 待办开工 / 无意图残留清理 /\n交接 handoff / 新建会话)里,只有两条调了 `resetTurnNav()`。**所以这不是「角标」的毛病,是「多入口 × 会话级状态」的毛病**——\n凡是「必须跟着换会话归零或标记」的状态(已读标记、输入历史回溯范围、轮次索引与待回填的更早事件、续接信息、会话上下文),\n都吃这一套。派发页切视图不卸载,残留就活在同一个页面实例里,刷新页面即消失(所以这类 bug 常常「我再去看又好了」)。\n\n**Why:** 判定逻辑只有一处、有纯函数测试覆盖,不易错;入口路径有三个发起方(`Sessions.smartOpen` / `Dashboard.goSession` / `Todos.startTodo`)且还在增加,漏一条就是一个永不熄灭的角标。派发页那个兜底 effect 又只在回合 `working / awaiting-permission` 时生效(故意不在收尾那拍标,否则会盖掉最后一笔产出),对已收尾的会话结构性失效,救不了漏标。\n\n**How to apply:** ① 接到角标类反馈,先 `grep markSeen` 枚举全部入口路径、逐条比对用户走的是哪条,别先去翻 `isUnread` 或已读表基线;② 新增任何「进入会话」的入口时,同步确认它会标已读;③ 标记/归零写在**消费侧**(派发页消费跳转意图处)而非发起侧,让多入口共用一次动作,从形态上杜绝复发——\nPR#23 的 `markSeen` 与 PR#51 的 `leaveSession()`(把输入历史、轮次索引、续接信息、会话上下文的归零收成一个函数)都是这个修法;\n④ 前端没有 Dispatch 的组件测试,这类「新增入口漏调」只能用**扫源码的守卫测试**钉住(断言某函数全文件只有一个调用点),\n沿用 `classname-collision.test.ts` 的先例,写完记得反向验它会红(见 [[vacuous-assertion-false-positive]])。\n\n**2026-09-10 反向边界(同一族的另一半):收进单点不等于对所有入口一视同仁。**\n给派发页加「快速提问默认态」时,要让 ⌘N 开的新会话把工作目录退回默认,顺手把 `setCwd('')`\n写进了公共的 `newSession()` —— 结果 `/clear` 也被带着换了目录,而 `/clear` 的既有注释白纸黑字写着\n「工作目录/模型/权限档保持不变」。**两个入口共用一个函数,但对同一个副作用的期望相反**:\n⌘N 开的是新任务(该退回默认),`/clear` 清的是上下文(人还在同一个项目里)。\n修法是 `newSession({ keepCwd })` 让入口显式声明,而不是让公共函数替所有人决定。\n\n**判据:往公共函数里加副作用前,先枚举它的调用方,逐个问「这条入口也想要这个效果吗」。**\n「收进单点」防的是漏做,不防做过头;漏做的症状是某条路径不生效(好发现),做过头的症状是\n另一条路径悄悄多了个行为(不好发现,因为那条路径本来是对的)。这次靠的是读 `/clear` 分支的\n既有注释才撞见——**注释里写着的承诺,就是一条不能被新副作用违反的约束**。\n守卫同样用扫源码的测试钉住(断言 `/clear` 分支调用时带 `keepCwd`),写完反向验它会红。\n\n**2026-09-17 第四次复发,换了个触发方式:入口没漏做动作,而是「动作依赖的 id 晚到」。**\n用户报「重启后续接老会话看不到历史 /btw 旁路记录」——记录一条没丢(库里 46 条全在,\n且全都对得上 `dispatches`,反证非 fork 的 resume 不换 session id)。真因是拉取挂在 `sessionId` 上,\n而 `sessionId` 只在后端 `init` 事件到达时才设置,`init` 来自 SDK 的 system init 消息,\n**要等续接后发出第一条消息才来**。于是「续接装载完但还没说话」这段时间请求从未发出,面板显示空态。\n`applyResume` 里那句「派发页原有的 markSeen 效应依赖 d.sessionId(发出第一条消息才有值)」的注释,\n其实早就把这个陷阱写出来了——只是当时只修了 markSeen 一个消费者。\n\n**判据:凡是「按会话挂载」的状态,别挂在 `d.sessionId` 上。** 那个 id 是「SDK 会话真的起来了」的信号,\n不是「用户要看哪个会话」的信号;后者入口在装载时就知道(`resumeInfo.sessionId` / `intent.attach.sessionId`)。\n修法(PR#60)是入口先登记已知 id(`noteSessionId`)、消费侧按 `sessionId ?? knownSessionId` 取,\n归零仍旧收进 `leaveSession()` 单点。接回入口一并登记,因为回放缓冲可能把 `init` 挤掉(见 [[fixed-cap-buffer-evicted-by-stream]])。\n\n**2026-09-20 第五次复发,而且是上一次修法自己留下的坑(PR#66)。**\n用户报「这个会话从没用过 /btw,状态栏却显示旁路 26」——那 26 条属于另一个会话。后端按 session_id\n过滤完全正确(sqlite 直查:26 条挂在 `03279c7d…`,界面上的 `23a005ce…` 是 0 条)。两处叠加:\n① PR#60 定的取值顺序是 `sessionId ?? knownSessionId`,**SDK 的 id 优先**——而离开会话只在\n`d.started || items.length > 0` 时才 `d.reset()`,没触发 reset 的入口里旧 `sessionId` 一直挂着,\n`leaveSession()` 的 `noteSessionId(null)` 反而被它盖过;② 拉取结果是 **merge 语义**,\n即便 id 换对、接口返回空数组,上一个会话的记录也被原样保留下来。\n\n**判据一:优先级要给「入口知道的 id」,不是「SDK 给的 id」。** 反转成 `knownSessionId ?? sessionId`\n(init 再反向覆盖 known 以兼容 fork 换 id)。谁最晚失效谁就最危险——`sessionId` 是所有会话级状态里\n最不容易被清干净的那个(Dispatch.tsx 里另有注释记着它会把待办错绑到旧会话,同源未治理)。\n\n**判据二:按会话挂载的数据,拉取一律 REPLACE,并把 sessionId 作为字段存进状态本身。**\nmerge 是为了处理本地事件与拉库的竞态,但它对「换了会话」这件事毫无抵抗力;带上归属后,\nmerge 可以只在同一会话内进行。**把归属显式化,比在每条入口补清空更根本**——入口枚举式修法\n在这个项目已经连吃五次,新入口迟早还会漏;状态自己知道它属于谁,漏了也只会空一拍而不会串会话。\n\n相关:[[prototype-inline-real-css]] 同属「璇玑前端改动的复发形态」类经验。\n\n## 2026-09-20 追加：第六例换了个维度——不是「谁没做动作」，是「做了动作没人知道」\n\nPR#67：进「待验收」卡再退出，角标滞后约 1s 才熄灭、卡片随后下沉。这次 `markSeen()` **做了**，\n判定也对，问题在**通知通道缺失**：已读表写 localStorage、不经过 React，而 App.tsx 里各视图是\n常驻挂载的（CSS class 切显示，不卸载重挂），于是没有任何东西触发重渲染，角标和排序都要等\n`usePoll(api.sessions, 5_000)` 的下一个刻度。\n\n**Key Takeaway**：本项目里「界面该变没变 / 变得慢」先分两档问——① 动作漏做（入口问题，前五例）；\n② 动作做了但状态在 React 之外（localStorage / 模块级变量），没有订阅通道。第二档的判据是\n「这个状态的写入会不会引起 render」，一问就见分晓。修法同样收在**消费侧单点**（一个\n`useSyncExternalStore` 钩子 + 扫源码守卫钉住「用了 isUnread 就必须订阅」），不要逐个入口补刷新。\n另：视图常驻挂载 = 不能指望「切回来会重新 mount 所以会重算」，这是本项目的默认架构。", "links": ["vacuous-assertion-false-positive", "fixed-cap-buffer-evicted-by-stream", "prototype-inline-real-css"]}, {"name": "user-role-messages-arent-all-user", "description": "Claude Code 转录里 kind=user 的消息约 37% 不是用户打的(斜杠命令信封/回显/task-notification/中断标记),凡是「数用户说了几轮」的功能都要先过滤", "type": "reference", "project": "xuanji", "projectPath": "~/xuanji", "file": "~/.claude/projects/…/memory/user-role-messages-arent-all-user.md", "body": "会话 jsonl 里 `role/kind = user` 的消息**不等于「用户输入的一轮」**。Claude Code 把一批机器产物也写进同一条消息流:\n\n| 形态 | 说明 |\n|---|---|\n| `<command-name>/model<\/command-name>` | 斜杠命令的信封,内含 `<command-message>` / `<command-args>` |\n| `<local-command-stdout>…<\/local-command-stdout>` | 命令执行回显(如 `Set model to claude-opus-5[1m]`) |\n| `<local-command-caveat>Caveat: The messages below…<\/local-command-caveat>` | `/compact` 等命令后插入的注意事项 |\n| `<task-notification><task-id>…` | 后台 Task 完成通知 |\n| `[Request interrupted by user]` | 中断标记,另有 `…for tool use` 变体 |\n\n**实测口径(2026-09-02,璇玑,5 个真实会话 532 条 user 消息):** 真提问 335 条(63%),噪音 197 条(37%)——caveat 58 / command-name 58 / stdout 58 / task-notification 14 / 中断 9。每种都跨多个会话出现,不是单会话特例。\n\n**Why:** 做「轮次目录」时按 `kind === 'user'` 直接建索引,125 条里 41 条是这类信封,目录第一屏几乎全是 `<command-name>/model<\/command-name>`,真正的问题被挤出可视区。它不是 bug 而是**口径缺失**——数据本身没错,是「用户消息」这个名字骗了人。\n\n**How to apply:** 任何「统计/列出/编号用户轮次」的功能(目录、用量归因、周报、搜索、轮数计费)先过滤再计数。过滤用**具名标签白名单**而非「以 `<` 开头就丢」——用户粘一段 HTML 或 XML 当提问完全正常,宁可漏滤一种没见过的元条目,也不能吞掉一轮真提问。璇玑的实现在 `code/frontend/src/lib/turns.ts` 的 `isRealTurn`。\n\n另外注意还有**未被上述规则覆盖**的注入形态,例如 skill 加载时写入的 `Base directory for this skill: …`。只见过单一样本,没有据此加规则(避免单样本泛化),遇到第二例再补。\n\n相关:[[reused-filter-changes-meaning]](同样是「口径错了但数字不空」)、[[runtime-only-metadata-needs-snapshot]]", "links": ["reused-filter-changes-meaning", "runtime-only-metadata-needs-snapshot"]}, {"name": "vacuous-assertion-false-positive", "description": "「没发生坏事」类断言在「压根没机会发生」时恒真；验证前先确认样本能让断言失败，否则绿灯只证明了什么都没跑", "type": "feedback", "project": "xuanji", "projectPath": "~/xuanji", "file": "~/.claude/projects/…/memory/vacuous-assertion-false-positive.md", "body": "写验证脚本时，**先问「这个断言在功能坏掉的情况下会不会真的变红」**。形如「从未落在暗卡上」「没有报错」「没有越界」这类否定式断言，在被测对象根本没机会移动/触发时**恒为真**——绿灯此时只证明了样本无效，不证明功能正确。\n\n**Why：** 2026-08-31 验证会话看板项目过滤的方向键导航（PR#38），要证明的是「方向键跳过被过滤的暗卡」。连写两版 CDP 脚本，都报 `never_dim: true` 一片绿——但看轨迹才发现**选中位从头到尾停在同一张卡上**：第一版过滤后全场只剩 1 张亮卡，第二版选的项目其余卡都落在折叠区，两次都是「压根动不了」，于是「没落在暗卡上」自动成立。**「没落在暗卡上」和「跨过了暗卡」是两个命题**，前者在无法移动时恒真，而我要证的是后者。第三版特意挑两个项目拼出「亮 亮 暗 暗 亮」的一列，才拿到决定性轨迹 `0 → 1 → 4 → 1`——上下都跨过了下标 2、3。\n\n**How to apply：** 断言写完先做一次「失败可能性检查」：构造/确认一个**能让它失败**的样本，最好先看着它红一次再修绿。具体到界面导航类验证，别只记录「选中的卡有没有问题」，一并记录**它在完整渲染序列里的下标**——下标出现跳跃（0 → 1 → 4）才是跳过的正面证据，只记「当前卡是好的」永远看不出有没有移动过。同理适用于：重试逻辑（得真的让它失败一次）、边界裁剪（得真的越界一次）、过滤/权限拦截（得真的拿不该看的数据试一次）。计数类断言比否定式断言更抗假阳性——「访问到了 N 张不同的卡」比「没访问到坏卡」难以蒙混。\n\n**同族陷阱：A/B 对照的「修复前」那一组也可能没走上出问题的代码路径。** 2026-09-09 验证轮次目录跨会话残留(PR#51)，\n把改动 stash 掉跑同一段浏览器脚本做前后对照，旧代码竟然也不复现，一度以为病因判断错了。真因是我选的入口(看板点「继续」)\n在那批已 idle 的会话上走的是 resume 分支，而 resume 恰恰是六条入口里本来就正确的两条之一。**同一个按钮、同一个界面，\n底下可能是两条分支**；换成真正漏调的那条入口才拿到 52 轮残留 vs 0 轮的决定性差异。所以对照实验要先确认\n**「修复前」那一组真的复现了问题**，看到「前后都正常」时第一反应应是「我的复现路径选错了」，而不是「那就是没问题」。\n\n**观测手段本身也会造假**(2026-09-17,轮次耗时):用 MutationObserver 采状态条文本,读出「已用 5s → 定格 9s」的跳变,\n据此差点去修一个不存在的口径 bug；换成 200ms 轮询重采,真实序列是 `0s→2s→3s→4s→5s→6s→7s→8s` 完全连续——\nobserver 漏掉了中间的更新。**一个「异常」只由单一观测手段支撑时,先换一种手段复测再下结论**,尤其是这种\n「数字不连续」类的现象,它既可能是被测对象的毛病,也可能是你的探针的毛病。\n\n**探针取错对象 + 工具发出的不是你以为的输入(2026-10-16 PR#93):** 验「抽屉里下拉开着时 Esc 只收下拉」,连测三轮都读到「抽屉也关了」,差点去改一个已经修好的 bug。两个独立假象叠在一起:① `document.querySelector('.drawer')` 取的是 DOM 里第一个 `.drawer`,而页面常驻挂载了 2 个抽屉,拿到的那个本来就关着,读数恒为 false;② agent-browser `press Escape` 实际派发了上百次重复 keydown(挂 capture 探针才看见),第一下关下拉、后面的关抽屉。**按状态类查询要用带状态的选择器(`.drawer.show`)并先数一下同类元素有几个;按键类验证先挂探针数事件次数**,需要单次语义时用 `dispatchEvent(new KeyboardEvent(...))`。修好后仍要临时去掉修复做 A/B,确认「修复前确实会坏」。\n\n相关：[[verify-in-users-daily-config]]、[[new-tests-silently-not-run]]、[[unread-badge-multi-entry-paths]]", "links": ["verify-in-users-daily-config", "new-tests-silently-not-run", "unread-badge-multi-entry-paths"]}, {"name": "verify-in-users-daily-config", "description": "验收环境跑默认配置、用户日常跑自定义配置，这个差集是缺陷的固定漏网处；新增常驻 UI 元素必须在壁纸开启态下看一眼，而且你自己新加的全局渲染设置会当场制造出新的差集", "type": "feedback", "project": "xuanji", "projectPath": "~/xuanji", "file": "~/.claude/projects/…/memory/verify-in-users-daily-config.md", "body": "交付前的浏览器验收不能只跑**默认配置**，必须切到**用户日常实际使用的配置形态**再看一遍。璇玑上最典型的一组差集是「壁纸」：验收环境是全新快照 + 默认 `mode: 'off'` 的纯黑底，而用户平时一直开着壁纸。\n\n**Why：** 2026-08-28 全局状态栏（PR#34）在默认黑底下验收全绿——六个视图逐个截图、对比度实算、吸顶与零值态全测过——上线重启后用户第一眼就看到顶部一条明显的黑色横条。根因是状态栏那层 `color-mix(in oklab, var(--bg) 82%, transparent)` 底色：无壁纸时它与页面底色同色因而隐形，`body.wall-on` 把 body 背景转透明后立刻显形。**缺陷从头到尾都在，只是默认配置刚好把它藏住了**；用户原话是「之前验收环节因为是全黑的默认背景还看不出来，但是我自己平时是会设置背景的」。\n\n**How to apply：** 凡是新增/改动**常驻可见的 UI 外壳元素**（状态栏、顶栏、侧栏、吸顶条、任何带自有 `background` 的容器），验收清单里固定加一条：开壁纸再看。Playwright 里用 `addInitScript` 预置 `localStorage` 的 `xuanji.wall` 即可（`{mode:'wall'|'glass', src, opacity, blur, surface, frost}`，见 `lib/wallpaper.ts` 的 `WallState`），把 `opacity` 拉到 85% 并换成高亮度壁纸，问题会被放大到一眼可见——内置 preset 星野偏暗，不足以暴露。同类差集还有：深/浅色偏好、`prefers-reduced-motion`、自定义字号，遇到对应功能一并想到。\n\n**连带的设计结论（同类问题复发时直接抄）：** 元素坐在壁纸上时，「把底色调淡」是治不好的——`backdrop-filter: blur()` **本身**就会把壁纸糊出一条肉眼可见的横带，静止态必须把底色、边线、blur 一起卸掉才真正隐形。正确形态对齐 macOS 菜单栏：静止全透明，只有内容真的滚到它下方时才淡入垫层（挂 passive `scroll` 监听按 `scrollY` 加类，别用 scroll-driven animation，WebKit 壳支持不确定）。\n\n**2026-08-31 第二次栽在同一处，机理比「常驻外壳元素」更普适：** 会话页项目过滤 chip（PR#38）的选中态底色写的是 `color-mix(in oklab, var(--pc) 14%, transparent)`——**任何往 `transparent` 里混的底色，在 `body.wall-on` 把 body 转透明后都会把壁纸漏到自己背后**，0.75rem 小字实测掉到 1.53:1。所以触发条件不限于「常驻外壳元素」，而是**任何带半透明背景的元素**，包括小控件；`color-mix(..., transparent)` 和 `rgb(... / 0.x)` 都算。修法沿用代码库里 `.dd-menu` 的既有先例：**控件不是外壳表面，不该跟随玻璃档半透明化**，把 tint 混进不透明基色（`--pf-base`）而非 `transparent`，一次覆盖所有模式。\n\n另一个必须记住的坑：**壁纸有三档而不是两档**——默认深色（无壁纸）、`wall-on` 普通档、`wall-on + wall-glass` 玻璃档。这次第一版只修了 glass 档（因为 `--surface-2` 在 glass 下才变半透明），**漏掉了普通 `wall-on` 档，而后者才是壁纸的默认模式**，是分三种模式各量一遍才暴露的。验收壁纸相关改动一律三档全量，别只测 glass。\n\n**2026-09-02 第三次,而且这次「用了不透明 token」也没能挡住:** 派发页吸顶轮次头(PR#43)的底色写的是 `background: var(--surface-2)` —— 看上去是个实心 token,不是往 `transparent` 里混,按前两次的教训应该安全。实测 alpha 仍然只有 **0.24**,正文从带子底下滚过去时两层字叠在一起完全没法读。真因是 `body.wall-glass` **把 token 本身重定义了**:\n\n```css\nbody.wall-glass {\n  --surface:   color-mix(in oklab, oklch(0.185 ...) var(--wall-surface, 30%), transparent);\n  --surface-2: color-mix(in oklab, oklch(0.165 ...) calc(var(--wall-surface, 30%) - 6%), transparent);\n}\n```\n\n**所以判据要再升一级:不是看「我有没有往 transparent 里混」,而是看「我引用的这个变量在别的模式下会不会被改掉」。** 写任何依赖不透明度的背景前,先 `grep 'body.wall-glass'` 看一眼被覆写的变量清单;凡是**内容会从它底下经过**的浮层(吸顶条、下拉菜单、悬浮工具条),一律不能跟随玻璃档,直接写死不透明基色 —— 仓库里 `.dd-menu` 是现成先例,它的注释已经把理由写清楚了,照抄即可。\n\n三次的共同点值得单独记一句:**每一次我都\"按上一次的教训\"做了防护,每一次防护都差一层。** 默认配置验收 → 加了「开壁纸再看」→ 只测了 glass 档 → 三档全测 → 用了不透明 token → token 被重定义。这条经验的正确用法不是记住某个具体修法,而是**壁纸相关的改动一律真机开壁纸三档全看一遍**,别相信任何形式的静态推理。\n\n**2026-09-03 第四次,而且这次的差集是我自己刚加进去的:** 设置面板(PR#46)新增「正文字号」三档,\n实现是改 `<html>` 的 font-size 让整站 rem 等比缩放。合并后用户截图报侧栏左下角「设置」二字**竖排**、\n壁纸状态换行 —— 根因是 `.app` 的侧栏列宽硬编码 `226px`,**不跟着 rem 走**,字号一放大内容就溢出。\n默认字号下完全正常,所以整个验收流程(含三档壁纸全看)都没撞见。\n\n**新增的判据:凡是加了「改变全局渲染参数」的设置项(字号、缩放、密度、深浅色),\n就等于给整个 UI 引入了一个新的验收维度,所有硬编码 px 的尺寸都是潜在受害者。**\n做法:加完这类设置后立刻 `grep -n \"grid-template-columns: [0-9]\\+px\\|width: [0-9]\\{3,\\}px\"`\n把固定尺寸列一遍,在新设置的极端档位下逐个看;别指望默认档的验收能覆盖到。\n修法上优先让容器也用 rem(取值要让默认档**逐像素不变**,如 226px → `14.125rem`,\n取整成 14rem 会让默认布局悄悄挪 2px);其次才是给内部元素加 `flex: none` / `ellipsis` 兜底。\n\n顺带一条 flex 常识,这次是它让「设置」竖排的:**元素里的裸文本节点会成为匿名 flex item,\n能被压缩到一个字宽**。要它不参与压缩必须包成元素再给 `flex: none`,光给容器加 `nowrap` 管不到它。\n\n**2026-09-10 第五次,这次是在原型阶段就被自己的实测拦下的:** 给「快速提问」标记配底色时,\n我照着上面第三次的教训**把底色混进了不透明基色 `var(--surface)`** —— 自以为已经防住了,\n一量玻璃档还是 **1.16:1**。因为 `body.wall-glass` 重定义的正是 `--surface` 本身,\n「混进不透明基色」这个动作没错,错在**我引用的那个变量在玻璃档下已经不是不透明的了**。\n修法是把不透明原值立成独立 token `--surface-opaque`(玻璃档不重定义它),\n`.dd-menu` / `.stg-modal` 原先各自硬编码同一个字面值,一并收敛过去。\n\n**所以这条经验的最终形态是:凡是「必须挡住背景」的底色,不要引用任何会被模式覆写的变量,\n引用那个明确承诺不被覆写的 token。** 判断方法只有一个——**在三档壁纸下用 canvas 实测**\n(见 [[oklch-contrast-measurement]]),静态推理连续五次都没拦住。\n\n相关：[[prototype-inline-real-css]]、[[oklch-contrast-measurement]]、[[webkit-hidden-element-focus-retention]]、[[flex-wrap-breaks-before-shrink]]", "links": ["oklch-contrast-measurement", "prototype-inline-real-css", "oklch-contrast-measurement", "webkit-hidden-element-focus-retention", "flex-wrap-breaks-before-shrink"]}, {"name": "webkit-hidden-element-focus-retention", "description": "WebKit(Safari/WKWebView/Tauri·Pake 壳)不会清除被 display:none 隐藏元素的焦点，Chrome 会——键盘守卫类代码必须校验可见性，否则表现为「壳内快捷键全失灵、网页端正常」", "type": "feedback", "project": "xuanji", "projectPath": "~/xuanji", "file": "~/.claude/projects/…/memory/webkit-hidden-element-focus-retention.md", "body": "判断「事件目标是不是用户正在打字的输入框」时，**只看 tagName 不够，必须同时校验元素可见**（`el.getClientRects().length > 0`）。同理，用 `display:none` 切换视图且组件常驻挂载的应用，切换时应主动 `blur()` 掉残留在隐藏元素上的焦点。\n\n**Why:** Chrome 在元素被隐藏时会自动把焦点收回 body，WebKit 不会——焦点原地留在看不见的元素上。于是所有后续 keydown 的 `target` 都是那个隐藏输入框，形如 `isTypingTarget(e.target) && return` 的快捷键守卫会把全部按键判为「正在打字」而让位，快捷键集体失灵。因为只有 WebKit 有这个行为，症状必然是**壳/Safari 里坏、Chrome 网页端好**，极易被误判成打包工具、缓存或构建产物的问题。\n\n**How to apply:** 遇到「桌面壳里键盘快捷键失灵、同一份前端在浏览器里正常」，**先查 `document.activeElement` 是不是一个 `getClientRects().length === 0` 的元素**，再去怀疑构建、缓存或壳版本。诊断这类问题时，用户描述的状态相关规律（「做了 X 就恢复、做了 Y 又坏」）通常直接指向焦点/状态残留，比读代码推理更快锁定方向——璇玑这次「发条消息就恢复、新起一轮对话又坏」正是 composer 得失焦点的映射，而在此之前已连续两轮改错了地方。完整经过见收口卡 `~/.claude/worklog/2026/08/2026-08-11-xuanji-board-space-key-dead.md`。", "links": []}, {"name": "wkwebview-drops-mouseup", "description": "Pake 壳(WKWebView)偶发丢 mouseup,只靠 mouseup 收尾的拖拽(xterm 选区等)会粘在鼠标上;兜底看 mousemove 的 buttons 补发;另 Safari 17 不认 scrollbar-width", "type": "project", "project": "xuanji", "projectPath": "~/xuanji", "file": "~/.claude/projects/…/memory/wkwebview-drops-mouseup.md", "body": "2026-09-24 PR#90:xterm.js 拖选松手后移动鼠标仍在扩选区,只在 Pake 壳出现,Chrome 不复现。xterm 的 SelectionService 只靠\ndocument 上的 mouseup 移除 mousemove 监听,mousemove 里不检查 `e.buttons`——mouseup 丢一次就一直粘着。\n\n**Why:** WebKit 丢事件的根因在本机取不到证(Playwright WebKit Bus error),但 shared.tsx 早有「触控板轻点 WKWebView 只派发 pointerup」的记录,同一类行为。\n\n**How to apply:**\n- 璇玑里任何「按下→拖→松开」交互都别只信 mouseup:mousemove 时 `(e.buttons & 1) === 0` 即视为已松开;只来 pointerup 时下一个 task 还没见 mouseup 就补发。\n- 验证用 CDP `Input.dispatchMouseEvent`:按下、拖动、**不发 mouseReleased**、再以 buttons=0 移动——能稳定复现「丢 mouseup」,做 A/B。\n- 同批次顺带:Safari 17(Pake 内核)不支持 `scrollbar-width`,隐藏滚动条要同时写 `::-webkit-scrollbar{display:none}`;元素只超出 1px 也会冒出滚动条,`overflow-x:auto` 会连带 overflow-y 变 auto。\n- 相关:[[webkit-hidden-element-focus-retention]] [[ua-default-needs-scheme-declaration]] [[xterm-cursor-blink-killed-by-terminfo]]", "links": ["webkit-hidden-element-focus-retention", "ua-default-needs-scheme-declaration", "xterm-cursor-blink-killed-by-terminfo"]}, {"name": "wkwebview-smart-dash-substitution", "description": "Pake 壳(WKWebView)里的输入框继承 macOS 智能破折号/引号替换,终端里 -- 变成 —,命令报参数个数错", "type": "project", "project": "xuanji", "projectPath": "~/xuanji", "file": "~/.claude/projects/…/memory/wkwebview-smart-dash-substitution.md", "body": "璇玑 Pake 壳(bundle id `com.pake.1bfe8f`)是 WKWebView,会执行 macOS 全局的智能破折号/智能引号替换;Chrome 与 Ghostty 不会。2026-11-03 实测:璇玑终端执行 `glab auth login --hostname x` 报 `Accepts 0 arg(s), received 2`,`~/.zsh_history` 里实际字节是 E2 80 94(—)。\n\n**Why:** 症状看起来像「输出被吞 / 命令行为异常」,实际是输入在进 pty 前已被改写。\n**How to apply:** 「璇玑里命令行为与本地终端不同」先 `grep -a ~/.zsh_history | cat -v` 看 shell 实际收到的字节。已对该 App 单独关闭:`defaults write com.pake.1bfe8f NSAutomaticDashSubstitutionEnabled -bool false`(Quote 同理),需 ⌘Q 重启壳生效;壳重新打包若 bundle id 变化需重设。相关 [[wkwebview-drops-mouseup]]。", "links": ["wkwebview-drops-mouseup"]}, {"name": "worktree-node-version-native-modules", "description": "worktree 里 agent 用自己 shell 的 Node(nvm 20)装依赖,用户终端是 Node 22——native 模块(better-sqlite3 等)按 NODE_MODULE_VERSION 编译,交付后用户一跑脚本就 ERR_DLOPEN_FAILED;装依赖或交付含 native 依赖的可执行环境前,先对齐用户默认 Node 版本", "type": "feedback", "project": "xuanji", "projectPath": "~/xuanji", "file": "~/.claude/projects/…/memory/worktree-node-version-native-modules.md", "body": "在 worktree 里 `pnpm install` 后交付给用户跑(preview.sh / restart.sh / 任何 node 脚本)时,如果依赖里有 native 模块(better-sqlite3、node-gyp 编译产物),二进制是按**当前 shell 的 Node ABI**(NODE_MODULE_VERSION)编译的。agent 的 shell 走 nvm 默认(本机是 v20.13.1 → ABI 115),用户终端默认 Node 22(ABI 127),用户一执行就 `ERR_DLOPEN_FAILED: compiled against a different Node.js version`。\n\n**Why:** 2026-08-27 验收面板交付时实际发生:我在 worktree 里装依赖、跑测试、起 preview 全部正常(都在我 Node 20 的 shell 里),用户自己跑 `./preview.sh` 当场炸在 better-sqlite3 加载。同一个 worktree、同一份 node_modules,炸不炸取决于谁的 shell 在跑。\n\n**How to apply:**\n1. 交付「用户会亲手执行」的环境前,先 `ls ~/.nvm/versions/node/` 确认用户可用版本,用用户默认版本(通常是最新的或 .nvmrc 指定的)重装/重编译:`PATH=\"$HOME/.nvm/versions/node/<用户版本>/bin:$PATH\" pnpm rebuild <native包>`,并用同一 PATH `node -e \"require('<包>')\"` 验证加载。\n2. 反向也成立:rebuild 成用户版本后,agent 自己的 shell 再跑 vitest 会反过来炸,需要再 rebuild 回来——同一 worktree 的 native 二进制只能伺候一个 ABI,交付边界上要意识到「现在这份是编译给谁的」。\n3. 最稳的根治是项目根放 `.nvmrc` 并让启动脚本(preview.sh 等)自己 `nvm use`/校验版本,但那是项目级改动,须用户同意。\n\n**2026-09-18 追加:还有一层「架构」,且在派发会话里可能完全无解。** agent shell 的 node 未必与宿主同架构——本机 `/usr/local/bin/node` 是 **x86_64**(Rosetta),`~/.nvm/versions/node/` 里 v20.13.1/v22.22.3/v24.15.0 是 arm64、v24.16.0/v24.18.0/v24.21.0 是 x86_64,**同一 nvm 下版本号相邻的两个 node 架构可能不同**,选版本时要 `file $(which node)` 先看一眼。这次四条路全试过都不通:本地重编(x86 node 的 node-gyp 在 python 版本探测处挂)→ 从主工作区 cp node_modules(arm64 二进制 vs x86 node,`incompatible architecture`)→ 换 arm64 node 22(ABI 115 vs 127)→ 换 arm64 node 20(sqlite 过了但 esbuild 变成装错平台的 darwin-x64,是先前那次 x86 install 留下的)。\n\n**How to apply(补):** 纯前端改动不必为此卡住——退化成「只起 worktree 的 vite dev server + 后端指向常驻 :7777 + 全程只读不做写操作」即可拿到端到端证据,在交付说明里写明退化原因与「只看不改」的约束。真要隔离后端时才值得去啃 rebuild,或交给非派发会话跑 `preview.sh`。\n\n相关:[[prototype-inline-real-css]](同为「在 agent 环境里一切正常、到用户手里才炸」的一族)", "links": ["prototype-inline-real-css"]}, {"name": "xterm-cursor-blink-killed-by-terminfo", "description": "xterm.js 设了 cursorBlink 光标却不闪——TERM=xterm-256color 的 terminfo cnorm 自带 ESC[?12l,zsh 一启动就把闪烁关了;要在 parser 上吞掉 ?12h/?12l", "type": "project", "project": "xuanji", "projectPath": "~/xuanji", "file": "~/.claude/projects/…/memory/xterm-cursor-blink-killed-by-terminfo.md", "body": "2026-09-24 璇玑内嵌终端(PR#89):`cursorBlink: true` 光标照样不闪,Ghostty 里却闪。\n\n根因:xterm-256color 的 terminfo `cnorm` = `\\E[?12l\\E[?25h`,zsh 行编辑器每次输出 cnorm 就发一次 DECRST 12,\nxterm.js 的 `decPrivateModes.cursorBlink` 优先级高于 `options.cursorBlink`。Ghostty 用自己的 `xterm-ghostty`\n描述,cnorm 不带 ?12l,所以那边闪。\n\n**Why:** 第一版只拦了 DECSCUSR(`CSI Ps SP q`),以为是 p10k 发了稳定光标,复测照样不闪;直到用真 pty 起用户登录 shell 抓原始输出才看到是 `ESC[?12l`。\n\n**How to apply:**\n- 「终端设置不生效」先在 pty 里抓 shell 的原始输出,按序列类型点名,别凭印象猜是哪个插件。\n- xterm.js 修法:`term.parser.registerCsiHandler({prefix:'?', final:'l'|'h'}, p => p.length===1 && p[0]===12)` 吞掉单独的 ?12;DECSCUSR 另拦,只接形状不接闪烁。\n- 复测必须用**新开的会话**:重连会回放旧缓冲,旧的私有模式状态会让「修复后」看起来还没好。\n- 相关:[[xuanji-pty-shell-arch]](同一功能里 x86_64 登录 shell 被强制 arm64 的坑)", "links": ["xuanji-pty-shell-arch"]}, {"name": "xuanji-mobile-remote-access", "description": "璇玑 Android APK 是 Capacitor 远程加载壳（走 Tailscale serve 私网访问，非公网），前后端改动生效不用重装 APK；有黑屏与高延迟两个已知现象及诊断法", "type": "project", "project": "xuanji", "projectPath": "~/xuanji", "file": "~/.claude/projects/…/memory/xuanji-mobile-remote-access.md", "body": "璇玑手机端（`code/mobile/`）是 Capacitor 包的**远程加载壳**，不是把前端打包进 APK：\n\n- `code/mobile/capacitor.config.json` 的 `server.url` 指向 Tailscale MagicDNS 域名（`https://<hostname>.<tailnet>.ts.net`），WebView 直接加载这个远程页面；`code/mobile/www/index.html` 只是占位页，永远不会被展示。\n- 后端 `code/backend/src/index.ts` 用 Hono `serveStatic` 把 `code/frontend/dist` 挂到 `127.0.0.1:7777`；`tailscale serve` 把这个端口代理到上面的域名，**`tailnet only`**（`tailscale serve status` 可查），不是 `funnel`，即只有加入同一 tailnet 的设备能连到，不对公网暴露。\n- 后端**没有任何 app 层鉴权**（grep 不到 auth/token 中间件），访问控制完全靠\"是否在这个 tailnet 里\"——这是当初 product-plan.md 里\"内网访问用 Tailscale 而不是自己写 auth\"的决策结果，不是遗漏。\n\n**推论：多数改动不需要重新打包/重装 APK**，只有动到原生壳层才需要：\n- 需要重装：改 `capacitor.config.json`（appId/server.url/cleartext）、改 `code/mobile/android/` 原生代码/权限/图标/Manifest、升级 Capacitor 核心或插件\n- 不需要：`code/frontend`、`code/backend` 的任何改动——重建前端 + 重启后端，手机端刷新/重开页面即生效\n\n**部署链路两个强约束**：\n1. launchd 服务 `com.xuanji.backend` 的 `WorkingDirectory` 固定指向**主工作区**（`/Users/lilithgames/xuanji/code/backend`），不是任何 feature/fix worktree——改动必须先合并到主工作区当前所在分支（这个项目是 main，`restart.sh` 跑的就是这个目录）才会被捡起。\n2. `XUANJI_DISPATCH=1` 的派发会话**禁止**重启后端（`restart.sh` 已经会检测这个环境变量并直接拒绝执行）——\"重启后端使改动生效\"这一步永远要留给用户或非派发会话手动执行。\n\n**两个已知现象，遇到不用怀疑代码坏了**：\n- **重新部署后手机端短暂黑屏**：`vite build` 产物文件名带 content hash，重新构建后 hash 变了；手机 WebView 缓存的旧 `index.html` 还引用着已经不存在的旧 JS/CSS，加载 404 只剩深色背景。手动刷新/重开 App 拉到新 `index.html` 即恢复，一次性现象。根治可选项：给 `index.html` 响应加 `no-cache`，`assets/` 下带 hash 的文件继续长缓存（截至 2026-07-17 尚未做）。\n- **手机在公司/家里连接慢（几秒到十几秒）**：如果手机与 Mac 之间 NAT 打洞失败（常见于公司网络防火墙拦 UDP），Tailscale 会退化成走 DERP 中继服务器，RTT 可能到 400ms+ 量级，首屏几百 KB 的 JS/CSS 在这个延迟下加载慢是物理规律，不是 bug。诊断命令：`tailscale ping <peer>` 看是 `via DERP(xxx)` 还是直连，`tailscale status` 看 `relay \"xxx\"` 字段。是否能改善不受本地控制，取决于对端网络是否放行 UDP 41641。\n\n**手机离开 Mac 所在网络（如周末在家访问公司 Mac）时的前提条件**：Mac 得保持开机、用户 session 登录、联网、Tailscale 连接（笔记本合盖睡眠是最常见的失败点）；手机端 Tailscale 也要保持连接状态。launchd 的 `RunAtLoad` + `KeepAlive` 会在 Mac 醒着的前提下自动拉起/保活后端，不用手动管。", "links": []}, {"name": "xuanji-pr-squash-merge", "description": "璇玑的 PR 在 GitHub 上走 squash 合并，任何直接提交在本地 dev 的 commit 合并后都会变成孤儿并卡住 ff-only pull；文档/原型也必须走分支", "type": "project", "project": "xuanji", "projectPath": "~/xuanji", "file": "~/.claude/projects/…/memory/xuanji-pr-squash-merge.md", "body": "璇玑(xuanji)的 PR 在 GitHub 上一律**squash 合并**(PR#19/#20/#21/#22/#24 均如此,集成分支是 `dev` 而非 main)。\n\n**后果**:任何直接提交在本地 `dev` 上的 commit,即使它作为祖先被包含在 feature 分支里、内容已随 squash 进入远端,该 commit 对象本身**不是** `origin/dev` 的祖先。于是本地 dev 与远端分叉,`git pull --ff-only` 报 `fatal: Not possible to fast-forward, aborting.`。\n\n**Why**:squash 把整条分支压成一个全新 commit,原分支上的所有 commit id 全部作废。全局 R6 说主工作区只做集成、开发一律在 worktree 分支,在 squash 仓库里这条不只是规范洁癖——违反它会直接把本地集成分支搞分叉。\n\n**How to apply**:\n1. **文档、原型这类\"看着无害\"的改动同样走分支**。别因为\"只是个 html 原型\"就直接提交在 dev 上——这正是踩坑的实际路径([[prototype-inline-real-css]] 提到的原型文件就是这么被提交的)。\n2. 已经踩了要清理时,**先证明本地 commit 的内容确已进入远端再重置**,不要上来就 `reset --hard`:\n   - `git diff <(git show origin/dev:<file>) <(git show dev:<file>)` 逐文件比对内容\n   - `git log --oneline origin/dev..dev` 确认没有其它本地独有的 commit\n   - `git status --porcelain` 确认工作区干净\n   - 三者都过,才 `git reset --hard origin/dev`\n3. **`git branch --no-merged dev` 在 squash 仓库里会虚报**:内容已合并的分支因为 commit id 变了,仍会被列成\"未合并\"。判断一个分支是否真的合并完,要看**内容**(文件是否已在 dev 里、PR 是否 merged),不能只信这条命令的输出——本仓库长期积压的几个\"未合并\"分支里就有已经合并掉的。\n\n相关:[[xuanji-mobile-remote-access]](合并到主工作区分支才会被 `restart.sh` 捡起)。", "links": ["prototype-inline-real-css", "xuanji-mobile-remote-access"]}, {"name": "xuanji-pty-shell-arch", "description": "璇玑起 shell 不能一律 arch -arm64——用户登录 shell 是 x86_64 的旧 Homebrew zsh,强制会 Bad CPU type;优先跟随 Ghostty 的 command,否则 lipo 查切片再决定", "type": "project", "project": "xuanji", "projectPath": "~/xuanji", "file": "~/.claude/projects/…/memory/xuanji-pty-shell-arch.md", "body": "2026-09-24 内嵌终端端到端时,终端一呼出就退出:`arch: posix_spawnp: /usr/local/bin/zsh: Bad CPU type in executable`。\n\n本机事实:`dscl` 里 UserShell = `/usr/local/bin/zsh`(仅 x86_64),`/bin/zsh` 是 universal(x86_64 arm64e);\n用户 Ghostty 配了 `command = /usr/bin/arch -arm64 /bin/zsh --login` 正是为了绕开它。launchd 下 SHELL 未设,\n`os.userInfo().shell` 拿到的就是那个 x86 zsh。另外预览环境经 `pnpm start` 起后端,`npm_config_prefix` 等会漏进 shell,nvm 直接报不兼容。\n\n**Why:** 单测用 /bin/bash 全绿,真用户 shell 一跑就挂;只有端到端才暴露。\n\n**How to apply:**\n- 起用户 shell 优先照抄用户终端(Ghostty `command`)的启动方式;没有时 `lipo -archs` 含 arm64 才包 `arch -arm64`。\n- 子进程环境剥掉 `npm_*` / `PNPM_*` / `INIT_CWD` 与 claude 注入的变量,补 TERM/COLORTERM/LANG。\n- 涉及用户 shell 的功能,验收必须在真实登录 shell 上跑一遍,别只用 /bin/sh 或 bash 冒烟。\n- 相关:[[worktree-node-version-native-modules]] [[xterm-cursor-blink-killed-by-terminfo]]", "links": ["worktree-node-version-native-modules", "xterm-cursor-blink-killed-by-terminfo"]}, {"name": "xuanji-worktree-install-per-package", "description": "璇玑 code/ 不是 pnpm workspace 根，在那里 pnpm install 会 exit 0 却什么都不装；新 worktree 要分别进 code/frontend、code/backend 装", "type": "project", "project": "xuanji", "projectPath": "~/xuanji", "file": "~/.claude/projects/…/memory/xuanji-worktree-install-per-package.md", "body": "璇玑仓库 `code/` 目录下没有 package.json / pnpm-workspace.yaml，前后端是两个独立 pnpm 包。在 `code/` 跑 `pnpm install` 会静默成功（exit 0）但不产生任何 node_modules，随后 `pnpm exec tsc` 报 \"Command not found\"。\n\n**Why:** 2026-09-15 在新 worktree 里后台跑 install 看到 exit=0 就当装好了，质量门三条命令全部 \"not found\" 才发现装在了错误目录。\n\n**How to apply:** 新建 worktree 后分别 `cd code/frontend && pnpm install --frozen-lockfile` 和 `cd code/backend && pnpm install --frozen-lockfile`；判断「装好了」看 `ls node_modules/.bin/vitest`，别看 exit code。后端 native 依赖的 Node 版本问题见 [[worktree-node-version-native-modules]]。", "links": ["worktree-node-version-native-modules"]}, {"name": "skill-desc-trigger-words", "description": "技能描述里的触发词要覆盖口语说法,只写正式名称会漏触发", "type": "feedback", "project": "antifraud_skills", "projectPath": "~/antifraud_skills", "file": "~/.claude/projects/…/memory/skill-desc-trigger-words.md", "body": "技能描述里的触发词要覆盖口语说法,只写正式名称会漏触发。\n\n**Why:** (示意条目:公开仓库版不内嵌其它项目的真实经验正文。)\n\n**How to apply:** 本地审阅时会自动加载同目录下的全量数据文件。", "links": []}, {"name": "daily-report-card-layout", "description": "日报卡片首页只放指标网格,详情走下拉切页,避免单卡超长被折叠", "type": "project", "project": "ant
