.type-user      { color: var(--blue);  background: var(--tint-blue); }
.type-feedback  { color: var(--amber); background: var(--tint-amber); }
.type-project   { color: var(--jade);  background: var(--tint-jade); }
.type-reference { color: var(--muted); background: var(--tint-muted); }
.type-cross-project { color: var(--violet); background: var(--tint-violet); }

.mem-body { font-size: 0.8125rem; max-width: 68ch; text-wrap: pretty; }
.mem-body p { margin-bottom: 10px; }
.mem-body .wl { font-weight: 600; color: var(--muted); }
.wikilink {
  display: inline-flex; align-items: center; gap: 3px;
  font-family: var(--mono); font-size: 0.75rem; color: var(--jade);
  background: var(--tint-jade); border-radius: 4px; padding: 0 6px; cursor: pointer;
  transition: background 150ms var(--ease);
}
.wikilink:hover { background: color-mix(in oklab, var(--jade) 24%, transparent); }

/* ============ 定时 ============ */
.cron-item { border-bottom: 1px solid var(--line-soft); }
.cron-item:last-child { border-bottom: none; }
.cron-row { display: flex; align-items: center; gap: 14px; padding: 13px 18px; cursor: pointer; transition: background 120ms var(--ease); }
.cron-row:hover { background: var(--hover); }
.cron-row .kind { font-family: var(--mono); font-size: 0.6875rem; color: var(--muted); background: var(--surface-2); border: 1px solid var(--line-soft); border-radius: 4px; padding: 1px 7px; white-space: nowrap; }
.cron-row .name { font-weight: 600; font-size: 0.8125rem; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cron-row .when { font-size: 0.75rem; margin-left: auto; white-space: nowrap; display: flex; align-items: center; gap: 6px; }
.cron-row .when .clock { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.cron-row .when .rel { color: var(--faint); }
.cron-detail { display: none; padding: 4px 18px 16px 18px; }
.cron-item.open .cron-detail { display: block; }
.cron-detail .prompt {
  font-family: var(--mono); font-size: 0.75rem; color: var(--muted);
  background: var(--surface-2); border: 1px solid var(--line-soft); border-radius: var(--r-s);
  padding: 10px 14px; margin-bottom: 12px; white-space: pre-wrap;
}
.cron-meta { display: flex; gap: 18px; flex-wrap: wrap; font-size: 0.75rem; color: var(--muted); margin-bottom: 12px; }
.cron-meta b { color: var(--ink); font-weight: 600; }
.runs { width: 100%; border-collapse: collapse; font-size: 0.75rem; }
.runs th { text-align: left; color: var(--faint); font-weight: 600; padding: 5px 10px; border-bottom: 1px solid var(--line-soft); }
.runs td { padding: 6px 10px; border-bottom: 1px solid var(--line-soft); color: var(--muted); vertical-align: top; }
.runs td:first-child { font-family: var(--mono); }
.runs tr:last-child td { border-bottom: none; }
.runs .sid { font-family: var(--mono); color: var(--blue); text-decoration: none; cursor: pointer; background: none; border: none; padding: 0; font-size: inherit; }
.runs .sid:hover { text-decoration: underline; }
.runs-more { display: block; font-size: 0.6875rem; color: var(--faint); padding: 8px 10px 0; background: none; border: none; cursor: pointer; text-align: left; }
.runs-more:hover { color: var(--ink); }
.fuse-note { display: flex; align-items: center; gap: 8px; font-size: 0.75rem; color: var(--red); background: var(--tint-red); border-radius: var(--r-s); padding: 7px 12px; margin-bottom: 12px; }
.notice-amber { display: flex; align-items: center; gap: 8px; font-size: 0.75rem; color: var(--amber); background: var(--tint-amber); border-radius: var(--r-s); padding: 7px 12px; margin-bottom: 12px; }
/* 折叠行上的近 7 期状态点(周期任务,不展开也能扫出好坏,左旧右新) */
.runline { display: inline-flex; align-items: center; gap: 3px; }
.runline i { width: 6px; height: 6px; border-radius: 50%; background: var(--tint-muted); font-style: normal; }
.runline i.g { background: var(--green); }
.runline i.r { background: var(--red); }
.runline i.a { background: var(--amber); }

/* 居中模态(新建/编辑定时任务;区别于侧滑抽屉,复用 .backdrop) */
.modal {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%, -46%);
  width: min(560px, calc(100vw - 40px)); max-height: calc(100vh - 60px); overflow-y: auto;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-m);
  box-shadow: 0 8px 24px oklch(0.05 0 0 / 0.5);
  opacity: 0; pointer-events: none; transition: opacity 180ms var(--ease), transform 180ms var(--ease);
  z-index: var(--z-drawer);
}
.modal.show { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%); }
.modal-head { display: flex; align-items: center; gap: 10px; padding: 16px 20px; border-bottom: 1px solid var(--line-soft); position: sticky; top: 0; background: var(--surface); }
.modal-head h2 { font-size: 0.9375rem; }
.modal-body { padding: 18px 20px 20px; }
.modal-foot { display: flex; align-items: center; gap: 10px; padding: 14px 20px 18px; border-top: 1px solid var(--line-soft); }
.mfield { margin-bottom: 16px; }
.mfield > label { display: block; font-size: 0.6875rem; font-weight: 600; color: var(--faint); text-transform: uppercase; letter-spacing: 0.04em; margin-bottom: 6px; }
.mfield .hint { font-size: 0.6875rem; color: var(--faint); margin-top: 5px; }
.mfield textarea.input { width: 100%; resize: vertical; line-height: 1.55; font-family: var(--mono); font-size: 0.75rem; }
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.time-chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
.time-chips button { padding: 4px 12px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface-2); color: var(--muted); font-size: 0.75rem; transition: all 140ms var(--ease); }
.time-chips button:hover { border-color: var(--muted); color: var(--ink); }
.time-chips button.active { background: var(--tint-jade); border-color: var(--jade); color: var(--jade); font-weight: 600; }
.seg { display: inline-flex; gap: 2px; background: var(--surface-2); border: 1px solid var(--line-soft); border-radius: var(--r-s); padding: 2px; }
.seg button { padding: 5px 16px; border-radius: 4px; font-size: 0.75rem; color: var(--muted); }
.seg button.active { background: var(--hover); color: var(--ink); font-weight: 600; }
.msummary { font-size: 0.75rem; color: var(--muted); }
.msummary b { color: var(--jade); font-weight: 600; }

.sys-note { font-size: 0.75rem; color: var(--faint); padding: 10px 18px 4px; }

/* ============ 总结(wrapup 任务总结卡) ============ */
/* 日期分组头:mono 小字当「机器的话」,不与任务标题争字重 */
.wl-group > h2 { font-size: 0.75rem; color: var(--faint); font-weight: 600; font-family: var(--mono); padding: 12px 18px 4px; }
.wl-item {
  display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
  padding: 10px 18px; border-bottom: 1px solid var(--line-soft);
  background: none; border-left: none; border-right: none; border-top: none;
  cursor: pointer; transition: background 120ms var(--ease);
}
.wl-item:hover { background: var(--hover); }
.wl-group:last-child .wl-item:last-child { border-bottom: none; }
.wl-item .task { font-size: 0.8125rem; color: var(--ink); font-weight: 600; min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wl-item .anchors { font-family: var(--mono); font-size: 0.6875rem; color: var(--faint); flex: none; white-space: nowrap; }
.wl-sep { border-top: 1px solid var(--line-soft); }
/* 已知残留:抽屉里置顶的琥珀块——「需要你回来处理」的唯一视觉承载 */
.residue {
  border: 1px solid color-mix(in oklab, var(--amber) 35%, transparent);
  background: var(--tint-amber); border-radius: var(--r-s);
  padding: 10px 14px; margin: 8px 0 16px;
}
.residue .r-head { font-size: 0.6875rem; font-weight: 600; color: var(--amber); margin-bottom: 4px; }
.wl-body { font-size: 0.8125rem; max-width: 68ch; }
.wl-body h3 { font-size: 0.8125rem; color: var(--ink); margin: 16px 0 6px; }
.wl-body h3:first-child { margin-top: 0; }
.wl-body p, .wl-body li { color: var(--muted); text-wrap: pretty; margin-bottom: 6px; }
.wl-body ul { padding-left: 18px; }
.wl-body .file { font-family: var(--mono); font-size: 0.75rem; color: var(--ink); }
.wl-body pre { font-family: var(--mono); font-size: 0.75rem; color: var(--muted); white-space: pre-wrap; }
/* 会话锚点:蓝=纯信息(路径/id),点开只读回放 */
.sid-link { font-family: var(--mono); font-size: 0.8125rem; color: var(--blue); background: none; border: none; padding: 0; cursor: pointer; }
.sid-link:hover { text-decoration: underline; }

/* ============ 待办(自有收集箱) ============ */
/* 速记行:本页第一动作,放大一号、玉色 focus,与列表拉开层级 */
.td-capture {
  display: flex; align-items: center; gap: 10px; margin-bottom: 18px;
  border: 1px solid var(--line); border-radius: var(--r-m); background: var(--surface);
  padding: 4px 6px 4px 16px; transition: border-color 150ms var(--ease);
}
.td-capture:focus-within { border-color: var(--jade); }
.td-capture .plus { color: var(--faint); font-size: 1rem; line-height: 1; flex: none; }
.td-capture .input { flex: 1; min-width: 0; background: none; border: none; padding: 8px 0; font-size: 0.875rem; }
.td-capture .input:hover, .td-capture .input:focus { border-color: transparent; outline: none; }
.td-capture .hint { font-family: var(--mono); font-size: 0.625rem; color: var(--faint); flex: none; padding-right: 8px; }
.td-proj-pick {
  font-family: var(--mono); font-size: 0.6875rem; color: var(--muted); flex: none;
  border: 1px solid var(--line); border-radius: 4px; padding: 2px 9px;
  transition: color 150ms var(--ease), border-color 150ms var(--ease);
}
.td-proj-pick:hover { border-color: var(--muted); color: var(--ink); }

.td-group > h2 { font-size: 0.75rem; color: var(--faint); font-weight: 600; font-family: var(--mono); padding: 12px 18px 4px; }
.td-item {
  display: flex; align-items: center; gap: 12px; width: 100%;
  padding: 10px 18px; border-bottom: 1px solid var(--line-soft);
  transition: background 120ms var(--ease);
}
.td-item:hover { background: var(--hover); }
.td-group:last-child .td-item:last-child { border-bottom: none; }
.td-item .title { font-size: 0.8125rem; color: var(--ink); min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.td-item.done .title { color: var(--faint); text-decoration: line-through; }
.td-item .age { font-size: 0.6875rem; color: var(--faint); flex: none; }
.td-noproj { font-family: var(--mono); font-size: 0.6875rem; color: var(--faint); flex: none; }
.td-item.kb-sel { background: var(--hover); outline: 2px solid var(--jade); outline-offset: -2px; }
.td-item.kb-sel .td-del { opacity: 1; }
.td-edit-input { flex: 1; min-width: 0; font-size: 0.8125rem; padding: 2px 8px; }
/* 勾选框:未完成时中性描边(--line 在深色底上几乎看不见,故用 --faint),悬停才透出绿意 */
.td-item .chk {
  width: 16px; height: 16px; border-radius: 4px; border: 1.5px solid var(--faint);
  flex: none; display: grid; place-items: center; color: transparent; font-size: 0.6875rem;
  transition: border-color 150ms var(--ease), color 150ms var(--ease), background 150ms var(--ease);
}
.td-item .chk:hover { border-color: var(--green); color: var(--green); }
.td-item.done .chk { border-color: var(--green); background: var(--tint-green); color: var(--green); }
/* 开工:行内主操作。默认灰框、悬停行时才染玉——玉色稀缺,不整列常亮 */
.td-go {
  display: inline-flex; align-items: center; gap: 5px; flex: none;
  padding: 3px 11px; border-radius: var(--r-s); border: 1px solid var(--line);
  color: var(--muted); font-size: 0.75rem; font-weight: 600;
  transition: color 150ms var(--ease), border-color 150ms var(--ease), background 150ms var(--ease);
}
.td-go:hover { border-color: var(--jade); color: var(--jade); background: var(--tint-jade); }
.td-del { flex: none; color: var(--faint); padding: 2px 6px; border-radius: var(--r-s); opacity: 0; transition: opacity 150ms var(--ease), color 150ms var(--ease); }
.td-item:hover .td-del { opacity: 1; }
.td-del:hover { color: var(--red); }

/* 仪表盘待办卡(dash-now 之下、统计条之上) */
.dash-todos { margin-bottom: 16px; }
.dash-todo-item { display: flex; align-items: center; gap: 10px; padding: 9px 18px; border-bottom: 1px solid var(--line-soft); font-size: 0.8125rem; transition: background 120ms var(--ease); }
.dash-todo-item:hover { background: var(--hover); }
.dash-todo-item .t { min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink); }
.dash-todo-item .age { font-size: 0.6875rem; color: var(--faint); flex: none; }
.dash-todo-foot { padding: 10px 18px; font-size: 0.75rem; }
.dash-todo-foot button { color: var(--blue); }
.dash-todo-foot button:hover { text-decoration: underline; }

/* 速记浮层(⌘J):顶部偏上 22vh —— Spotlight 位置的肌肉记忆,并给项目下拉留出展开空间 */
.tp-box {
  position: fixed; top: 22vh; left: 50%; transform: translateX(-50%);
  width: min(560px, 92vw); background: var(--surface-2); border: 1px solid var(--line);
  border-radius: var(--r-m); box-shadow: 0 16px 48px oklch(0.05 0 0 / 0.5);
  animation: tp-in 150ms var(--ease);
}
@keyframes tp-in { from { opacity: 0; transform: translate(-50%, -8px); } to { opacity: 1; transform: translateX(-50%); } }
.tp-head { display: flex; align-items: center; gap: 10px; padding: 14px 18px 0; }
.tp-head .glyph { color: var(--jade); font-size: 0.875rem; flex: none; }
.tp-title { flex: 1; min-width: 0; background: none; border: none; border-bottom: 1px solid var(--line-soft); padding: 0 0 12px; font-size: 0.9375rem; }
.tp-title:focus { outline: none; }
.tp-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 10px 18px 14px; }
.tp-row .lbl { font-size: 0.6875rem; color: var(--faint); flex: none; }
.tp-pj {
  flex: 1; min-width: 0; background: var(--surface); border: 1px solid var(--line);
  border-radius: var(--r-s); padding: 4px 10px; font-family: var(--mono); font-size: 0.75rem;
  color: var(--muted); transition: border-color 150ms var(--ease), color 150ms var(--ease);
}
.tp-pj:focus { outline: none; border-color: var(--jade); color: var(--ink); }
.tp-pj.picked { color: var(--jade); border-color: color-mix(in oklab, var(--jade) 45%, transparent); background: var(--tint-jade); }
/* 下拉走文档流(整个浮层跟着长高),不做绝对定位浮层:否则它会盖住底部快捷键条,
   用户正要选项目时恰好看不到「↩ 保存 / tab 选项目」这几条提示 */
.tp-drop {
  flex-basis: 100%; margin-left: 34px;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-s);
  max-height: 240px; overflow-y: auto;
}
.tp-opt { display: flex; align-items: baseline; gap: 10px; width: 100%; text-align: left; padding: 6px 12px; font-size: 0.75rem; transition: background 100ms var(--ease); }
.tp-opt.hl { background: var(--tint-jade); }
.tp-opt .n { font-family: var(--mono); color: var(--ink); flex: none; }
.tp-opt.hl .n { color: var(--jade); font-weight: 600; }
.tp-opt .p { font-size: 0.6875rem; color: var(--faint); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tp-opt .none-mark { color: var(--muted); }
.tp-foot { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 8px 18px; border-top: 1px solid var(--line-soft); font-size: 0.6875rem; color: var(--faint); }
.tp-foot .kbd { font-family: var(--mono); background: var(--tint-muted); border-radius: 3px; padding: 0 5px; }

/* 派发页「来自待办」横幅:说明本次会话的来路,✕ 解除关联 */
.from-todo {
  display: flex; align-items: center; gap: 10px; margin-top: 12px;
  font-size: 0.75rem; color: var(--jade); background: var(--tint-jade);
  border: 1px solid color-mix(in oklab, var(--jade) 35%, transparent);
  border-radius: var(--r-s); padding: 7px 12px;
}
.from-todo .x { margin-left: auto; color: var(--muted); padding: 0 4px; flex: none; }
.from-todo .x:hover { color: var(--ink); }

/* ============ 回顾(周活动) ============ */
.week-nav { display: flex; align-items: center; gap: 4px; }
.week-nav .range { font-family: var(--mono); font-size: 0.8125rem; color: var(--ink); font-variant-numeric: tabular-nums; padding: 0 6px; }
.week-nav .wk-btn { padding: 3px 8px; border-radius: var(--r-s); color: var(--muted); transition: background 150ms var(--ease), color 150ms var(--ease); }
.week-nav .wk-btn:hover { background: var(--hover); color: var(--ink); }
.week-nav .wk-btn:disabled { opacity: 0.35; cursor: default; background: none; }

.rv-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start; }

.rv-proj { border-bottom: 1px solid var(--line-soft); }
.rv-proj:last-child { border-bottom: none; }
.rv-proj-head { display: flex; align-items: center; gap: 10px; padding: 11px 18px 9px; font-size: 0.8125rem; }
.rv-proj-head .m { font-family: var(--mono); font-size: 0.75rem; color: var(--muted); white-space: nowrap; }
.rv-proj-head .cost { margin-left: auto; font-family: var(--mono); font-size: 0.75rem; color: var(--faint); }
.rv-sess { width: 100%; display: flex; align-items: center; gap: 8px; padding: 7px 18px 7px 28px; font-size: 0.8125rem; text-align: left; transition: background 120ms var(--ease); }
.rv-sess:hover { background: var(--hover); }
.rv-sess .chev { color: var(--faint); font-size: 0.625rem; flex: none; transition: transform 150ms var(--ease); }
.rv-item.open .rv-sess .chev { transform: rotate(90deg); }
.rv-sess .t { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rv-sess .n { font-family: var(--mono); font-size: 0.6875rem; color: var(--muted); flex: none; }
.rv-sess .span { margin-left: auto; font-family: var(--mono); font-size: 0.6875rem; color: var(--faint); flex: none; white-space: nowrap; }
.rv-prompts { display: none; margin: 2px 18px 10px 40px; border-left: 2px solid var(--line); padding: 2px 0 2px 12px; }
.rv-item.open .rv-prompts { display: block; }
.rv-prompts li { list-style: none; font-family: var(--mono); font-size: 0.71875rem; color: var(--muted); padding: 2px 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rv-prompts li.more { color: var(--faint); font-family: var(--sans); }

/* 本周总结:回顾页里的周报物料预览,一行一条,详情下钻「总结」模块 */
.rvwl-item {
  display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
  padding: 9px 18px; border-bottom: 1px solid var(--line-soft); font-size: 0.8125rem;
  background: none; border-left: none; border-right: none; border-top: none;
  cursor: pointer; transition: background 120ms var(--ease);
}
.rvwl-item:hover { background: var(--hover); }
.rvwl-item:last-child { border-bottom: none; }
.rvwl-item .d { font-family: var(--mono); font-size: 0.6875rem; color: var(--faint); flex: none; }
.rvwl-item .t { min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink); }

.draft-body { padding: 16px 20px; font-size: 0.8125rem; max-width: 68ch; }
.draft-run { display: flex; align-items: center; gap: 10px; padding: 20px; font-size: 0.8125rem; color: var(--muted); }
.draft-meta { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; font-size: 0.6875rem; color: var(--faint); padding: 10px 20px; border-top: 1px solid var(--line-soft); }

/* toast */
.toast {
  position: fixed; bottom: 24px; left: 50%; transform: translate(-50%, 80px);
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-m);
  padding: 10px 20px; font-size: 0.8125rem; z-index: var(--z-toast);
  transition: transform 240ms var(--ease), opacity 240ms var(--ease); opacity: 0;
  box-shadow: 0 8px 24px oklch(0.05 0 0 / 0.4);
}
.toast.show { transform: translate(-50%, 0); opacity: 1; }

/* ============ 壁纸 · 外观设置 ============ */
/* 壁纸开启时 body 背景转透明,底色由 html 承接;壁纸层夹在两者之间 */
html { background: var(--bg); }
#wall {
  position: fixed; inset: -48px; z-index: -1; pointer-events: none;
  background-size: cover; background-position: center;
  opacity: 0; transition: opacity 300ms var(--ease);
}
body.wall-on { background: transparent; }
body.wall-on #wall { opacity: var(--wall-opacity, 0.4); filter: blur(var(--wall-blur, 0px)); }

/* 玻璃档:表面半透明 + backdrop 模糊。仅用户显式选择,不是默认。
   表面不透明度由 --wall-surface 驱动,surface-2 恒比 surface 低一档 */
body.wall-glass {
  --surface:   color-mix(in oklab, var(--surface-opaque) var(--wall-surface, 30%), transparent);
  --surface-2: color-mix(in oklab, oklch(0.165 0.007 120) calc(var(--wall-surface, 30%) - 6%), transparent);
}
body.wall-glass :is(.sidebar, .panel, .drawer, .composer, .chat, .toast, .wall-pop, .scard, .notice) {
  backdrop-filter: blur(var(--wall-frost, 0px)) saturate(1.1);
  -webkit-backdrop-filter: blur(var(--wall-frost, 0px)) saturate(1.1);
}
/* .dd-menu 是浮在任意前景内容之上的弹出菜单(非静态外壳面板),不应跟随玻璃档变半透明——
   否则菜单会透出下方内容,干扰选项选择。固定用不透明的原始 surface 色,不随 --wall-surface 变化。 */
body.wall-glass .dd-menu {
  background: var(--surface-opaque);
  backdrop-filter: none;
  -webkit-backdrop-filter: none;
}

/* 壁纸开启时状态栏静止态完全隐形:82% 近黑底在无壁纸时与页面底色融为一体,
   压在壁纸上就是一条实心黑带,连 blur 本身也会把壁纸糊出一条可见的磨砂带。
   故壁纸模式下底色/底边线/模糊全部卸掉,与 view-head 一样直接坐在壁纸上;
   仅当内容真的滚到状态栏下方(.scrolled,JS 按 scrollY 挂)才浮出垫层保可读。 */
body.wall-on .statusbar {
  background: transparent;
  border-bottom-color: transparent;
  backdrop-filter: none;
  -webkit-backdrop-filter: none;
  transition: background 200ms var(--ease), border-color 200ms var(--ease);
}
/* 滚动态不能再是一条"带":任何一块整幅宽的深色底,不管边缘多软,压在壁纸上都能看出来。
   所以垫层只留模糊 + 极淡的着色(28% → 0,纵向渐隐,同向 mask 收掉模糊的硬边界),
   可读性主要交给 widget 文字自己的投影(静止态文字本就是裸坐在壁纸上的,证明投影足够);
   模糊只负责把滚到下方的正文糊成一团色块,不与状态栏文字打架。
   垫层挂 ::before 并向下多伸 14px 给淡出留行程;mask 不能加在 .statusbar 本身,会连文字一起淡掉。 */
body.wall-on .statusbar.scrolled {
  background: transparent;
  border-bottom-color: transparent;
}
body.wall-on .sb-item { text-shadow: 0 1px 2px rgb(0 0 0 / 0.6), 0 0 8px rgb(0 0 0 / 0.45); }
body.wall-on .statusbar::before {
  content: ''; position: absolute; inset: 0 0 -14px; z-index: -1; pointer-events: none;
  opacity: 0; transition: opacity 200ms var(--ease);
  background: linear-gradient(to bottom, color-mix(in oklab, var(--bg) 28%, transparent) 0%, transparent 100%);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  mask-image: linear-gradient(to bottom, #000 0%, #000 45%, transparent 100%);
  -webkit-mask-image: linear-gradient(to bottom, #000 0%, #000 45%, transparent 100%);
}
body.wall-on .statusbar.scrolled::before { opacity: 1; }

/* ============ 设置(居中对话框,DESIGN.md「设置」组件) ============ */
/* 入口:替代原壁纸按钮,位置/尺寸/字号与 .wall-btn 一致 */
.stg-entry { display: flex; align-items: center; gap: 8px; width: 100%; padding: 6px 8px; margin: -4px -8px 8px; border-radius: var(--r-s); font-size: 0.75rem; color: var(--muted); text-align: left; }
.stg-entry:hover { background: var(--hover); color: var(--ink); }
.stg-entry svg { width: 14px; height: 14px; flex: none; }
/* 「设置」二字必须退出压缩:裸文本在 flex 里是可被压到一个字宽的匿名项,挤窄了会竖排 */
.stg-entry-label { flex: none; }
/* 状态是次要信息,空间不够时省略号截断——既不换行也不去挤压前面的标签;完整值走 title */
.stg-entry-state { margin-left: auto; min-width: 0; font-family: var(--mono); font-size: 0.6875rem; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* 容器:抽屉版加宽到 760(两栏需要),对话框版是 900×640 的大框,内部自己滚 */
.drawer.stg-drawer { width: min(760px, 94vw); padding: 0; }
/* 两栏几何收在变量里:头部要按同一组数对齐,硬编码两处迟早对不上 */
.modal.stg-modal { --stg-nav-w: 148px; --stg-pane-pad: 24px; --stg-head-pad: 20px; --stg-head-gap: 12px;
  width: min(900px, calc(100vw - 80px)); height: min(640px, calc(100vh - 80px)); max-height: none; overflow: hidden; display: flex; flex-direction: column; padding: 0; }
/* 玻璃档:--surface 本身会被重定义成半透明,对话框不在 backdrop 名单里,会透出正文——按 .dd-menu 先例固定不透明 */
body.wall-glass .modal.stg-modal { background: var(--surface-opaque); }

.stg-head { display: flex; align-items: center; gap: var(--stg-head-gap); padding: 14px var(--stg-head-pad); border-bottom: 1px solid var(--line-soft); flex: none; }
/* 标题占满左栏那一格,使搜索框左缘正好落在右栏内容线上 —— 头部与主体共用同一条竖轴。
   「设置」二字也因此与下方分区导航的文字左缘对齐(两者都缩进 20px) */
.stg-head h2 { font-size: 0.9375rem; flex: none;
  width: calc(var(--stg-nav-w) + var(--stg-pane-pad) - var(--stg-head-pad) - var(--stg-head-gap)); }
.stg-search { flex: 1; min-width: 0; position: relative; }
.stg-search .input { width: 100%; padding: 5px 10px 5px 28px; font-size: 0.75rem; }
.stg-search svg { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); width: 13px; height: 13px; color: var(--faint); pointer-events: none; }
.stg-search kbd { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); font-family: var(--mono); font-size: 0.625rem; color: var(--faint); border: 1px solid var(--line-soft); border-radius: 3px; padding: 0 4px; }

.stg-body { flex: 1; min-height: 0; display: flex; }
.stg-nav { flex: none; width: var(--stg-nav-w); padding: 12px 10px; border-right: 1px solid var(--line-soft); display: flex; flex-direction: column; gap: 2px; overflow-y: auto; }
.stg-nav button { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: var(--r-s); font-size: 0.8125rem; color: var(--muted); text-align: left; }
.stg-nav button:hover { background: var(--hover); color: var(--ink); }
.stg-nav button.active { background: var(--tint-jade); color: var(--jade); font-weight: 600; }
.stg-nav button svg { width: 14px; height: 14px; flex: none; }
/* 图例:每条一行不折行,标记与释义同基线;左栏窄,故释义取「是否跨设备」这一句关键区分,
   完整存储位置说明在「高级」分区底部,不在这里重复 */
.stg-nav .stg-nav-foot { margin-top: auto; padding: 8px 10px 0; display: flex; flex-direction: column; gap: 5px; }
.stg-legend { display: flex; align-items: center; gap: 6px; white-space: nowrap; font-size: 0.6875rem; color: var(--faint); }
.stg-pane { flex: 1; min-width: 0; overflow-y: auto; padding: 4px var(--stg-pane-pad) var(--stg-pane-pad); }
.stg-sec { padding-top: 18px; }
.stg-sec[hidden] { display: none; }
.stg-sec-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 4px; }
.stg-sec-head h3 { font-size: 0.875rem; color: var(--ink); }
.stg-sec-head p { font-size: 0.75rem; color: var(--faint); }
.stg-sec-head .btn-quiet { margin-left: auto; font-size: 0.6875rem; padding: 3px 8px; }
.stg-group { font-size: 0.6875rem; font-weight: 600; color: var(--faint); text-transform: uppercase; letter-spacing: 0.04em; margin: 18px 0 2px; }

/* 一行一项:标签+说明 | 控件 | 存储范围标记。行与行用 line-soft 分隔,不套卡片 */
.stg-row { display: flex; align-items: center; gap: 16px; padding: 11px 0; border-bottom: 1px solid var(--line-soft); }
.stg-row:last-child { border-bottom: 0; }
.stg-row[hidden] { display: none; }
.stg-lab { flex: 1; min-width: 0; }
.stg-lab span { display: block; font-size: 0.8125rem; color: var(--ink); }
.stg-lab small { display: block; font-size: 0.6875rem; color: var(--faint); margin-top: 2px; line-height: 1.45; }
.stg-lab mark { background: var(--tint-jade); color: var(--jade); border-radius: 2px; padding: 0 1px; }
.stg-ctl { flex: none; display: flex; align-items: center; gap: 8px; }
/* 下拉一律复用自绘 .dd.down(模态内变体),不用原生 select —— 原生弹层由 OS 绘制无法主题化。
   语义着色与派发页底栏保持同一套:模型紫、工作目录蓝,思考深度/权限走 .dd.dim */
.stg-ctl .dd.down { width: 220px; }
#stg-model-dd .dd-btn { color: var(--violet); }
#stg-cwd-dd .dd-btn { color: var(--blue); }
/* 菜单的容身之处:.stg-pane 会滚动,绝对定位的菜单被它裁掉;而 fixed 也不行 ——
   .modal 用 transform 居中,transform 祖先会成为 fixed 的包含块,菜单会按对话框左上角算坐标飞出去
   再被 overflow:hidden 裁掉。故打开时把菜单挂到既不滚动、又在对话框边界内的 .stg-body 上,
   按触发钮算相对坐标;pane 一滚就关。实现层用带 portal 的 Select(Radix)同理,portal 目标别选 body 以外。 */
.stg-body { position: relative; }
.stg-body > .dd-menu { position: absolute; bottom: auto; min-width: 0; }
.stg-body > .dd-menu.open { opacity: 1; transform: none; pointer-events: auto; }
.stg-body > .dd-menu.dim .dd-item { font-family: var(--sans); }
.stg-ctl .filter-tabs button { padding: 4px 10px; }
.stg-ctl .input[type=text], .stg-ctl .input[type=url] { width: 220px; padding: 5px 10px; font-size: 0.75rem; }
.stg-ctl input[type=range] { width: 130px; accent-color: var(--jade); }
/* 设置 › 飞书:连接状态(圆点 + 文案,永不 color-alone)。类名带 lark- 前缀,防撞 Tailwind 生成类 */
.lark-conn { display: inline-flex; align-items: center; gap: 7px; font-size: 0.8125rem; color: var(--ink); white-space: nowrap; }
.lark-conn-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--jade); flex: none; }
.lark-conn[data-state="connecting"] .lark-conn-dot { background: var(--amber); animation: lark-pulse 1.2s var(--ease) infinite; }
.lark-conn[data-state="fail"] .lark-conn-dot { background: var(--red); }
.lark-conn[data-state="unset"], .lark-conn[data-state="off"] { color: var(--muted); }
.lark-conn[data-state="unset"] .lark-conn-dot, .lark-conn[data-state="off"] .lark-conn-dot { background: var(--faint); }
@keyframes lark-pulse { 50% { opacity: 0.35; } }
@media (prefers-reduced-motion: reduce) { .lark-conn[data-state="connecting"] .lark-conn-dot { animation: none; } }
.lark-who { font-size: 0.8125rem; color: var(--ink); }
.lark-id { font-family: var(--mono); font-size: 0.75rem; color: var(--muted); background: var(--code-tint); padding: 2px 6px; border-radius: 4px; }
.lark-code { font-family: var(--mono); font-size: 0.9375rem; letter-spacing: 0.12em; color: var(--jade); background: var(--code-tint); padding: 2px 8px; border-radius: 4px; }
.stg-lab small code { font-family: var(--mono); font-size: 0.6875rem; background: var(--code-tint); padding: 0 4px; border-radius: 3px; }
.stg-ctl .stg-val { width: 40px; text-align: right; font-family: var(--mono); font-size: 0.6875rem; color: var(--muted); font-variant-numeric: tabular-nums; }
/* 存储范围标记:本机 = 只在这台浏览器;账户 = 落后端 meta 表,手机端同步 */
.stg-scope { flex: none; width: 34px; text-align: center; font-family: var(--mono); font-size: 0.625rem; color: var(--faint); border: 1px solid var(--line-soft); border-radius: 3px; padding: 1px 0; }
.stg-scope[data-scope="acct"] { color: var(--jade); border-color: color-mix(in oklab, var(--jade) 40%, transparent); }
.stg-row.is-off .stg-lab, .stg-row.is-off .stg-ctl { opacity: 0.45; pointer-events: none; }
.stg-peek { margin-top: 6px; }
.stg-peek .md { display: flex; gap: 12px; align-items: baseline; font-size: 0.75rem; }
.stg-peek .md h2 { font-size: 0.75rem; margin: 0; }
.stg-peek .md p { margin: 0; }
.stg-peek .md code { font-size: 0.6875rem; }
.stg-thumbs { display: flex; gap: 8px; }
/* 文件选择:input 视觉上藏起但不 display:none —— 部分 WebKit 对 display:none 的 file input 不响应 label 激活 */
.stg-file { position: relative; overflow: hidden; cursor: pointer; }
.stg-file input[type=file] { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; }
/* 缩略图背景由 JS 用线上同一份 WALL_PRESETS url 填充,不另造 mock */
.stg-thumb { width: 52px; height: 32px; border-radius: 4px; border: 1px solid var(--line); background-size: cover; cursor: pointer; }
.stg-thumb:hover { border-color: var(--muted); }
.stg-thumb.active { border-color: var(--jade); outline: 1px solid var(--jade); }

/* 快捷键表:动作 | 键位 | 改键。键位用 kbd 词汇(与 .to-foot kbd 同规格) */
.stg-keys { width: 100%; border-collapse: collapse; }
.stg-keys td { padding: 8px 0; border-bottom: 1px solid var(--line-soft); font-size: 0.8125rem; vertical-align: middle; }
.stg-keys td:first-child { color: var(--ink); }
.stg-keys td small { display: block; font-size: 0.6875rem; color: var(--faint); margin-top: 1px; }
.stg-keys td.k { width: 150px; white-space: nowrap; }
.stg-keys td.a { width: 60px; text-align: right; }
.stg-keys td.a button { font-size: 0.6875rem; color: var(--faint); padding: 2px 6px; border-radius: 3px; }
.stg-keys td.a button:hover { background: var(--hover); color: var(--ink); }
.stg-keys tr.rec td.k { color: var(--jade); font-size: 0.75rem; }
.stg-keys tr.rec td.k::after { content: "按下新组合…"; animation: stg-blink 1s steps(2) infinite; }
.stg-keys kbd { font-family: var(--mono); font-size: 0.6875rem; padding: 1px 6px; border: 1px solid var(--line); border-radius: 4px; color: var(--muted); background: var(--surface-2); }
.stg-keys kbd + kbd { margin-left: 3px; }
.stg-keys tr.conflict kbd { border-color: var(--amber); color: var(--amber); }
.stg-keys .stg-conf { font-size: 0.625rem; color: var(--amber); margin-left: 6px; }
/* 类名必须带 stg- 前缀:Tailwind v4 会扫描源码里出现的类名字符串按需生成工具类,
   裸写 `fixed` 会被它生成 `.fixed{position:fixed}`,把这一行从表格流里踢出去(2026-09-03 实测) */
.stg-keys tr.stg-fixed kbd { border-style: dashed; }
@keyframes stg-blink { 50% { opacity: 0.3; } }

.stg-storage { font-size: 0.6875rem; color: var(--faint); line-height: 1.6; margin-top: 12px; }
.stg-storage code { font-family: var(--mono); color: var(--muted); }
.stg-empty { padding: 40px 0; text-align: center; font-size: 0.8125rem; color: var(--faint); }

/* 手机:整屏覆盖,左栏退化为顶部横向 tab */
@media (max-width: 720px) {
  .drawer.stg-drawer, .modal.stg-modal { width: 100vw; height: 100dvh; max-height: none; top: 0; left: 0; right: 0; transform: none; border: 0; border-radius: 0; }
  .modal.stg-modal.show { transform: none; }
  .stg-head h2 { width: auto; }
  .stg-body { flex-direction: column; }
  .stg-nav { width: auto; flex-direction: row; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line-soft); padding: 8px 12px; }
  .stg-nav button { flex: none; padding: 6px 10px; }
  .stg-nav .stg-nav-foot { display: none; }
  .stg-row { flex-wrap: wrap; }
  .stg-ctl { width: 100%; }
  .stg-ctl .dd.down { flex: 1; width: auto; }
  .stg-scope { order: -1; margin-left: auto; }
  .stg-search kbd { display: none; }
  .stg-keys td.a { display: none; }
  /* 窄屏下标题与按钮各自不参与压缩,说明文字整行落到第二行——
     否则 flex 会先压标题,把「派发」两个字挤成竖排(2026-09-03 实测) */
  .stg-sec-head { flex-wrap: wrap; }
  .stg-sec-head h3,
  .stg-sec-head .btn-quiet { flex: none; }
  .stg-sec-head p { flex: 1 0 100%; order: 3; margin-top: 2px; }
}


/* ============ 响应式 ============ */
@media (max-width: 960px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .sidebar { position: sticky; top: 0; height: auto; flex-direction: row; align-items: center; z-index: var(--z-sticky); border-right: none; border-bottom: 1px solid var(--line-soft); overflow-x: auto; }
  .brand { padding: 12px 16px; flex: none; }
  .nav { flex-direction: row; padding: 0 8px; }
  .nav button { padding: 10px 10px; white-space: nowrap; }
  .nav .count { display: none; }
  .side-foot { display: none; }
  .main { padding: 18px 16px 40px; }
  /* 侧栏在此断点转为吸顶横条(同为 z-sticky),状态栏再吸顶就会与它抢同一条位置并互相压盖,
     故此处退回普通流:仍在主区顶部,只是随页面滚走 */
  .statusbar { position: static; padding: 0 16px; margin: 0 -16px 8px; }
  .dash-now, .dash-grid, .rv-grid { grid-template-columns: minmax(0, 1fr); }
  .board { grid-template-columns: repeat(4, 272px); height: auto; }
  /* 窄屏改为整页滚动:外壳不再锁视口高,看板恢复内容高度 */
  .board-wrap { display: block; height: auto; min-height: 0; }
  .col-body { overflow-y: visible; }
  .dispatch { height: auto; }
  .chat { min-height: 380px; max-height: 60vh; }
  .chat-status { flex-wrap: wrap; row-gap: 6px; } /* 标识+用量条+agent 状态三段窄屏放不下一行,允许折行 */
  .sess-ctx { max-width: 100%; }
  .cs-state { margin-left: 0; } /* 折行后 auto 外边距失去意义,退回自然流 */
  /* 单列后不必再与右栏对齐:列表自然展开,不做内部滚动(移动端嵌套滚动手感差)。
     max-height 必须一并解除——只放开 overflow 会让 60vh 之外的行被裁掉且滚不到 */
  .tl-tall { flex: none; max-height: none; overflow-y: visible; }
}

/* ============================================================
   移动端「手持罗盘」形态(≤430px,与 DESIGN.md 移动端章节同源)
   重新组织信息架构,而非把桌面布局等比缩小:
   侧栏 → 底部 5-tab 拇指区导航 + 顶部标识条;
   看板/表格 → 状态 tab + 单列卡片流(结构级改动见 Sessions/Projects/Skills.tsx + TabBar/MoreMenu);
   抽屉/下拉/模态 → 统一收敛为底部上滑 sheet;
   一切可点元素 ≥44px 命中区,hover 语义转 :active。
   ============================================================ */
@media (max-width: 430px) {
  :root {
    --mobile-top-h: 52px;
    --mobile-tab-h: 58px;
  }

  /* ---- 应用外壳:侧栏隐藏,换底部 tab + 顶部标识条 ---- */
  .app { display: block; }
  .sidebar { display: none; }
  /* 状态栏不上移动端:标识与 daemon 状态已由 .mobile-topbar 承接,
     这点宽度里再压一条只会挤掉标题(见 DESIGN.md §5 全局状态栏) */
  .statusbar { display: none; }
  .mobile-topbar {
    display: flex; align-items: center; gap: 10px;
    position: fixed; top: 0; left: 0; right: 0; z-index: var(--z-sticky);
    height: calc(var(--mobile-top-h) + env(safe-area-inset-top));
    padding: env(safe-area-inset-top) 8px 0 14px;
    background: color-mix(in oklab, var(--bg) 94%, transparent);
    -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); /* 吸顶滚动垫层,功能性而非装饰,不受玻璃拟态禁令约束 */
    border-bottom: 1px solid var(--line-soft);
  }
  .mobile-topbar h1 { font-size: 1.0625rem; font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mobile-topbar .daemon { margin-left: auto; display: inline-flex; align-items: center; gap: 6px; color: var(--faint); font-size: 0.625rem; font-family: var(--mono); flex: none; }
  .mobile-topbar .daemon .ok { width: 6px; height: 6px; border-radius: 50%; background: var(--jade); flex: none; }
  .mobile-topbar .back {
    display: flex; align-items: center; gap: 2px; min-height: 44px; padding: 0 8px 0 2px;
    margin-left: -6px; color: var(--muted); font-size: 0.9375rem; flex: none;
  }
  .mobile-topbar .back b { color: var(--ink); font-weight: 600; margin-left: 2px; }

  .tabbar {
    display: flex;
    position: fixed; bottom: 0; left: 0; right: 0; z-index: var(--z-sticky);
    height: calc(var(--mobile-tab-h) + env(safe-area-inset-bottom));
    padding-bottom: env(safe-area-inset-bottom);
    background: color-mix(in oklab, var(--surface-2) 96%, transparent);
    -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    border-top: 1px solid var(--line-soft);
  }
  .tabbar button {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    color: var(--faint); font-size: 0.625rem; font-weight: 600; letter-spacing: 0.02em; position: relative;
    transition: color 150ms var(--ease);
  }
  .tabbar button svg { width: 22px; height: 22px; }
  .tabbar button.active { color: var(--jade); }
  .tabbar button:active { color: var(--muted); }
  .tabbar .bdg {
    position: absolute; top: 5px; left: calc(50% + 7px);
    min-width: 16px; height: 16px; padding: 0 4px; border-radius: 99px;
    background: var(--amber); color: var(--on-jade); font-size: 0.625rem; font-weight: 700;
    display: flex; align-items: center; justify-content: center; font-variant-numeric: tabular-nums;
  }

  .main { padding: calc(var(--mobile-top-h) + env(safe-area-inset-top) + 12px) 12px calc(var(--mobile-tab-h) + env(safe-area-inset-bottom) + 16px); }

  /* view-head 的标题已被顶栏承接;其余内容(搜索/筛选/操作按钮)保留但改为可换行的触屏尺寸 */
  .view-head { gap: 8px 10px; margin-bottom: 14px; }
  .view-head h1 { display: none; }
  .view-head .sub { flex-basis: 100%; font-size: 0.75rem; }
  .view-head .input, .view-head input.input { width: 100% !important; }
  .view-head .btn { min-height: 44px; }

  /* 更多菜单(项目/技能/经验/回顾聚合入口,见 MoreMenu.tsx) */
  .more-list { background: var(--surface); border: 1px solid var(--line-soft); border-radius: var(--r-m); overflow: hidden; margin-bottom: 12px; }
  .more-row {
    display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
    min-height: 52px; padding: 8px 14px; border-top: 1px solid var(--line-soft);
    transition: background 150ms var(--ease);
  }
  .more-row:first-child { border-top: none; }
  .more-row:active { background: var(--hover); }
  .more-row svg { width: 20px; height: 20px; color: var(--muted); flex: none; }
  .more-row .lbl { font-weight: 600; font-size: 0.9375rem; flex: 1; }
  .more-row .hint-v { color: var(--faint); font-size: 0.75rem; font-family: var(--mono); }
  .more-row .chev { color: var(--faint); }
  .more-foot { color: var(--faint); font-size: 0.6875rem; font-family: var(--mono); text-align: center; padding: 16px 0 6px; line-height: 1.8; }

  /* ---- 四四触控规则:一切可点元素命中区 ≥44px ---- */
  .btn { min-height: 44px; padding: 8px 16px; }
  .btn-sm { min-height: 40px; padding: 6px 14px; }
  .input, select.input { min-height: 44px; font-size: 1rem; } /* ≥16px 防 iOS 聚焦自动缩放 */
  .x-btn { min-width: 44px; min-height: 44px; }
  .dd-btn { min-height: 44px; padding: 8px 10px; }
  .filter-tabs { flex-wrap: wrap; }
  .filter-tabs button { min-height: 40px; padding: 8px 14px; }
  .switch { width: 46px; height: 28px; }
  .switch::after { width: 22px; height: 22px; }
  .switch::before { content: ''; position: absolute; inset: -8px; } /* 扩大触控区,不改变视觉尺寸 */
  .mem-item, .cron-row, .rv-sess, .more-row { min-height: 48px; }
  .need-item, .run-item { min-height: 44px; }
  .col-more, .runs-more { min-height: 44px; display: flex; align-items: center; justify-content: center; }

  /* ---- 会话看板/项目/技能:结构级重排(见对应 .tsx 的 useIsMobile 分支) ---- */
  .board { display: none; } /* 桌面 4 列横滚版隐藏,移动端渲染 .board-mobile */
  .board-mobile { display: block; }
  .table { display: none; } /* 桌面表格隐藏,移动端渲染 .mcard 卡片流 */
  .mcard-list { display: block; }

  .seg-scroll {
    display: block;
    position: sticky; top: calc(var(--mobile-top-h) + env(safe-area-inset-top));
    z-index: 5; margin: -2px -12px 12px; padding: 10px 12px;
    background: color-mix(in oklab, var(--bg) 94%, transparent);
    -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    overflow-x: auto; scrollbar-width: none;
  }
  .seg-scroll::-webkit-scrollbar { display: none; }
  .seg-scroll .seg { display: inline-flex; white-space: nowrap; }
  .seg-scroll .seg button { min-height: 36px; padding: 6px 14px; display: inline-flex; align-items: center; gap: 6px; }
  .seg-scroll .seg button .warn-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--amber); animation: pulse 2s var(--ease) infinite; }

  .mcard {
    display: block; width: 100%; text-align: left;
    background: var(--surface); border: 1px solid var(--line-soft); border-radius: var(--r-m);
    padding: 12px 14px; margin-bottom: 10px; transition: background 150ms var(--ease);
  }
  .mcard:active { background: var(--hover); }

  /* ---- 派发页:底部输入栏触屏化 ---- */
  /* 三层兜底,一层比一层准,后面的覆盖前面的:
     1) 100vh —— 所有引擎都认,但部分浏览器(含经典移动端 bug)算的是"地址栏收起后"的虚高;
     2) 100dvh —— 更准,但部分 Android 内嵌 WebView(超级 App 内置浏览器等)不支持,
        不支持时这条 calc() 整体失效被丢弃,回退到上一条,不会留白;
     3) --vh(JS 用 window.innerHeight 实测写入,见 App.tsx)—— 最终权威值,内核一致性
        比任何 CSS 视口单位都好。三层任何一层失真,上面 .chat 的 min-height:0 修复兜底
        防止内容硬撑爆父容器(2026-07-23 真机反馈:发送按钮被推到底部导航条后面看不清)。 */
  .dispatch { height: calc(100vh - var(--mobile-top-h) - env(safe-area-inset-top) - var(--mobile-tab-h) - env(safe-area-inset-bottom) - 96px); min-height: 340px; }
  .dispatch { height: calc(100dvh - var(--mobile-top-h) - env(safe-area-inset-top) - var(--mobile-tab-h) - env(safe-area-inset-bottom) - 96px); }
  .dispatch { height: calc(var(--vh, 1vh) * 100 - var(--mobile-top-h) - env(safe-area-inset-top) - var(--mobile-tab-h) - env(safe-area-inset-bottom) - 96px); }
  /* 中和 960px 断点的 .chat { min-height:380px; max-height:60vh }——那是为旧窄屏布局
     (dispatch height:auto、整页滚动)设计的,在 ≤430 的固定高度布局里会顶住不收缩,把
     composer/term-line 硬挤到 tabbar 后面(2026-07-23 真机第二轮反馈的真根因:视口 ~657px
     时容器 451px < 内容 380+status+composer+term-line ≈ 580px;之前 844px 高的模拟视口
     恰好容得下,没暴露)。恢复 min-height:0 后 chat 随容器收缩、内部滚动,底部三件套恒可见。 */
  .chat { padding: 14px 14px 6px; min-height: 0; max-height: none; }
  /* 会话标识挪进消息区顶部(见 Dispatch.tsx),状态条腾出整行只放用量条 + agent 状态——
     2026-07-16 真机反馈修复:三段挤一行导致 Context/Usage/Weekly 用量条被推出可视区外,只能靠横滑才看得见 */
  .chat-sessctx-mobile { display: block; margin-bottom: 12px; }
  .chat-sessctx-mobile .sess-ctx { max-width: 100%; }
  .chat-status .sess-ctx { display: none; }
  .chat-status { flex-wrap: nowrap; gap: 10px; padding: 10px 4px; overflow-x: auto; scrollbar-width: none; } /* 空间紧张时兜底横滑,正常宽度下不需要 */
  .chat-status::-webkit-scrollbar { display: none; }
  .u-chips { flex: 1; min-width: 0; justify-content: space-between; gap: 8px; }
  /* 窄屏:标签让位给「条 + % + 倒计时」——Context/Usage/Weekly 的顺序固定,颜色与位置已足够辨识,
     完整标签仍在 title 里。gap 收紧到 5px 让三段挤得下,不再靠横滑找 Weekly。 */
  .u-chip { flex: 1; min-width: 0; justify-content: center; gap: 5px; }
  .u-chip .u-lab { display: none; }
  .u-bar { width: 44px; }
  .u-chip b { font-size: 0.6875rem; }
  /* 双轨 Weekly 窄屏:轨道略加宽补偿双轨变矮,倒计时让位(与其它芯片同规则,完整信息在 title) */
  .u-chip.wk2 .u-bar { width: 56px; }
  .u-chip.wk2 .u-reset { display: none; }
  .cs-state { flex: none; }
  .composer textarea { min-height: 44px; }
  /* 镜像层字号必须跟着 textarea 走,否则窄屏下逐字错位 */
  .ta-wrap textarea, .ta-wrap .ta-mirror { font-size: 1rem; }
  .xj-slash-list { max-height: 40vh; }
  .xj-slash-desc { display: none; }  /* 窄屏只留命令名,描述让位 */
  /* 触摸目标下限 44px:桌面按行高 31px 是紧凑,手指点不准 */
  .xj-slash-item { min-height: 44px; align-items: center; padding: 6px 12px; }
  .composer .code-help { display: none; } /* 与 .hint 同理:窄屏让位给按钮 */
  .composer .c-bar { flex-wrap: nowrap; gap: 10px; }
  .composer .hint { display: none; } /* 低价值提示,窄屏让位给按钮 */
  .composer .bg-opt { min-height: 44px; gap: 0; }
  .composer .bg-opt-label { display: none; } /* 说明文字挪进 title/aria-label,腾出宽度给发送按钮 */
  /* 发送按钮在移动端切图标(44×44 方形触控区),不再是会被挤扁的文字按钮 */
  .send-btn { width: 44px; padding: 0; justify-content: center; flex: none; }
  .send-btn-label { display: none; }
  .send-btn-icon { display: block; width: 20px; height: 20px; }
  .term-line { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  .term-line::-webkit-scrollbar { display: none; }
  .term-line > .tag { display: none; } /* settingSources 标注对移动端低价值,省出横滑空间 */
  .term-line .branch { flex: none; }

  /* ---- 抽屉 / 模态 / 自绘下拉:统一收敛为底部上滑 sheet ---- */
  .drawer {
    top: auto; right: 0; left: 0; bottom: 0; width: auto; height: auto; max-height: 88dvh;
    border-left: none; border-top: 1px solid var(--line);
    border-radius: 16px 16px 0 0;
    transform: translateY(102%);
    box-shadow: 0 -8px 32px oklch(0.05 0 0 / 0.5);
  }
  .drawer::before { content: ''; flex: none; display: block; width: 36px; height: 4px; border-radius: 2px; background: var(--line); margin: 8px auto 0; }
  .drawer.show { transform: translateY(0); }
  .drawer-foot { padding-bottom: calc(14px + env(safe-area-inset-bottom)); flex-wrap: wrap; }

  .modal {
    top: auto; left: 0; right: 0; bottom: 0; transform: translateY(102%);
    width: auto; max-width: none; max-height: 88dvh; border-radius: 16px 16px 0 0;
  }
  .modal::before { content: ''; display: block; width: 36px; height: 4px; border-radius: 2px; background: var(--line); margin: 8px auto -4px; }
  .modal.show { transform: translateY(0); }
  .modal-foot { padding-bottom: calc(14px + env(safe-area-inset-bottom)); flex-wrap: wrap; }
  .two-col { grid-template-columns: 1fr; }

  .dd.open .dd-backdrop {
    display: block; position: fixed; inset: 0; z-index: var(--z-backdrop);
    background: oklch(0.05 0 0 / 0.55);
  }
  .dd-menu {
    position: fixed; top: auto; bottom: 0; left: 0; right: 0; width: auto; max-width: none;
    border-radius: 16px 16px 0 0; z-index: var(--z-drawer); max-height: 70dvh; overflow-y: auto;
    padding: 8px; padding-bottom: calc(8px + env(safe-area-inset-bottom));
    transform: translateY(102%);
  }
  .dd.open .dd-menu { transform: translateY(0); }
  .dd-item { min-height: 44px; font-size: 0.875rem; }
  .dd.down .dd-menu { top: auto; bottom: 0; }

  /* confirm/命令弹窗保持居中(短促二元决策,不必转 sheet),仅放大触控区 */
  .confirm-actions .btn, .rp-item { min-height: 44px; }

  /* ---- 仪表盘/回顾:栅格已在 960px 断点收为单列,这里只补触控与间距 ---- */
  .dash-strip { gap: 12px 18px; }
  .heat-row { grid-template-columns: 72px repeat(7, 1fr); }
  .heat-days { grid-template-columns: 72px repeat(7, 1fr); }
  .week-nav .wk-btn { min-width: 44px; min-height: 44px; }
  /* 用量模块:副标题让位给两组切换(口径仍可长按 title 看),条形图三列收紧,否则数值被挤出右缘 */
  .usage-head .sub { display: none; }
  .seg button { min-height: 32px; padding: 1px 12px; }
  .tok-row { grid-template-columns: minmax(90px, 110px) 1fr 64px; gap: 8px; }
  .tok-row.sub .lbl { padding-left: 12px; }
  /* 构成:窄屏三项也可能各自换行,收紧行距 */
  .comp-nums { gap: 6px 14px; }
  .comp-line { padding-left: 12px; }

  /* ---- 回顾:顶部统计改原型 stat-grid 2×2 卡片(见 prototype-mobile.html #v-review/#v-home),
     渲染分支见 Review.tsx isMobile ---- */
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
  .stat-grid .cell { background: var(--surface); border: 1px solid var(--line-soft); border-radius: var(--r-m); padding: 10px 12px; }
  .stat-grid .k { color: var(--faint); font-size: 0.6875rem; font-weight: 600; }
  .stat-grid .v { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 0.9375rem; margin-top: 2px; color: var(--ink); }
  .stat-grid .v small { color: var(--faint); font-size: 0.6875rem; }

  /* 回顾:项目行(chip + 元信息 + 成本)桌面版三段挤一行,窄屏不换行会把整页撑宽出现横向滚动
     (agent-browser 390×844 实测 scrollWidth 464 > 390);拆成两行——chip+成本一行,元信息独占一行 */
  .rv-proj-head { flex-wrap: wrap; gap: 4px 10px; }
  .rv-proj-head .m { flex-basis: 100%; white-space: normal; order: 3; }

  /* ---- 定时:运行历史桌面表格在窄屏改紧凑单行卡片,不再是固定表头列宽的 table ---- */
  .runs { display: block; }
  .runs thead { display: none; }
  .runs tbody { display: block; }
  .runs tr { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; padding: 8px 2px; border-bottom: 1px solid var(--line-soft); }
  .runs tr:last-child { border-bottom: none; }
  .runs td { display: inline-flex; align-items: center; border-bottom: none; padding: 0; font-size: 0.75rem; }

  /* 派发页空态快捷建议 chip:未在原型中出现过的桌面遗留元素,补齐四四触控规则 */
  .sugg button { min-height: 44px; padding: 10px 16px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}

/* ============================================================
   验收面板(Acceptance Runbook)
   设计依据:wiki/tech/acceptance-runbook.md;原型 wiki/design/prototype-runbook.html
   规则:
   - 面板挂在「待验收」会话的消息区与状态条之间:它是验收阶段的常驻工具,
     不是一条消息;可折叠,折叠后只剩一行头部
   - 「待验收」语义色是紫罗兰(与 .pill-rev 同源),只用在面板头部与
     「会话生成」来源标——面板内部回到中性,状态色只给状态灯
   - 状态灯词汇:faint=未启动 / 琥珀脉动=启动中 / 玉=就绪·成功 /
     muted=已退出 / 红=失败,与全局「状态色即语义」一致
   - 每个可执行项在按钮旁常驻插值后的完整命令(mono 小字):
     用户点的是命令,不是黑盒按钮
   - origin=session 的项带「会话生成」标,首次执行弹完整命令确认
     (复用 .confirm-mask 应用内确认框)
   ============================================================ */
.runbook {
  margin-top: 10px; border: 1px solid color-mix(in oklab, var(--violet) 30%, transparent);
  border-radius: var(--r-m); background: var(--surface); overflow: hidden;
}
.rb-head {
  display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
  padding: 9px 16px; cursor: pointer; background: none; border: none;
  transition: background 150ms var(--ease);
}
.rb-head:hover { background: var(--hover); }
.rb-head .rb-label { font-size: 0.8125rem; font-weight: 600; color: var(--violet); flex: none; }
.rb-head .rb-tpl {
  font-family: var(--mono); font-size: 0.6875rem; color: var(--muted);
  border: 1px solid var(--line); border-radius: 4px; padding: 0 7px; white-space: nowrap;
}
/* 折叠态摘要:环境是否在跑,一眼可扫(数字不装饰,是「有没有东西还开着」的信号) */
.rb-head .rb-sum { font-size: 0.6875rem; color: var(--faint); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rb-head .rb-sum .on { color: var(--jade); }
.rb-head .chev { margin-left: auto; color: var(--faint); transition: transform 180ms var(--ease); flex: none; }
.runbook.open .rb-head .chev { transform: rotate(180deg); }
.rb-body { display: none; border-top: 1px solid var(--line-soft); }
.runbook.open .rb-body { display: block; max-height: 46vh; overflow-y: auto; }
.rb-notes { padding: 9px 16px 8px; font-size: 0.75rem; color: var(--muted); border-bottom: 1px solid var(--line-soft); }
.rb-notes b { color: var(--ink); font-weight: 600; }

.rb-item { padding: 10px 16px; border-bottom: 1px solid var(--line-soft); }
.rb-item:last-child { border-bottom: none; }
.rb-row { display: flex; align-items: center; gap: 10px; min-width: 0; }
.rb-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; transition: background 150ms var(--ease); }
.rb-dot.starting, .rb-dot.running { background: var(--amber); animation: pulse 1.4s var(--ease) infinite; }
.rb-dot.ready, .rb-dot.ok { background: var(--jade); animation: none; }
.rb-dot.exited { background: var(--muted); }
.rb-dot.failed { background: var(--red); }
.rb-title { font-size: 0.8125rem; font-weight: 600; flex: none; }
.rb-state { font-size: 0.6875rem; color: var(--faint); flex: none; white-space: nowrap; }
.rb-state.ready { color: var(--jade); }
.rb-state.failed { color: var(--red); }
.rb-origin {
  font-size: 0.625rem; font-weight: 600; color: var(--violet); background: var(--tint-violet);
  border-radius: 4px; padding: 0 6px; flex: none; white-space: nowrap;
}
.rb-actions { margin-left: auto; display: flex; gap: 6px; flex: none; }
/* 插值后的完整命令:与状态灯列对齐(缩进 18px),一行截断,title 见全文 */
.rb-cmd {
  font-family: var(--mono); font-size: 0.71875rem; color: var(--faint);
  margin: 4px 0 0 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.rb-cmd .p { color: var(--blue); } /* 参数插值段:蓝=纯信息,标出「这段是你填的」 */

/* 参数表单:命令行之下、与之同缩进;date 用原生控件(实现层 shadcn DatePicker) */
.rb-params { display: flex; flex-wrap: wrap; gap: 8px 14px; margin: 8px 0 2px 18px; }
.rb-param { display: flex; align-items: center; gap: 6px; }
.rb-param label { font-size: 0.6875rem; color: var(--muted); white-space: nowrap; }
.rb-param label .req { color: var(--amber); }
.rb-param .input { padding: 3px 8px; font-size: 0.75rem; font-family: var(--mono); }
.rb-param input[type="date"].input { color-scheme: dark; width: 138px; }
/* 枚举下拉:补回 select.input 被 .rb-param .input 覆盖掉的右侧留白(否则箭头压住文字) */
.rb-param select.input { padding: 3px 26px 3px 8px; }

/* 就绪后点亮的入口链接:玉色 wikilink 同族词汇 */
.rb-links { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 0 18px; }
.rb-links a {
  display: inline-flex; align-items: center; gap: 5px;
  font-family: var(--mono); font-size: 0.75rem; color: var(--jade); text-decoration: none;
  background: var(--tint-jade); border-radius: 4px; padding: 1px 8px;
  transition: background 150ms var(--ease);
}
.rb-links a:hover { background: color-mix(in oklab, var(--jade) 24%, transparent); }
.rb-links.off a { color: var(--faint); background: var(--tint-muted); pointer-events: none; }

/* 日志/输出:折叠块,mono tail;service 常驻可开合,command 执行后自动展开 */
.rb-out { margin: 8px 0 0 18px; }
.rb-out-head {
  display: inline-flex; align-items: center; gap: 6px; font-size: 0.6875rem; color: var(--faint);
  background: none; border: none; cursor: pointer; padding: 0;
}
.rb-out-head:hover { color: var(--muted); }
.rb-out-head .chev { font-size: 0.5625rem; transition: transform 150ms var(--ease); }
.rb-out.open .rb-out-head .chev { transform: rotate(90deg); }
.rb-out pre {
  display: none; margin-top: 6px; padding: 8px 12px; max-height: 180px; overflow-y: auto;
  font-family: var(--mono); font-size: 0.71875rem; line-height: 1.6; color: var(--muted);
  background: var(--surface-2); border: 1px solid var(--line-soft); border-radius: var(--r-s);
  white-space: pre-wrap;
}
.rb-out.open pre { display: block; }
.rb-out .exit-ok { color: var(--jade); }
.rb-out .exit-bad { color: var(--red); }

/* request 项:方法 + URL 一行;body/响应折叠;expect 是给人看的验收要点 */
.rb-method {
  font-family: var(--mono); font-size: 0.625rem; font-weight: 700; color: var(--blue);
  background: var(--tint-blue); border-radius: 4px; padding: 0 6px; flex: none;
}
.rb-url { font-family: var(--mono); font-size: 0.71875rem; color: var(--muted); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rb-expect { margin: 6px 0 0 18px; font-size: 0.71875rem; color: var(--muted); }
.rb-expect b { color: var(--ink); font-weight: 600; font-size: 0.6875rem; }
.rb-resp-meta { font-family: var(--mono); font-size: 0.6875rem; margin: 8px 0 0 18px; color: var(--muted); }
.rb-resp-meta .code-ok { color: var(--jade); font-weight: 600; }

/* 黑名单拦截提示:执行层机械拒绝(防自斩铁律),红=错误/禁止的既有词汇;
   与「依赖未就绪」的置灰区分——置灰是「还不能」,拦截是「永远不能」 */
.rb-blocked {
  margin: 8px 0 0 18px; padding: 7px 12px;
  font-size: 0.71875rem; color: var(--red); background: var(--tint-red);
  border-radius: var(--r-s);
}

/* cleanup 收尾行:面板最底,quiet 姿态;auto 提示 faint */
.rb-item.cleanup { display: flex; align-items: center; gap: 10px; background: var(--surface-2); }
.rb-item.cleanup .rb-cmd { margin: 0; flex: 1; }
.rb-item.cleanup .auto-note { font-size: 0.6875rem; color: var(--faint); flex: none; }

/* 依赖未就绪的置灰项:整行降透明,按钮 disabled 由 .btn:disabled 承接 */
.rb-item.dep-wait { opacity: 0.55; }
.rb-item.dep-wait .rb-state { color: var(--faint); }

.confirm-mask[hidden] { display: none; }
/* 确认弹层里的完整命令块(复用 .confirm-box) */
.confirm-box .cmd-block {
  font-family: var(--mono); font-size: 0.75rem; color: var(--ink);
  background: var(--surface-2); border: 1px solid var(--line-soft); border-radius: var(--r-s);
  padding: 10px 12px; margin-bottom: 14px; white-space: pre-wrap; overflow-wrap: anywhere;
}
.confirm-box .c-title { font-size: 0.875rem; font-weight: 600; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
.confirm-box .c-sub { font-size: 0.75rem; color: var(--muted); margin-bottom: 10px; }

@media (max-width: 430px) {
  .rb-actions .btn { min-height: 40px; }
  .rb-row { flex-wrap: wrap; row-gap: 4px; }
  .rb-params { margin-left: 0; }
  .rb-cmd, .rb-out, .rb-links, .rb-expect, .rb-resp-meta, .rb-blocked { margin-left: 0; }
}

/* ============ 轮次导航(吸顶轮次头 + ⌘⇧O 轮次目录) ============ */
/* 与 .find-anchor 同一套 sticky + 高度 0 的锚法;top 负值抵掉 .chat 的上内边距,
   负 margin 抵掉左右内边距,让这条带子与容器边缘齐平。 */
.turn-anchor { position: sticky; top: -20px; height: 0; z-index: var(--z-sticky); margin: 0 -28px; }
.turnhead {
  position: absolute; top: 0; left: 0; right: 0;
  display: flex; align-items: center; gap: 10px;
  padding: 7px 12px 7px 20px;
  /* 不透明底色:壁纸开启后 body 转透明,任何混进 transparent 的底色都会把壁纸漏到小字背后 */
  background: var(--surface-2);
  border-bottom: 1px solid var(--line-soft);
  box-shadow: 0 6px 18px oklch(0.03 0 0 / 0.35);
  opacity: 0; transform: translateY(-6px); pointer-events: none;
  transition: opacity 160ms var(--ease), transform 160ms var(--ease);
}
.turnhead.show { opacity: 1; transform: none; pointer-events: auto; }
.turnhead .th-n {
  flex: none; font-family: var(--mono); font-size: 0.6875rem; color: var(--jade);
  font-variant-numeric: tabular-nums; letter-spacing: 0.02em;
}
.turnhead .th-who { flex: none; font-size: 0.6875rem; font-weight: 600; color: var(--jade); }
/* flex:1 1 0 让它退出分行决策,长提问由省略号收口而不是把右侧导航挤下去 */
.turnhead .th-text {
  flex: 1 1 0; min-width: 0; font-size: 0.75rem; color: var(--ink); line-height: 1.4;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: left;
  background: none; border: 0; padding: 0; cursor: pointer; font-family: inherit;
  transition: color 150ms var(--ease);
}
.turnhead .th-text:hover { color: var(--jade); }
.turnhead .th-nav { display: flex; align-items: center; gap: 2px; flex: none; }
.turnhead .th-pos {
  font-family: var(--mono); font-size: 0.6875rem; color: var(--faint);
  font-variant-numeric: tabular-nums; margin-right: 4px;
}
.turnhead .th-btn, .btw .th-btn {
  display: inline-flex; align-items: center; justify-content: center; width: 24px; height: 22px;
  border: 0; border-radius: 4px; background: none; color: var(--muted); cursor: pointer;
  font-family: var(--mono); font-size: 0.75rem;
  transition: background 150ms var(--ease), color 150ms var(--ease);
}
.turnhead .th-btn:hover:not(:disabled), .btw .th-btn:hover:not(:disabled) { background: var(--hover); color: var(--ink); }
.turnhead .th-btn:disabled, .btw .th-btn:disabled { opacity: 0.35; cursor: default; }
.turnhead .th-sep { width: 1px; height: 14px; background: var(--line); margin: 0 4px; }

/* 跳转落点:目标气泡描一圈玉环再淡出,与弹窗选中环同一套词汇 */
.chat-msg.user .body { outline: 2px solid transparent; outline-offset: 3px; transition: outline-color 900ms var(--ease); }
.chat-msg.user.flash .body { outline-color: var(--jade); transition: none; }

/* 轮次目录弹窗:复用 .rp-box / .wd-search / .rp-list / .rp-item,只补行内三列 */
.to-box { width: min(640px, calc(100vw - 48px)); }
.to-box .rp-list { max-height: 400px; }
.to-box .rp-item { gap: 12px; padding: 8px 12px; }
.to-box .rp-item:hover { background: var(--hover); }
.to-box .rp-item.sel:hover { background: transparent; }
.to-n { flex: none; width: 2.6em; text-align: right; font-family: var(--mono); font-size: 0.6875rem; color: var(--faint); font-variant-numeric: tabular-nums; }
.to-text { flex: 1 1 0; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
.to-time { flex: none; font-family: var(--mono); font-size: 0.6875rem; color: var(--faint); font-variant-numeric: tabular-nums; }
.to-cur { flex: none; font-size: 0.6875rem; color: var(--jade); }
/* 未装载轮次:降为 muted 并挂中性标签——它在索引里但还没有节点,选中时先回填 */
.rp-item.unloaded .to-text { color: var(--muted); font-weight: 400; }
.to-tag { flex: none; font-size: 0.625rem; color: var(--faint); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; line-height: 1.5; }
.to-foot {
  display: flex; align-items: center; gap: 10px; padding: 8px 18px 10px;
  border-top: 1px solid var(--line-soft); font-size: 0.6875rem; color: var(--faint);
}
.to-foot .spacer { flex: 1; }
.to-foot kbd { font-family: var(--mono); font-size: 0.625rem; padding: 0 5px; border: 1px solid var(--line); border-radius: 4px; color: var(--muted); }

/* 玻璃档把 --surface-2 重定义成半透明,吸顶带会被掏空 —— 正文从它底下滚过去时
   两层字叠在一起没法读(2026-09-02 实测截图为证)。与 .dd-menu 同理:凡是「内容
   从下面经过」的浮层都不跟随玻璃档,固定用 surface-2 的不透明基色。 */
body.wall-glass .turnhead { background: oklch(0.165 0.007 120); }

@media (max-width: 720px) {
  .turn-anchor { margin: 0 -16px; }
  .turnhead { padding-left: 14px; gap: 8px; }
  .turnhead .th-who { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .turnhead, .turnhead .th-text, .turnhead .th-btn, .chat-msg.user .body { transition: none; }
}

/* ============ 本机偏好落到 <html>(见 lib/prefs.ts applyLocalToDom) ============ */
/* 字号走 root font-size,既有样式全用 rem,故整站等比跟随,不必逐处改 */
html[data-font-scale="sm"] { font-size: 15px; }
html[data-font-scale="lg"] { font-size: 17px; }
/* 「减少动效」显式开时按 prefers-reduced-motion 同款降级:过渡与动画一律瞬时完成。
   显式关则强行保留动效,即便系统开了减弱开关——这是用户在本机的最终决定。 */
html[data-motion="on"] *,
html[data-motion="on"] *::before,
html[data-motion="on"] *::after {
  transition-duration: 0.01ms !important;
  animation-duration: 0.01ms !important;
  animation-iteration-count: 1 !important;
  scroll-behavior: auto !important;
}
html[data-turn-head="false"] .turnhead { display: none; }

/* ============ 旁路提问(/btw):右侧停靠面板(原型 prototype-btw.html 形态 A) ============ */
/* 输入框顶部的旁路标记:文本以 /btw 开头时现出,发送键语义随之改为「问旁路」;紫 = 与主对话隔离的旁路语义 */
.btw-prefix { display: flex; align-items: center; gap: 7px; padding: 6px 12px 0; font-size: 0.6875rem; font-weight: 600; color: var(--violet); }
.btw-prefix-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--violet); }
.composer.btw-mode { border-color: var(--violet); }
.composer.btw-mode .send-btn { background: var(--violet); }
/* 状态条里的旁路计数:开合面板的第二入口 */
.btw-count { display: inline-flex; align-items: center; gap: 5px; font: inherit; color: var(--muted); background: none; border: 1px solid var(--line-soft); border-radius: 4px; padding: 0 7px 0 4px; cursor: pointer; white-space: nowrap; transition: color 150ms var(--ease), border-color 150ms var(--ease); }
.btw-count:hover { color: var(--ink); border-color: var(--line); }
.btw-count[aria-pressed="true"] { border-color: var(--violet); color: var(--ink); }
.btw-count .btw-bq { font-family: var(--mono); font-weight: 600; color: var(--violet); }
.btw-count b { font-family: var(--mono); font-weight: 500; color: var(--ink); }
.btw-count.live .btw-bq { animation: pulse 1.2s ease-in-out infinite; }
/* 停靠:主栏与面板并排,面板贯穿四行(消息区 / 状态条 / 输入框 / 终端行) */
.dispatch.btw-open { display: grid; grid-template-columns: minmax(0, 1fr) 400px; grid-template-rows: minmax(0, 1fr) auto auto auto auto; column-gap: 12px; }
.dispatch.btw-open > *:not(.btw) { grid-column: 1; }
.dispatch.btw-open > .btw { grid-column: 2; grid-row: 1 / -1; }
/* 停靠后主栏变窄:状态条各段允许压缩、用量条收短,不溢出到面板底下(原型实测 1440 宽) */
.dispatch.btw-open .chat-status { min-width: 0; gap: 10px; }
.dispatch.btw-open .sess-ctx { max-width: 22%; }
.dispatch.btw-open .u-chips { flex: 1 1 0; min-width: 0; gap: 8px; overflow: hidden; }
.dispatch.btw-open .u-chip { gap: 5px; }
.dispatch.btw-open .u-chip .u-bar { width: 30px; }
@media (max-width: 1180px) { .dispatch.btw-open { grid-template-columns: minmax(0, 1fr) 340px; } }

.btw { display: flex; flex-direction: column; min-height: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-m); animation: btw-in 200ms var(--ease); }
@keyframes btw-in { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
.btw-head { display: flex; align-items: center; gap: 8px; padding: 9px 10px 9px 14px; border-bottom: 1px solid var(--line-soft); }
.btw-title { font-size: 0.875rem; font-weight: 600; }
.btw-note { font-size: 0.6875rem; color: var(--violet); border: 1px solid color-mix(in oklab, var(--violet) 40%, transparent); border-radius: 4px; padding: 0 6px; white-space: nowrap; }
.btw-nav { display: flex; align-items: center; gap: 4px; }
.btw-nav .th-pos { font-family: var(--mono); font-size: 0.6875rem; color: var(--faint); }
.btw .th-btn { font-size: 0.8125rem; }
.btw-route { padding: 6px 14px; font-size: 0.6875rem; color: var(--faint); border-bottom: 1px solid var(--line-soft); }
.btw-one { display: flex; flex-direction: column; min-height: 0; flex: 1; }
.btw-q { display: flex; align-items: baseline; gap: 8px; padding: 12px 14px 6px; font-size: 0.875rem; color: var(--ink); line-height: 1.5; }
.btw-cmd { font-family: var(--mono); font-size: 0.75rem; color: var(--violet); flex: none; }
.btw-qtext { min-width: 0; overflow-wrap: anywhere; }
.btw-ts { margin-left: auto; font-family: var(--mono); font-size: 0.6875rem; color: var(--faint); flex: none; }
.btw-a { flex: 1; min-height: 0; overflow-y: auto; padding: 6px 14px 12px; font-size: 0.875rem; line-height: 1.6; color: var(--ink); }
.btw-synth { margin-bottom: 8px; font-size: 0.75rem; color: var(--amber); }
/* 等待态:不放占位骨架——旁路答案长短未知,骨架填的是实色,开壁纸时会退化成几条黑板。
   只留一行状态:三点(与助手正文 .typing 同一词汇,染成旁路紫)+ 已等秒数 + 承诺文案 + 取消。 */
.btw-wait { padding: 10px 14px 12px; }
.btw-wait-line { display: flex; align-items: center; gap: 8px; font-size: 0.75rem; color: var(--muted); min-height: 26px; }
.btw-wait-dots { display: inline-flex; gap: 4px; flex: none; }
.btw-wait-dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--violet); animation: pulse 1.2s ease-in-out infinite; }
.btw-wait-dots i:nth-child(2) { animation-delay: 0.2s; }
.btw-wait-dots i:nth-child(3) { animation-delay: 0.4s; }
.btw-wait-line .lab { color: var(--ink); font-weight: 600; flex: none; }
.btw-wait-line .el { font-family: var(--mono); font-size: 0.6875rem; color: var(--faint); font-variant-numeric: tabular-nums; flex: none; }
.btw-wait-line .note { color: var(--faint); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.btw-wait-line .el::before, .btw-wait-line .note::before { content: '\00b7'; margin-right: 6px; }
.btw-err { margin: 8px 14px 12px; padding: 10px 12px; border-radius: var(--r-s); background: var(--tint-amber); color: var(--amber); font-size: 0.8125rem; line-height: 1.6; }
.btw-err b { margin-right: 4px; }
.btw-err-act { display: flex; gap: 8px; margin-top: 8px; }
.btw-foot { display: flex; align-items: center; gap: 8px; padding: 8px 10px 10px 14px; border-top: 1px solid var(--line-soft); }
.btw-saved { display: flex; align-items: center; gap: 6px; font-size: 0.6875rem; color: var(--muted); white-space: nowrap; }
.btw-ok { width: 6px; height: 6px; border-radius: 50%; background: var(--green); }
.btw-hist { display: flex; flex-direction: column; min-height: 0; flex: 1; }
.btw-hist .rp-list { flex: 1; min-height: 0; overflow-y: auto; }
.btw-hist .rp-item { align-items: flex-start; }
.btw-h-q { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
.btw-h-a { display: block; font-weight: 400; color: var(--muted); font-size: 0.75rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
.btw-h-t { flex: none; font-family: var(--mono); font-size: 0.6875rem; color: var(--faint); }
.btw-h-mem { flex: none; font-size: 0.6875rem; color: var(--green); }
.btw-empty { padding: 18px 16px; font-size: 0.8125rem; color: var(--muted); line-height: 1.7; }
.btw-empty p + p { margin-top: 10px; }
.btw-empty code { font-family: var(--mono); color: var(--violet); }
@media (prefers-reduced-motion: reduce) { .btw { animation: none; } .btw-count.live .btw-bq, .btw-wait-dots i { animation: none; } }

/* 视口外的助手消息:markdown 还没解析,先按纯文本放着(LazyMd 占位)。
   排版与 .body.md 的正文一致,进视口换成真 markdown 时高度变化才小。 */
.md-pending { white-space: pre-wrap; word-break: break-word; }

/* ===== 看板娘(Live2D) =====
   类名一律 l2d- 前缀:内联真实样式表等于继承全站类名,短名很容易撞
   (仓库里已有 classname-collision 守卫测试)。 */

/* 舞台。canvas 本身 pointer-events:none——矩形画布吃了事件就会挡住底下的
   发送按钮和状态栏,命中判定在文档级做像素测试(见 Live2dStage.tsx)。 */
.l2d-stage {
  position: fixed;
  right: 24px;
  bottom: 24px;
  z-index: 60;
  pointer-events: none;
  transform-origin: 100% 100%;
}
.l2d-stage.l2d-left {
  right: auto;
  left: 24px;
  transform-origin: 0 100%;
}
.l2d-stage canvas { display: block; pointer-events: none; }

/* 气泡。底色写不透明硬值:玻璃档会把 --surface 重定义成半透明,
   而气泡是叠在正文与角色之上的浮层,透了就串字。 */
.l2d-bubble {
  position: absolute;
  right: 8px;
  bottom: calc(100% + 10px);
  width: 232px;
  z-index: 2;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: 12px;
  background: oklch(0.205 0.009 120);
  color: var(--ink);
  font-size: 0.8125rem;
  line-height: 1.55;
  box-shadow: 0 8px 28px -10px oklch(0 0 0 / 0.55);
  pointer-events: none;
  opacity: 0;
  transform: translateY(6px) scale(0.97);
  transform-origin: 100% 100%;
  transition: opacity 200ms var(--ease), transform 200ms var(--ease);
}
.l2d-bubble.l2d-on { opacity: 1; transform: none; }
.l2d-stage.l2d-left .l2d-bubble { right: auto; left: 8px; transform-origin: 0 100%; }
.l2d-bubble::after {
  content: "";
  position: absolute;
  right: 30px;
  bottom: -5px;
  width: 9px;
  height: 9px;
  background: inherit;
  border-right: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  transform: rotate(45deg);
}
.l2d-stage.l2d-left .l2d-bubble::after { right: auto; left: 30px; }
.l2d-bubble .l2d-tag {
  display: block;
  margin-bottom: 5px;
  color: var(--jade-dim);
  font-size: 0.625rem;
  font-weight: 600;
  letter-spacing: 0.08em;
}
.l2d-bubble.l2d-warn .l2d-tag { color: var(--amber); }
.l2d-bubble.l2d-bad .l2d-tag { color: var(--red); }

/* 设置里的模型选择。不复用 .stg-thumb:那套是壁纸预设的横向缩略图,
   尺寸与语义都不同。 */
.l2d-picks { display: flex; gap: 8px; }
.l2d-pick {
  width: 40px;
  height: 40px;
  flex: none;
  border: 1px solid var(--line);
  border-radius: 6px;
  background-color: var(--surface-2);
  background-size: cover;
  background-position: center;
  color: var(--faint);
  font-size: 0.875rem;
  cursor: pointer;
}
.l2d-pick:hover { border-color: var(--muted); }
.l2d-pick.active { border-color: var(--jade); outline: 1px solid var(--jade); }

@media (prefers-reduced-motion: reduce) {
  .l2d-bubble { transition: none; }
}

/* 接回长会话时列表头部的「显示更早的 N 条」:与工具卡同族的轻按钮,不抢正文 */
.chat-more-btn {
  display: block; margin: 4px auto 12px; padding: 5px 12px;
  font-size: 0.75rem; color: var(--muted); background: var(--surface);
  border: 1px solid var(--line-soft); border-radius: var(--r-s); cursor: pointer;
}
.chat-more-btn:hover { background: var(--hover); color: var(--ink); }

/* ============ 系统监控(DESIGN.md「系统监控」)—— 前缀 ram- / cpu- / mon-(已 grep 源码无撞名,非 Tailwind 工具类)。
   与获批原型 wiki/design/prototype-memory-monitor.html 逐条对应 ============ */
/* A. 状态栏指示器:就是标准 .sb-item,只额外定义数字的等级色与采样失败态 */
.sb-item[data-ram="stale"] { color: var(--faint); }
.sb-item[data-ram="stale"] .dot { background: transparent; border: 1px dashed var(--faint); }
.sb-item .n[data-lv="ok"] { color: var(--jade); }
.sb-item .n[data-lv="warn"] { color: var(--amber); }
.sb-item .n[data-lv="crit"] { color: var(--red); }
.ram-anchor { position: relative; display: inline-flex; align-items: center; gap: 4px; }
/* popover:与 .dd-menu 同一套浮层语汇,右对齐挂在指示器下方 */
.ram-pop {
  position: absolute; top: calc(100% + 8px); right: 0; width: 460px; max-width: calc(100vw - 32px);
  max-height: calc(100vh - 80px); overflow: auto;
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-m);
  box-shadow: 0 12px 32px oklch(0.05 0 0 / 0.5); z-index: var(--z-dropdown);
  padding: 14px 16px 12px; text-align: left; white-space: normal; font-family: var(--sans);
  animation: view-in 150ms var(--ease);
}
/* 浮层不随玻璃档透明(与 .dd-menu 同理:透出下方卡片会干扰读数) */
body.wall-glass .ram-pop { background: oklch(0.185 0.008 120); backdrop-filter: none; -webkit-backdrop-filter: none; }
.ram-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; }
.ram-head .pill { align-self: center; }
.ram-head .ram-ts { margin-left: auto; font-family: var(--mono); font-size: 0.6875rem; color: var(--faint); }
.cpu-tabs button { padding: 3px 12px; }
.ram-bars { display: grid; gap: 10px; margin-bottom: 14px; }
.ram-bar-lab { display: flex; justify-content: space-between; font-size: 0.6875rem; color: var(--muted); margin-bottom: 4px; }
.ram-bar-lab .n { font-family: var(--mono); color: var(--ink); font-variant-numeric: tabular-nums; }
/* 条形本体用首页 token 消耗对比条 .cmp-track;空闲/未用不画段,露出底轨 */
.ram-seg { height: 100%; }
.ram-seg[data-k="used"] { background: var(--chart-1); }
.ram-seg[data-k="cmp"], .ram-seg[data-k="sys"] { background: var(--chart-2); }
.ram-seg[data-k="cache"] { background: var(--chart-3); }
.cmp-legend .i-rail { background: var(--tint-muted); }
.ram-swapn[data-lv="ok"], .ram-swapn[data-lv="ok"] .n { color: var(--jade); }
.ram-swapn[data-lv="warn"], .ram-swapn[data-lv="warn"] .n { color: var(--amber); }
.ram-swapn[data-lv="crit"], .ram-swapn[data-lv="crit"] .n { color: var(--red); }
.cpu-load { display: flex; gap: 14px; flex-wrap: wrap; font-size: 0.6875rem; color: var(--muted); margin-top: 8px; }
.cpu-load .n { font-family: var(--mono); color: var(--ink); font-variant-numeric: tabular-nums; }
/* 排行:应用一行,可展开到进程;数字列等宽右对齐 */
.ram-list { border-top: 1px solid var(--line-soft); }
.ram-app { border-bottom: 1px solid var(--line-soft); }
.ram-row {
  display: grid; grid-template-columns: 14px minmax(0, 1fr) 64px 64px; gap: 8px; align-items: center;
  width: 100%; padding: 7px 4px; font-size: 0.75rem; color: var(--ink); text-align: left; border-radius: var(--r-s);
}
button.ram-row:hover { background: var(--hover); }
.ram-row .chev { color: var(--faint); font-size: 0.625rem; transition: transform 150ms var(--ease); }
.ram-app.open .ram-row .chev { transform: rotate(90deg); }
.ram-row .nm { display: flex; align-items: center; gap: 6px; min-width: 0; }
.ram-row .nm span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ram-row .v { font-family: var(--mono); font-variant-numeric: tabular-nums; text-align: right; }
.ram-row .v.sub { color: var(--muted); }
.ram-row.ram-colhead { font-size: 0.6875rem; color: var(--faint); padding-top: 0; }
.ram-procs { display: none; padding: 0 0 6px; }
.ram-app.open .ram-procs { display: block; }
.ram-procs .ram-row { padding: 4px 4px; font-size: 0.6875rem; color: var(--muted); }
.ram-procs .ram-row .nm span:first-child { font-family: var(--mono); }
.ram-procs .pid { font-family: var(--mono); color: var(--faint); flex: none; }
.ram-procs .ram-close-row { padding-top: 0; }
.ram-procs .ram-close { padding: 1px 8px; font-size: 0.625rem; }
.ram-procs .ram-own-note { color: var(--faint); }
.ram-own { flex: none; }
/* 点卡片数字 → 定位到该会话进程行:一次玉色描边淡出后留浅底 */
.ram-row.ram-hl { background: var(--tint-jade); animation: ram-hl 1.2s var(--ease); }
@keyframes ram-hl { from { box-shadow: inset 0 0 0 1px var(--jade); } to { box-shadow: inset 0 0 0 1px transparent; } }
@media (prefers-reduced-motion: reduce) { .ram-row.ram-hl { animation: none; } }
[data-motion="on"] .ram-row.ram-hl { animation: none; }
.ram-rest { font-size: 0.6875rem; color: var(--faint); padding: 7px 4px 0; display: flex; }
.ram-rest .v { margin-left: auto; font-family: var(--mono); }
/* 建议:琥珀 tint 块,与 .scard.blk 的「需要你处理」同一语汇 */
.ram-tip { margin-top: 12px; padding: 9px 12px; border-left: 2px solid var(--amber); background: var(--tint-amber); border-radius: 0 var(--r-s) var(--r-s) 0; font-size: 0.75rem; color: var(--ink); line-height: 1.55; }
.ram-tip code { font-family: var(--mono); font-size: 0.6875rem; color: var(--muted); }
.ram-tip b { font-weight: 600; }
.ram-tip-line + .ram-tip-line { margin-top: 6px; padding-top: 6px; border-top: 1px dashed color-mix(in oklab, var(--amber) 30%, transparent); }
.ram-tip .ram-rule { display: block; font-family: var(--mono); font-size: 0.625rem; color: var(--faint); margin-top: 2px; }
.cpu-jump { color: var(--jade); text-decoration: underline; text-underline-offset: 2px; font-size: 0.6875rem; margin-left: 6px; }
.cpu-jump:hover { color: var(--ink); }
.ram-foot { margin-top: 10px; font-size: 0.6875rem; color: var(--faint); line-height: 1.5; }
.ram-err { padding: 6px 0 2px; font-size: 0.75rem; color: var(--muted); line-height: 1.6; }
.ram-err code { font-family: var(--mono); color: var(--ink); }
/* B. 会话卡片数字:.top 行尾等宽数字;超阈值用状态色,非装饰 */
.ram-chip {
  margin-left: auto; flex: none; font-family: var(--mono); font-size: 0.6875rem; color: var(--faint);
  font-variant-numeric: tabular-nums; white-space: nowrap;
}
button.ram-chip { padding: 1px 4px; margin-right: -4px; border-radius: 4px; }
button.ram-chip:hover { background: var(--hover); }
.ram-chip[data-lv="warn"] { color: var(--amber); }
.ram-chip[data-lv="hot"] { color: var(--red); font-weight: 600; }
.ram-chip[data-lv="gone"] { color: var(--faint); opacity: 0.8; cursor: default; }
.cpu-chip + .ram-chip { margin-left: 8px; }
.scard[data-ram-lv="warn"] { border-left: 2px solid var(--amber); }
.scard[data-ram-lv="hot"] { border-left: 2px solid var(--red); }
/* C. 设置 › 系统监控:只补校验失败文案色,其余全用 .stg-* */
.stg-lab small.mon-invalid { color: var(--amber); }

/* ============================================================
   全局终端(DESIGN.md「全局终端」):⌘` 呼出的悬浮卡片 + 状态栏指示器
   整块终端表面(标签栏 + 正文)用终端主题色(--t-*,由组件按 Ghostty/自定义外观注入),
   不用璇玑玉色 token——它要看起来和用户本机的终端是同一个东西。
   ============================================================ */
.tty-c {
  /* 左缘跟随侧栏宽度(14.125rem 随「正文字号」缩放),不写死 226px */
  position: fixed; left: calc(14.125rem + 12px); right: 12px; bottom: 12px; z-index: var(--z-drawer);
  height: var(--tty-h, 340px); min-height: 140px; max-height: calc(100vh - 56px);
  display: flex; flex-direction: column; overflow: hidden;
  border-radius: var(--r-m);
  color: var(--t-fg);
  /* 终端镜像例外(DESIGN.md Elevation):透明度与模糊镜像用户 Ghostty 配置,读不到时为 100% / 0 */
  background: color-mix(in srgb, var(--t-bg) var(--t-op, 100%), transparent);
  /* backdrop-filter 由组件内联设置(构建链会吃掉无前缀写法,见 Terminal.tsx) */
  border: 1px solid color-mix(in srgb, var(--t-fg) 14%, transparent);
  box-shadow: 0 18px 48px oklch(0 0 0 / .45), 0 2px 8px oklch(0 0 0 / .3);
  /* 只动 transform:呼出 160ms ease-out,收起 150ms ease-in 后再隐藏;transition 连按可中途折返 */
  transform: translate3d(0, calc(100% + 12px), 0); visibility: hidden;
  transition: transform 150ms cubic-bezier(.55, .055, .675, .19), visibility 0s linear 150ms;
  will-change: transform;
}
.tty-c.open { transform: none; visibility: visible; transition: transform 160ms var(--ease), visibility 0s; }
.tty-c.dragging { transition: none; user-select: none; }
.tty-c.max { height: calc(100vh - 56px); }
@media (prefers-reduced-motion: reduce) {
  .tty-c { transform: none; opacity: 0; transition: opacity 80ms linear, visibility 0s linear 80ms; }
  .tty-c.open { opacity: 1; transition: opacity 80ms linear, visibility 0s; }
}
html[data-motion="off"] .tty-c { transform: none; opacity: 0; transition: opacity 80ms linear, visibility 0s linear 80ms; }
html[data-motion="off"] .tty-c.open { opacity: 1; transition: opacity 80ms linear, visibility 0s; }
@media (max-width: 960px) { .tty-c { left: 12px; } }
/* 手机端不提供终端(后端也拒绝经 Tailscale 的请求) */
@media (max-width: 430px) { .tty-c, .tty-sb { display: none; } }

.tty-bgimg { position: absolute; inset: 0; pointer-events: none; background: center / cover no-repeat; opacity: var(--t-imgop, .35); display: none; }
.tty-c.has-img .tty-bgimg { display: block; }
.tty-c > :not(.tty-bgimg) { position: relative; }

.tty-grip { height: 7px; flex: none; cursor: row-resize; touch-action: none; }
.tty-grip::after { content: ""; position: absolute; left: 50%; top: 3px; width: 36px; height: 2px; margin-left: -18px; border-radius: 1px; background: color-mix(in srgb, var(--t-fg) 22%, transparent); }
.tty-grip:hover::after { background: var(--t-accent); }

.tty-head { display: flex; align-items: center; gap: 6px; padding: 0 8px 0 6px; font-size: 0.75rem; border-bottom: 1px solid color-mix(in srgb, var(--t-fg) 9%, transparent); flex: none; }
