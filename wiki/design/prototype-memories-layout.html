.tty-spacer { flex: 1; }
.tty-tabs { display: flex; align-items: flex-end; gap: 2px; overflow-x: auto; overflow-y: hidden; min-width: 0; scrollbar-width: none; }
/* 标签的 -1px 下边距让内容比容器高 1px:纵向设 hidden 免得冒出纵向滚动条;Safari 17(Pake 壳)不认
   scrollbar-width,靠 ::-webkit-scrollbar 隐藏(Chrome 121+ 见到 scrollbar-width 会忽略这条,互不干扰) */
.tty-tabs::-webkit-scrollbar { display: none; }
.tty-tab {
  display: inline-flex; align-items: center; gap: 7px; padding: 7px 10px 6px; margin-bottom: -1px;
  font: 0.75rem/1.2 var(--mono); white-space: nowrap; cursor: pointer;
  color: color-mix(in srgb, var(--t-fg) 62%, transparent);
  background: none; border: none; border-bottom: 2px solid transparent;
}
.tty-tab:hover { color: var(--t-fg); }
.tty-tab.active { color: var(--t-fg); border-bottom-color: var(--t-accent); }
.tty-tab .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--t-dim); flex: none; }
.tty-tab.run .dot { background: var(--t-ok); animation: pulse 1.6s var(--ease) infinite; }
.tty-proc { color: var(--t-dim); }
.tty-x { color: var(--t-dim); padding: 0 3px; border-radius: 3px; line-height: 1; font-size: 0.8125rem; }
.tty-x:hover { background: color-mix(in srgb, var(--t-fg) 12%, transparent); color: var(--t-fg); }
.tty-add, .tty-ib, .tty-cwd {
  background: none; border: none; cursor: pointer; border-radius: var(--r-s);
  color: color-mix(in srgb, var(--t-fg) 62%, transparent);
}
.tty-add { padding: 5px 9px; font-size: 0.9375rem; }
.tty-ib { padding: 4px 7px; font-size: 0.8125rem; line-height: 1; }
.tty-cwd { display: inline-flex; align-items: center; gap: 5px; padding: 4px 8px; font: 0.75rem var(--mono); max-width: 36ch; }
.tty-cwd > span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tty-cwd .caret { font-size: 0.5625rem; }
.tty-add:hover, .tty-ib:hover, .tty-cwd:hover, .tty-cwd[aria-expanded="true"] { background: color-mix(in srgb, var(--t-fg) 10%, transparent); color: var(--t-fg); }
.tty-add:focus-visible, .tty-ib:focus-visible, .tty-cwd:focus-visible, .tty-tab:focus-visible { outline: 2px solid var(--t-accent); outline-offset: -2px; }

.tty-host { position: relative; flex: 1; min-height: 0; }
.tty-pane { position: absolute; inset: 6px 4px 4px 10px; visibility: hidden; }
.tty-pane.active { visibility: inherit; }
/* xterm 画布全透明,背景由 .tty-c 自己画(透明度 / 背景图) */
.tty-pane .xterm, .tty-pane .xterm-viewport, .tty-pane .xterm-screen { background: transparent !important; }
.tty-pane .xterm-viewport { scrollbar-width: thin; scrollbar-color: color-mix(in srgb, var(--t-fg) 25%, transparent) transparent; }

/* 目录菜单:portal 到 body(浮层 overflow:hidden 会裁掉原地菜单),属璇玑外壳,用实心 surface */
.tty-menu {
  position: fixed; z-index: var(--z-toast); width: 300px; max-height: 320px; overflow-y: auto;
  background: var(--surface-opaque, var(--surface)); border: 1px solid var(--line); border-radius: var(--r-m);
  padding: 4px; box-shadow: 0 8px 24px oklch(0.05 0 0 / 0.5);
}
.tty-menu-title { font-size: 0.6875rem; color: var(--faint); padding: 6px 10px 4px; }
.tty-menu-sep { height: 1px; background: var(--line-soft); margin: 4px 0; }
.tty-menu-path { color: var(--faint); font-size: 0.6875rem; flex: none; max-width: 55%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tty-menu .tty-ctx .dd-item-label { color: var(--jade); }

/* 状态栏指示器:未开 faint 点,已开玉色,有命令在跑玉色脉冲 */
.sb-item.tty-sb .dot { background: var(--faint); }
.sb-item.tty-sb.on .dot { background: var(--jade); }
.sb-item.tty-sb.run .dot { animation: pulse 1.6s var(--ease) infinite; }

/* 设置 › 终端 */
.tty-src { display: flex; align-items: center; gap: 8px; margin: 10px 0 2px; padding: 8px 10px; font-size: 0.75rem; color: var(--muted); background: var(--surface-2); border: 1px solid var(--line-soft); border-radius: var(--r-s); }
.tty-src code { font-family: var(--mono); font-size: 0.6875rem; color: var(--faint); overflow-wrap: anywhere; }
.tty-src .btn-quiet { margin-left: auto; font-size: 0.6875rem; padding: 3px 8px; flex: none; }
.tty-src-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); flex: none; }
.tty-src-dot.off { background: var(--faint); }
.stg-row.tty-wide { flex-wrap: wrap; row-gap: 10px; }
.stg-row.tty-wide .stg-lab { flex: 1 1 0; }
.stg-row.tty-wide .tty-themes { order: 3; flex: 1 1 100%; }
.tty-themes { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 6px; }
.tty-theme { display: flex; flex-direction: column; gap: 5px; padding: 6px; border-radius: var(--r-s); border: 1px solid var(--line-soft); background: none; text-align: left; font-size: 0.6875rem; color: var(--muted); cursor: pointer; }
.tty-theme:hover { border-color: var(--line); color: var(--ink); }
.tty-theme:focus-visible { outline: 2px solid var(--jade); outline-offset: 1px; }
.tty-theme[aria-checked="true"] { border-color: var(--jade-dim); color: var(--ink); box-shadow: inset 0 0 0 1px var(--jade-dim); }
.tty-theme-sw { display: flex; align-items: center; gap: 3px; height: 22px; padding: 0 5px; border-radius: 3px; overflow: hidden; font: 0.6875rem var(--mono); }
.tty-theme-sw i { width: 7px; height: 7px; border-radius: 50%; flex: none; }
.tty-theme-name span { color: var(--faint); }
.tty-color { display: inline-flex; align-items: center; gap: 8px; font: 0.75rem var(--mono); color: var(--muted); cursor: pointer; }
.tty-color input { width: 28px; height: 22px; padding: 0; border: 1px solid var(--line); border-radius: 4px; background: none; cursor: pointer; }
.tty-color input::-webkit-color-swatch-wrapper { padding: 2px; }
.tty-color input::-webkit-color-swatch { border: none; border-radius: 2px; }
.tty-img-thumb { width: 36px; height: 22px; border-radius: 3px; background: center / cover no-repeat var(--surface-2); border: 1px solid var(--line-soft); flex: none; }
.tty-font-val { font: 0.8125rem "JetBrains Mono", var(--mono); color: var(--ink); }
.stg-lab small.tty-warn { color: var(--amber); }
kbd.tty-kbd-warn { border-color: var(--amber); color: var(--amber); }

/* ============ 提示词库(pl-)—— 管理页列表 / 抽屉编辑器 / 派发页面板分组与钉选 chip ============ */
/* 斜杠面板里的分组标题:只在空 `/` 时出现,输入字符后退化成扁平表 */
.pl-grp {
  display: flex; align-items: center; gap: 8px; padding: 7px 10px 3px;
  font-size: 0.625rem; font-weight: 600; letter-spacing: .06em; color: var(--faint);
}
.pl-grp + .pl-grp { margin-top: 2px; }
.pl-grp .n { font-family: var(--mono); font-weight: 400; }
.pl-grp .act { margin-left: auto; font-weight: 400; letter-spacing: 0; color: var(--faint); font-family: var(--mono); }
/* 提示词行与命令行的区别只有一枚「插入」小标:提醒它不是执行,是填进输入框让你改 */
.pl-tag {
  display: inline-block; font-size: 0.5625rem; font-weight: 600; letter-spacing: .06em; line-height: 1;
  padding: 2px 5px; border-radius: 3px; margin-right: 7px; vertical-align: 1px;
  color: var(--violet); background: color-mix(in oklab, var(--violet) 14%, var(--surface));
}
.xj-slash-item.sel .pl-tag { color: var(--ink); background: color-mix(in oklab, var(--violet) 30%, var(--surface)); }
/* 空状态下的钉选 chip 复用 .sugg 的像素,只加触发词小字与一行管理入口 */
.pl-manage { margin-top: 12px; font-size: 0.6875rem; color: var(--faint); }
.pl-manage button { color: var(--faint); text-decoration: underline dotted; text-underline-offset: 3px; }
.pl-manage button:hover { color: var(--jade); }
.sugg button .pl-k { font-family: var(--mono); font-size: 0.625rem; color: var(--faint); margin-left: 6px; }
.sugg button:hover .pl-k { color: inherit; }
/* 管理页列表:沿用 .mem-item 的行高与 hover,列为「钉 / 触发词 / 名称 / 正文首行 / 作用域 / 次数」 */
.pl-item {
  display: grid; grid-template-columns: 22px 92px minmax(96px, auto) 1fr auto 52px;
  align-items: center; gap: 12px; padding: 9px 14px;
  border-bottom: 1px solid var(--line-soft); cursor: pointer; transition: background 150ms var(--ease);
}
.pl-item:hover { background: var(--hover); }
.pl-item:last-child { border-bottom: none; }
.pl-item .pin { width: 22px; height: 22px; display: grid; place-items: center; border-radius: var(--r-s); color: var(--faint); }
.pl-item .pin svg { width: 14px; height: 14px; }
.pl-item .pin:hover { background: var(--tint-jade); color: var(--jade); }
.pl-item .pin.on { color: var(--jade); }
.pl-item .trig { font-family: var(--mono); font-size: 0.75rem; color: var(--muted); white-space: nowrap; }
.pl-item .name { font-size: 0.8125rem; color: var(--ink); white-space: nowrap; }
.pl-item .prev { color: var(--muted); font-size: 0.75rem; font-family: var(--mono); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pl-item .uses { font-family: var(--mono); font-size: 0.6875rem; color: var(--faint); text-align: right; }
.pl-scope { font-size: 0.625rem; font-weight: 600; padding: 2px 7px; border-radius: 99px; white-space: nowrap; }
.pl-scope.global { color: var(--muted); background: var(--tint-muted); }
.pl-scope.proj { color: var(--jade); background: var(--tint-jade); font-family: var(--mono); font-weight: 500; }
@media (max-width: 760px) {
  .pl-item { grid-template-columns: 22px 1fr auto; }
  .pl-item .trig, .pl-item .prev, .pl-item .uses { display: none; }
}
/* 抽屉编辑器 */
.pl-field { margin-bottom: 16px; }
.pl-field > label { display: block; font-size: 0.6875rem; font-weight: 600; letter-spacing: .04em; color: var(--muted); margin-bottom: 6px; }
.pl-field .help { font-size: 0.6875rem; color: var(--faint); margin-top: 6px; }
.pl-row { display: flex; gap: 12px; flex-wrap: wrap; }
.pl-row .pl-field { flex: 1 1 160px; margin-bottom: 0; }
.pl-row + .pl-field, .pl-row + .pl-row { margin-top: 16px; }
.pl-trig { display: flex; align-items: center; }
.pl-trig .pre { font-family: var(--mono); font-size: 0.8125rem; color: var(--faint); padding: 0 8px 0 2px; }
.pl-trig .input { font-family: var(--mono); flex: 1; }
/* 作用域下拉:候选是全部项目目录(常 30+ 项),自绘菜单本身不设高度上限,这里封顶并内部滚动 */
.pl-scope-dd .dd-menu { max-height: 320px; overflow-y: auto; max-width: none; }
.pl-body {
  width: 100%; min-height: 168px; resize: vertical; font-family: var(--mono); font-size: 0.78125rem; line-height: 1.55;
  padding: 10px 12px; color: var(--ink); background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-m);
}
.pl-body:focus { outline: none; border-color: var(--jade); }
.pl-vars { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; align-items: center; }
.pl-vars .lab { font-size: 0.6875rem; color: var(--faint); margin-right: 2px; }
.pl-vars button {
  font-family: var(--mono); font-size: 0.6875rem; padding: 2px 8px; border-radius: 99px;
  color: var(--violet); background: color-mix(in oklab, var(--violet) 12%, var(--surface)); border: 1px solid transparent;
}
.pl-vars button:hover { border-color: var(--violet); }
.pl-preview {
  font-family: var(--mono); font-size: 0.75rem; line-height: 1.55; color: var(--muted); white-space: pre-wrap;
  padding: 10px 12px; border: 1px dashed var(--line); border-radius: var(--r-m); background: transparent;
}
.pl-preview .cur { display: inline-block; width: 1px; height: 1em; background: var(--jade); vertical-align: -2px; margin: 0 1px; animation: pl-blink 1s steps(1) infinite; }
@keyframes pl-blink { 50% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .pl-preview .cur { animation: none; } }
/* 管理页空状态里的示例 */
.pl-empty-eg { display: inline-grid; gap: 6px; margin: 14px auto 0; text-align: left; font-family: var(--mono); font-size: 0.75rem; color: var(--faint); }
.pl-empty-eg span b { color: var(--muted); font-weight: 500; }


/* ================= 以下为本原型新增(前缀 xjm-) ================= */
/* 占满视口剩余高度的容器:高度由脚本量出(线上用 flex 列实现),内部各栏独立滚动,搜索框永远在视线内 */
.xjm-fill { height: var(--xjm-h, 70vh); min-height: 320px; }
.xjm-scroll { overflow-y: auto; min-height: 0; overscroll-behavior: contain; }
.xjm-scroll:focus { outline: none; }

/* 搜索框:右端内嵌快捷键提示,聚焦后隐去 */
.xjm-search { position: relative; display: block; flex: 1 1 12rem; max-width: 20rem; min-width: 10rem; }
.xjm-search .input { width: 100%; padding-right: 44px; }
.xjm-kbd {
  position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
  font-family: var(--mono); font-size: 0.625rem; line-height: 1.5; padding: 0 5px;
  border: 1px solid var(--line); border-radius: 4px; color: var(--faint); pointer-events: none;
  transition: opacity 150ms var(--ease);
}
.xjm-search:focus-within .xjm-kbd, .xjm-search .input:not(:placeholder-shown) ~ .xjm-kbd { opacity: 0; }
.xjm-count { margin-left: auto; font-size: 0.75rem; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.xjm-count button { color: var(--jade); margin-left: 8px; }
.xjm-count button:hover { text-decoration: underline; }

/* 命中高亮:琥珀底,不改字色层级 */
.xjm-hit { background: color-mix(in oklab, var(--amber) 30%, transparent); color: var(--ink); border-radius: 2px; }
/* 键盘选中行:底色 + 细描边,不用侧边色条 */
.mem-item.xjm-sel, .xjm-brow.xjm-sel { background: var(--hover); box-shadow: inset 0 0 0 1px color-mix(in oklab, var(--jade) 45%, transparent); }
.mem-item .xjm-from { color: var(--faint); margin-right: 6px; }

/* ---------- 方案 A:项目栏 ---------- */
.xjm-a { display: grid; grid-template-columns: 13rem minmax(0, 1fr); gap: 24px; }
.xjm-rail { overflow-y: auto; min-height: 0; display: flex; flex-direction: column; gap: 1px; padding-right: 4px; }
.xjm-rail button {
  display: flex; align-items: baseline; gap: 8px; width: 100%; text-align: left;
  padding: 6px 10px; border-radius: var(--r-s); font-size: 0.8125rem; color: var(--muted);
  transition: background 150ms var(--ease), color 150ms var(--ease);
}
.xjm-rail button:hover { background: var(--hover); color: var(--ink); }
.xjm-rail button.active { background: var(--hover); color: var(--ink); font-weight: 600; }
.xjm-rail button:focus-visible { outline: 2px solid var(--jade); outline-offset: -2px; }
.xjm-rail .xjm-pname { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.xjm-rail .xjm-n { font-family: var(--mono); font-size: 0.6875rem; color: var(--faint); font-weight: 400; font-variant-numeric: tabular-nums; }
.xjm-rail button.active .xjm-n { color: var(--muted); }
.xjm-rail button.xjm-zero { opacity: 0.45; }
.xjm-rail .xjm-rail-sep { height: 1px; background: var(--line-soft); margin: 6px 10px; flex: none; }
.xjm-col { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.xjm-col .mem-toolbar { flex: none; }
.xjm-col .xjm-scroll { flex: 1; padding-right: 4px; }
.xjm-col .mem-group:last-child { margin-bottom: 0; }

/* ---------- 方案 B:项目筛选条 + 双栏 ---------- */
.xjm-chips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin: -6px 0 14px; position: relative; }
.xjm-chip {
  display: inline-flex; align-items: baseline; gap: 6px; padding: 3px 10px;
  border: 1px solid var(--line-soft); border-radius: var(--r-s);
  font-size: 0.75rem; color: var(--muted); white-space: nowrap;
  transition: background 150ms var(--ease), color 150ms var(--ease), border-color 150ms var(--ease);
}
.xjm-chip:hover { color: var(--ink); border-color: var(--line); }
.xjm-chip.active { background: var(--hover); color: var(--ink); border-color: var(--line); font-weight: 600; }
.xjm-chip:focus-visible { outline: 2px solid var(--jade); outline-offset: 1px; }
.xjm-chip .xjm-n { font-family: var(--mono); font-size: 0.6875rem; color: var(--faint); font-weight: 400; }
.xjm-chip.xjm-zero { opacity: 0.45; }
.xjm-more { position: relative; }
.xjm-menu {
  position: absolute; top: calc(100% + 6px); left: 0; z-index: var(--z-dropdown);
  min-width: 15rem; max-height: 320px; overflow-y: auto; padding: 4px;
  background: var(--surface-opaque); border: 1px solid var(--line); border-radius: var(--r-m);
  box-shadow: 0 8px 24px oklch(0.05 0 0 / 0.5);
}
.xjm-menu[hidden] { display: none; }
.xjm-menu button {
  display: flex; align-items: baseline; gap: 12px; width: 100%; text-align: left;
  padding: 5px 10px; border-radius: 4px; font-size: 0.8125rem; color: var(--muted);
}
.xjm-menu button:hover, .xjm-menu button.active { background: var(--hover); color: var(--ink); }
.xjm-menu .xjm-pname { flex: 1; }
.xjm-menu .xjm-n { font-family: var(--mono); font-size: 0.6875rem; color: var(--faint); }

.xjm-split { display: grid; grid-template-columns: minmax(20rem, 38%) minmax(0, 1fr); gap: 16px; }
.xjm-bgroup {
  position: sticky; top: 0; z-index: 1; padding: 7px 16px;
  font-size: 0.6875rem; font-weight: 600; color: var(--muted);
  background: var(--surface-opaque); border-bottom: 1px solid var(--line-soft);
  display: flex; gap: 8px; align-items: baseline;
}
.xjm-bgroup .xjm-n { font-family: var(--mono); font-weight: 400; color: var(--faint); }
.xjm-brow { padding: 9px 16px 10px; border-bottom: 1px solid var(--line-soft); cursor: pointer; transition: background 120ms var(--ease); }
.xjm-brow:hover { background: var(--hover); }
.xjm-brow:last-child { border-bottom: none; }
.xjm-brow-top { display: flex; align-items: baseline; gap: 8px; }
.xjm-brow-top .name { font-family: var(--mono); font-size: 0.78125rem; color: var(--ink); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.xjm-brow .desc {
  margin-top: 3px; color: var(--muted); font-size: 0.78125rem; line-height: 1.5;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
}
.xjm-pane { display: flex; flex-direction: column; min-height: 0; min-width: 0; overflow: hidden; }
.xjm-pane-head { padding: 16px 24px 12px; border-bottom: 1px solid var(--line-soft); flex: none; }
.xjm-pane-head h2 { font-size: 1rem; font-family: var(--mono); font-weight: 500; overflow-wrap: anywhere; }
.xjm-pane-head .meta { font-size: 0.75rem; color: var(--muted); margin-top: 6px; display: flex; gap: 12px; flex-wrap: wrap; align-items: baseline; }
.xjm-pane-body { flex: 1; overflow-y: auto; padding: 18px 24px 24px; min-height: 0; }
.xjm-pane-foot { padding: 10px 24px; border-top: 1px solid var(--line-soft); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; flex: none; }
.xjm-pane-empty { margin: auto; text-align: center; color: var(--muted); font-size: 0.8125rem; padding: 24px; }
.xjm-pos { margin-left: auto; font-family: var(--mono); font-size: 0.6875rem; color: var(--faint); }

.xjm-data-note { margin-top: 8px; font-size: 0.625rem; color: var(--faint); line-height: 1.5; }

@media (max-width: 900px) {
  .xjm-a { grid-template-columns: 1fr; }
  .xjm-rail { flex-direction: row; overflow-x: auto; }
  .xjm-rail button { width: auto; flex: none; }
  .xjm-split { grid-template-columns: 1fr; }
  .xjm-pane { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  .xjm-rail button, .xjm-chip, .xjm-brow, .xjm-kbd { transition: none; }
}

/* 原型开关浮层(照抄 prototype-prompts.html,仅原型使用) */
.proto-hint {
  position: fixed; right: 16px; bottom: 16px; z-index: var(--z-toast);
  background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-m);
  padding: 10px 14px; font-size: 0.75rem; color: var(--muted);
  box-shadow: 0 8px 24px oklch(0.05 0 0 / 0.5); max-width: 320px;
}
.proto-hint b { color: var(--jade); font-size: 0.6875rem; letter-spacing: .04em; display: block; margin-bottom: 6px; }
.proto-hint kbd { font-family: var(--mono); font-size: 0.625rem; padding: 1px 5px; border: 1px solid var(--line); border-radius: 4px; background: var(--surface-2); color: var(--muted); }
.proto-hint .sw { margin-top: 8px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.proto-hint .sw-lab { font-size: 0.625rem; color: var(--faint); letter-spacing: .04em; margin-right: 2px; }
.proto-hint .sw button { border: 1px solid var(--line); border-radius: var(--r-s); padding: 3px 9px; font-size: 0.6875rem; color: var(--muted); }
.proto-hint .sw button.on { background: var(--tint-jade); color: var(--jade); border-color: transparent; }
@media (max-width: 720px) { .proto-hint { display: none; } }
body:has(.drawer.show) .proto-hint { display: none; } /* 抽屉开着时让位给底部操作栏 */
body.wall-glass .proto-hint { background: var(--surface-opaque); }

.proto-hint b { cursor: pointer; }

.proto-hint.xjm-min b { margin-bottom: 0; }
.proto-hint.xjm-min b::after { content: ' · 展开'; }
.proto-hint.xjm-min > :not(b) { display: none; }
